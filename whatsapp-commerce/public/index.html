<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>WhatsApp Commerce</title>
<style>
:root{--bg:#f5f7f6;--card:#fff;--ink:#17201b;--mute:#5d6b63;--line:#dfe5e1;--brand:#128c4a;--bar:#128c4a;--brand2:#0b6b38;--warn:#b5470b;--bubble-in:#fff;--bubble-out:#d9fdd3;--chat:#efeae2}
@media (prefers-color-scheme:dark){:root{--bg:#0f1512;--card:#17201b;--ink:#e7efe9;--mute:#9aaba1;--line:#2a362f;--brand:#25d366;--bar:#17a050;--brand2:#1fb457;--bubble-in:#202c33;--bubble-out:#005c4b;--chat:#0b141a}}
*{box-sizing:border-box}body{margin:0;font:14px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--ink)}
header{display:flex;align-items:center;gap:12px;padding:12px 16px;background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:2;flex-wrap:wrap}
header h1{font-size:16px;margin:0;flex:1}nav{display:flex;gap:2px;flex-wrap:nowrap;overflow-x:auto;order:3;flex-basis:100%;scrollbar-width:thin;padding-bottom:2px}nav button{white-space:nowrap}
nav button{background:none;border:0;padding:6px 10px;border-radius:8px;color:var(--mute);cursor:pointer;font:inherit}nav button.on{background:var(--brand);color:#fff}
main{max-width:1100px;margin:0 auto;padding:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:16px}
h2{font-size:15px;margin:0 0 12px}h3{font-size:13px;margin:16px 0 8px;color:var(--mute);text-transform:uppercase;letter-spacing:.04em}
label{display:block;font-size:12px;color:var(--mute);margin:8px 0 2px}
input,select,textarea{width:100%;padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit}
textarea{min-height:70px}
.btn{background:var(--brand);color:#fff;border:0;border-radius:8px;padding:8px 14px;cursor:pointer;font:inherit}.btn:hover{background:var(--brand2)}
.btn.ghost{background:none;color:var(--brand);border:1px solid var(--line)}
.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:8px;border-bottom:1px solid var(--line);vertical-align:top}th{font-size:12px;color:var(--mute)}
.tablewrap{overflow-x:auto}
.pill{display:inline-block;padding:2px 8px;border-radius:99px;font-size:12px;background:var(--bg);border:1px solid var(--line)}
.pill.warn{color:var(--warn);border-color:var(--warn)}
.pill.ok{color:var(--brand);border-color:var(--brand)}
.stat{font-size:22px;font-weight:600}.mute{color:var(--mute)}
code{background:var(--bg);padding:2px 6px;border-radius:6px;word-break:break-all}
.chat{background:var(--chat);border-radius:12px;padding:12px;height:440px;overflow-y:auto;display:flex;flex-direction:column;gap:6px}
.b{max-width:80%;padding:8px 10px;border-radius:10px;white-space:pre-wrap;word-wrap:break-word}.b.in{background:var(--bubble-out);align-self:flex-end}.b.out{background:var(--bubble-in);align-self:flex-start}
.b img{max-width:100%;border-radius:8px;display:block;margin-bottom:6px}
.acts{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}.acts button{background:var(--card);color:var(--brand);border:1px solid var(--line);border-radius:8px;padding:4px 8px;cursor:pointer;font:inherit;font-size:13px}
.split{display:grid;grid-template-columns:280px 1fr;gap:12px}@media (max-width:760px){.split{grid-template-columns:1fr}}
.list-item{padding:8px;border-radius:8px;cursor:pointer;border:1px solid transparent}.list-item:hover,.list-item.on{border-color:var(--line);background:var(--bg)}
#toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:8px;display:none;z-index:9}
.hidden{display:none}
.bars{display:flex;align-items:flex-end;gap:2px;height:180px;border-bottom:1px solid var(--line);position:relative}
.bars .bw{flex:1;height:100%;display:flex;align-items:flex-end;position:relative;cursor:default}
.bars .bar{width:100%;background:var(--bar);border-radius:4px 4px 0 0;min-height:2px}
.bars .bw:hover .bar{filter:brightness(1.15)}
.bars .tip{display:none;position:absolute;bottom:calc(100% + 4px);left:50%;transform:translateX(-50%);background:var(--card);border:1px solid var(--line);color:var(--ink);padding:4px 8px;border-radius:6px;font-size:12px;white-space:nowrap;z-index:3;box-shadow:0 2px 8px rgba(0,0,0,.12)}
.bars .bw:hover .tip{display:block}
/* flow builder */
.fb{display:flex;flex-direction:column;height:calc(100vh - 110px);min-height:520px;background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.fb-top{display:flex;gap:8px;align-items:center;padding:8px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.fb-name{flex:1;min-width:160px;font-weight:600}.fb-active{display:flex;gap:4px;align-items:center;margin:0;color:var(--ink);font-size:13px}.fb-active input{width:auto}
.fb-body{flex:1;display:grid;grid-template-columns:170px 1fr 300px;min-height:0}
.fb-palette{border-right:1px solid var(--line);padding:8px;overflow:auto;display:flex;flex-direction:column;gap:6px}
.fb-h{font-size:11px;letter-spacing:.08em;color:var(--mute);margin:4px}
.fb-tool{display:flex;gap:8px;align-items:center;text-align:left;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px;cursor:grab;color:var(--ink);font:inherit;font-size:13px}.fb-tool:hover{border-color:var(--brand)}
.fb-canvas-wrap{overflow:auto;position:relative;background-color:var(--bg);background-image:radial-gradient(var(--line) 1px,transparent 1px);background-size:18px 18px}
.fb-canvas{position:relative;min-width:100%;min-height:100%}
.fb-edges{position:absolute;inset:0;pointer-events:none;overflow:visible}
.fb-edge{fill:none;stroke:var(--brand);stroke-width:2;stroke-dasharray:6 5}.fb-edge.temp{stroke:var(--mute)}.fb-edge-dot{fill:var(--brand)}
.fb-node{position:absolute;width:240px;background:var(--card);border:1px solid var(--line);border-radius:10px;box-shadow:0 2px 6px rgba(0,0,0,.06);font-size:13px;user-select:none}
.fb-node.sel{border-color:var(--brand);box-shadow:0 0 0 2px color-mix(in srgb,var(--brand) 35%,transparent)}
.fb-node-h{display:flex;justify-content:space-between;align-items:center;padding:8px 10px;border-left:4px solid;border-radius:10px 10px 0 0;font-weight:600;cursor:move;background:var(--bg)}
.fb-x{background:none;border:0;color:var(--mute);cursor:pointer;font:inherit}
.fb-node-b{padding:8px 10px;max-height:96px;overflow:hidden;color:var(--ink)}
.fb-out{display:flex;justify-content:space-between;align-items:center;padding:5px 10px;border-top:1px solid var(--line);font-size:12px;color:var(--mute);position:relative}
.fb-port{width:14px;height:14px;border-radius:50%;background:var(--card);border:2px solid var(--brand);cursor:crosshair;margin-right:-17px;touch-action:none}
.fb-port:hover{background:var(--brand)}
.fb-in{position:absolute;left:-7px;top:16px;width:12px;height:12px;border-radius:50%;background:var(--brand)}
.fb-start .fb-in{display:none}
.fb-chip{display:inline-block;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:1px 6px;margin:2px}
.fb-inspector{border-left:1px solid var(--line);padding:10px;overflow:auto}.fb-inspector h3{margin:0 0 8px;text-transform:none;letter-spacing:0;color:var(--ink);font-size:14px}
.fb-rowedit{display:flex;gap:4px;margin-bottom:4px}
@media (max-width:900px){.fb-body{grid-template-columns:1fr}.fb-palette{flex-direction:row;flex-wrap:wrap;border-right:0;border-bottom:1px solid var(--line)}.fb-canvas-wrap{min-height:420px}.fb-inspector{border-left:0;border-top:1px solid var(--line)}}
.axis{display:flex;justify-content:space-between;font-size:12px;color:var(--mute);margin-top:4px}
</style>
<script src="flow-builder.js"></script>
<link rel="manifest" href="/admin/manifest.json"><meta name="theme-color" content="#128c4a"><link rel="apple-touch-icon" href="/admin/icon.svg"><meta name="apple-mobile-web-app-capable" content="yes">
</head>
<body>
<header>
  <h1>💬 WhatsApp Commerce <span class="mute" id="who"></span></h1>
  <nav id="nav"></nav>
  <button class="btn ghost" id="helpbtn" style="display:none" title="Guides and answers">❓ Help</button>
  <button class="btn ghost" id="logout" style="display:none">Sign out</button>
</header>
<div id="banner"></div>
<main id="app"></main>
<div id="toast"></div>
<div id="helppanel" style="display:none;position:fixed;right:16px;bottom:16px;width:min(380px,calc(100vw - 32px));max-height:70vh;overflow:auto;background:var(--card,#fff);color:inherit;border:1px solid var(--line,#ddd);border-radius:14px;box-shadow:0 12px 40px rgba(0,0,0,.25);padding:14px;z-index:50">
  <div style="display:flex;justify-content:space-between;align-items:center"><b>❓ How can we help?</b><button class="btn ghost" id="helpx" style="padding:2px 8px">×</button></div>
  <form id="helpf" style="display:flex;gap:6px;margin-top:8px"><input id="helpq" placeholder="e.g. how do I connect WhatsApp?"><button class="btn">Ask</button></form>
  <div id="helpout" style="margin-top:10px;font-size:14px"></div>
  <p class="mute" style="font-size:12px;margin-top:10px"><a href="/guides" target="_blank" rel="noopener">All guides ↗</a></p>
</div>
<script>
const $ = (s, el = document) => el.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const store = { get: (k) => { try { return localStorage.getItem(k); } catch { return null; } }, set: (k, v) => { try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch {} } };
let S = { key: store.get('wc_key'), tenantId: store.get('wc_tenant'), super: false, tenant: null, tab: store.get('wc_tab') || 'overview' };
const toast = (m) => { const t = $('#toast'); t.textContent = m; t.style.display = 'block'; clearTimeout(t._h); t._h = setTimeout(() => (t.style.display = 'none'), 3000); };

async function api(path, opts = {}) {
  const res = await fetch('/api' + path, { ...opts, headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + S.key }, body: opts.body ? JSON.stringify(opts.body) : undefined });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || res.statusText);
  return data;
}
const T = (p) => `/tenants/${encodeURIComponent(S.tenantId)}${p}`;

// ---------- login ----------
function loginView() {
  $('#nav').innerHTML = ''; $('#logout').style.display = 'none'; $('#who').textContent = '';
  $('#app').innerHTML = `<div class="card" style="max-width:420px;margin:40px auto"><h2>Sign in</h2>
    <p class="mute">Paste your key. That's all you need: the admin key you were given, your shop key (starts with <code>adm_</code>) or a team key (<code>stf_</code>).</p>
    <label>Your key</label><input id="lk" type="password" autocomplete="current-password" autofocus>
    <p><button class="btn" id="lb">Sign in</button></p><p class="mute" id="lerr"></p>
    <p class="mute">No shop yet? <a href="/signup">Start a free trial</a></p></div>`;
  const go = async () => {
    S.key = $('#lk').value.trim(); S.tenantId = null; S.tenant = null; S.tab = null; S.setupStep = null;
    if (!S.key) return;
    try { await boot(); store.set('wc_key', S.key); store.set('wc_tenant', S.tenantId); } catch (e) { $('#lerr').textContent = '⚠️ ' + e.message; }
  };
  $('#lb').onclick = go; $('#lk').onkeydown = (e) => e.key === 'Enter' && go();
}

async function boot() {
  const who = await api('/whoami');
  S.super = who.super;
  if (!S.super) S.tenantId = who.tenantId || null;
  if (!S.tenantId && !S.super) throw new Error("That key wasn't recognised. Check you copied all of it.");
  if (S.super) { try { S.setup = await api('/system/setup'); } catch { S.setup = null; } }
  if (S.tenantId) { const r = await api(T('')); S.tenant = r.tenant; S.role = r.role; S.banner = r.banner; }
  $('#logout').style.display = '';
  $('#helpbtn').style.display = '';
  render();
}
$('#logout').onclick = () => { store.set('wc_key', null); store.set('wc_tenant', null); store.set('wc_tab', null); S.key = null; S.tenant = null; S.tenantId = null; S.setup = null; loginView(); };

const TABS = [['overview', 'Overview'], ['opportunities', 'Opportunities'], ['analytics', 'Analytics'], ['inbox', 'Inbox'], ['leads', 'Leads'], ['quotes', 'Quotes'], ['tickets', 'Tickets'], ['orders', 'Orders'], ['bookings', 'Bookings'], ['contacts', 'Contacts'], ['automations', 'Automations'], ['campaigns', 'Campaigns'], ['templates', 'Templates'], ['grow', 'Grow'], ['knowledge', 'Knowledge base'], ['help', 'Help centre'], ['ai', 'AI assistant'], ['simulator', 'Test bot'], ['catalogue', 'Catalogue'], ['settings', 'Settings'], ['team', 'Team'], ['billing', 'Billing']];
const STAFF_TABS = new Set(['overview', 'opportunities', 'analytics', 'simulator', 'inbox', 'leads', 'quotes', 'tickets', 'orders', 'bookings', 'contacts']);
const MAIN_TABS = new Set(['overview', 'opportunities', 'analytics', 'inbox', 'leads', 'orders', 'simulator', 'ai', 'settings']);
// The dashboard as an app: service worker for phone notifications
if ('serviceWorker' in navigator) navigator.serviceWorker.register('/admin/sw.js', { scope: '/admin/' }).catch(() => {});
async function enablePush() {
  if (!('serviceWorker' in navigator) || !('PushManager' in window)) return toast('This browser can\'t do notifications. On iPhone: Share → Add to Home Screen first, then open it from there.');
  if (await Notification.requestPermission() !== 'granted') return toast('Notifications are blocked – allow them in your browser settings');
  const reg = await navigator.serviceWorker.ready;
  const { publicKey } = await api('/push/key');
  const key = Uint8Array.from(atob(publicKey.replace(/-/g, '+').replace(/_/g, '/') + '==='.slice((publicKey.length + 3) % 4)), (c) => c.charCodeAt(0));
  const sub = (await reg.pushManager.getSubscription()) || (await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: key }));
  await api(T('/push/subscribe'), { method: 'POST', body: { subscription: sub.toJSON() } });
  await api(T('/push/test'), { method: 'POST' }).catch(() => {});
  toast('📱 Notifications on – you should get a test one now');
}

// "❓ Help": answers from our guides (AI when available)
document.addEventListener('click', (e) => { if (e.target.id === 'helpbtn') { const p = $('#helppanel'); p.style.display = p.style.display === 'none' ? 'block' : 'none'; if (p.style.display === 'block') $('#helpq').focus(); } if (e.target.id === 'helpx') $('#helppanel').style.display = 'none'; });
document.addEventListener('submit', async (e) => {
  if (e.target.id !== 'helpf') return;
  e.preventDefault();
  const q = $('#helpq').value.trim(); if (!q) return;
  $('#helpout').innerHTML = '<span class="mute">Looking that up…</span>';
  try { const r = await api('/platform-help/ask', { method: 'POST', body: { question: q } }); $('#helpout').innerHTML = `<div style="white-space:pre-wrap">${esc(r.answer)}</div>${r.links?.length ? `<p class="mute" style="margin-top:8px">Guides: ${r.links.map((l) => `<a href="${esc(l.url)}" target="_blank" rel="noopener">${esc(l.title)}</a>`).join(' · ')}</p>` : ''}`; } catch (er) { $('#helpout').textContent = er.message; }
});

// New customer messages: a soft sound, the count in the browser tab, and the Inbox refreshes itself.
const alerts = { last: null, timer: null, ac: null, title: document.title };
function alertPing() {
  if (store.get('wc_sound') === '0') return;
  try { const ac = (alerts.ac ||= new (window.AudioContext || window.webkitAudioContext)()); const t = ac.currentTime; [0, 0.16].forEach((dt, i) => { const o = ac.createOscillator(), g = ac.createGain(); o.frequency.value = i ? 1175 : 880; g.gain.setValueAtTime(0.0001, t + dt); g.gain.exponentialRampToValueAtTime(0.18, t + dt + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t + dt + 0.28); o.connect(g); g.connect(ac.destination); o.start(t + dt); o.stop(t + dt + 0.3); }); } catch {}
}
// Visitors on the website right now (when the shop switched the list on), with "Say hello"
async function liveBox() {
  const box = document.getElementById('livebox');
  if (!box) return;
  const v = await api(T('/visitors')).catch(() => null);
  if (!v?.enabled) { box.innerHTML = ''; return; }
  const ago = (iso) => { const m = Math.round((Date.now() - Date.parse(iso)) / 60000); return m < 1 ? 'now' : `${m} min`; };
  box.innerHTML = `<details ${v.visitors.length ? 'open' : ''} style="margin-bottom:8px"><summary style="font-size:13px"><b>👀 On your website now (${v.visitors.length})</b>${v.team?.on ? ` · ${v.team.open ? '🟢 team online' : '🌙 team away'}` : ''}</summary>
    ${v.visitors.slice(0, 15).map((x) => `<div class="list-item" style="font-size:13px"><div>${esc(x.page?.title || x.page?.url || 'A page')}</div><div class="mute">${x.pages} page${x.pages > 1 ? 's' : ''} · on site ${ago(x.since)}${x.ref ? ` · from ${esc(x.ref.replace(/^https?:\/\//, '').slice(0, 40))}` : ''}</div><button class="btn ghost" data-hello="${esc(x.sessionId)}" style="padding:3px 8px;margin-top:4px">👋 Say hello</button></div>`).join('') || '<p class="mute" style="font-size:13px">Nobody right now.</p>'}</details>`;
  box.querySelectorAll('[data-hello]').forEach((b) => (b.onclick = async () => {
    const text = prompt('Message to show this visitor (the chat opens for them):', 'Hi! 👋 Can I help you find anything?');
    if (!text) return;
    try { await api(T(`/visitors/${encodeURIComponent(b.dataset.hello)}/hello`), { method: 'POST', body: { text } }); toast('Sent – it pops up on their next page check (within 30 seconds)'); } catch (e) { toast(e.message); }
  }));
}

function startAlerts() {
  if (alerts.timer || !S.tenant || S.super && !S.tenantId) return;
  const tick = async () => {
    const p = await api(T('/inbox/pulse')).catch(() => null);
    if (!p) return;
    if (alerts.last !== null && p.lastIn > alerts.last) {
      alertPing();
      if (document.hidden) document.title = `(${p.waiting || '•'}) ${alerts.title}`;
      if (S.tab === 'inbox' && !document.querySelector('#rep:focus')) inbox(alerts.sel);
      else toast('💬 New customer message – see the Inbox');
    }
    alerts.last = p.lastIn;
    if (S.tab === 'inbox') liveBox();
  };
  tick(); alerts.timer = setInterval(tick, 10000);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) document.title = alerts.title; });
}

function render() {
  startAlerts();
  const shopTabs = S.tenant ? TABS.filter(([k]) => S.role === 'owner' || STAFF_TABS.has(k)) : [];
  const showAll = store.get('wc_alltabs') === '1' || !MAIN_TABS.has(S.tab) && shopTabs.some(([k]) => k === S.tab);
  const setupLabel = S.setup ? `Setup ${S.setup.done === S.setup.total ? '✅' : `(${S.setup.done}/${S.setup.total})`}` : 'Setup';
  const superTabs = S.setup && S.setup.done === S.setup.total ? [['tenants', 'Clients'], ['setup', setupLabel]] : [['setup', setupLabel], ['tenants', 'Clients']];
  const tabs = [...(S.super ? superTabs : []), ...shopTabs.filter(([k]) => showAll || MAIN_TABS.has(k))];
  const hasMore = shopTabs.some(([k]) => !MAIN_TABS.has(k));
  if (!tabs.find((t) => t[0] === S.tab)) S.tab = tabs[0][0];
  document.querySelector('main').style.maxWidth = '';
  $('#banner').innerHTML = S.banner ? `<div style="max-width:1100px;margin:12px auto 0;padding:0 16px"><div class="card" style="margin:0;border-color:${S.banner.level === 'warn' ? 'var(--warn)' : 'var(--line)'}">${S.banner.level === 'warn' ? '⚠️' : '⏳'} ${esc(S.banner.text)} ${S.role === 'owner' ? '<a href="#" id="bgo">Choose a plan →</a>' : ''}</div></div>` : '';
  if (S.fromGuide && S.tab !== 'overview') $('#banner').insertAdjacentHTML('beforeend', `<div style="max-width:1100px;margin:12px auto 0;padding:0 16px"><a href="#" id="backguide">← Back to your steps</a></div>`);
  else S.fromGuide = false;
  if ($('#backguide')) $('#backguide').onclick = (e) => { e.preventDefault(); S.fromGuide = false; S.tab = 'overview'; store.set('wc_tab', 'overview'); render(); };
  if ($('#bgo')) $('#bgo').onclick = (e) => { e.preventDefault(); S.tab = 'billing'; render(); };
  $('#who').textContent = S.tenant ? '· ' + S.tenant.name : S.super ? '· super admin' : '';
  $('#nav').innerHTML = tabs.map(([k, l]) => `<button data-t="${k}" class="${S.tab === k ? 'on' : ''}">${l}</button>`).join('') + (hasMore ? `<button id="moretabs">${showAll ? '‹ Fewer' : 'More ›'}</button>` : '');
  $('#nav').querySelectorAll('button[data-t]').forEach((b) => (b.onclick = () => { S.fromGuide = false; S.tab = b.dataset.t; store.set('wc_tab', S.tab); render(); }));
  if ($('#moretabs')) $('#moretabs').onclick = () => { store.set('wc_alltabs', showAll ? null : '1'); if (showAll && !MAIN_TABS.has(S.tab)) S.tab = 'overview'; render(); };
  ({ setup, tenants, overview, opportunities, analytics, team, billing, knowledge, ai, automations, contacts, campaigns, templates, grow, simulator, inbox, leads, quotes, tickets, help, orders, bookings, catalogue, settings, broadcast })[S.tab]().catch((e) => toast(e.message));
}

// ---------- super admin: guided platform setup ----------
const SETUP_STEPS = [
  ['ai', '🤖', 'AI'],
  ['payments', '💳', 'Payments'],
  ['whatsapp', '📱', 'WhatsApp'],
  ['business', '🏢', 'Your business'],
  ['email', '📧', 'Emails'],
];
const copyBox = (label, value) => `<label>${label}</label><div style="display:flex;gap:6px"><input readonly value="${esc(value)}"><button class="btn ghost" data-copy="${esc(value)}">Copy</button></div>`;
const ext = (href, text) => `<a href="${esc(href)}" target="_blank" rel="noopener">${text} ↗</a>`;
const field = (k, label, v, { secret, placeholder = '', type = 'text' } = {}) => `<label>${label}</label><input data-k="${k}" type="${secret ? 'password' : type}" autocomplete="off" placeholder="${esc(secret && v ? 'Saved: ' + v + ' (leave empty to keep it)' : placeholder)}" value="${secret ? '' : esc(v || '')}">`;
const stepNo = (n, html) => `<div style="display:flex;gap:10px;padding:10px 0;border-top:1px solid var(--line)"><span class="pill" style="height:fit-content">${n}</span><div style="flex:1;min-width:0">${html}</div></div>`;

async function setup() {
  const st = (S.setup = await api('/system/setup'));
  const v = st.values, u = st.urls;
  const firstTodo = SETUP_STEPS.findIndex(([k]) => !st.steps[k]);
  if (S.setupStep == null) S.setupStep = firstTodo === -1 ? SETUP_STEPS.length : firstTodo;
  const i = S.setupStep;
  const bar = `<div class="card"><h2>Set up your platform <span class="mute" style="font-weight:400">${st.done} of ${st.total} done</span></h2>
    <div style="height:8px;background:var(--bg);border-radius:99px;overflow:hidden;margin-bottom:12px"><div style="height:100%;width:${(st.done / st.total) * 100}%;background:var(--brand)"></div></div>
    <div style="display:flex;gap:6px;flex-wrap:wrap">${SETUP_STEPS.map(([k, icon, label], n) => `<button class="btn ${n === i ? '' : 'ghost'}" data-step="${n}">${st.steps[k] ? '✅' : icon} ${n + 1}. ${label}</button>`).join('')}
    <button class="btn ${i === SETUP_STEPS.length ? '' : 'ghost'}" data-step="${SETUP_STEPS.length}">🎉 Finish</button></div></div>`;
  const nav = () => `<p style="display:flex;gap:8px;flex-wrap:wrap;margin-top:16px">${i > 0 ? `<button class="btn ghost" data-step="${i - 1}">‹ Back</button>` : ''}<span style="flex:1"></span><button class="btn ghost" data-step="${i + 1}">${st.steps[SETUP_STEPS[i][0]] ? 'Next ›' : 'Skip for now ›'}</button></p>`;
  let body = '';
  if (i === 0) body = `<div class="card"><h2>🤖 Step 1: Turn on the AI</h2>
    <p>The AI answers your shops' customers. It runs on <b>OpenRouter</b>, which you pay as you go (a few pounds a month for a small shop).</p>
    ${stepNo(1, `${ext('https://openrouter.ai/sign-up', 'Create an OpenRouter account')} and ${ext('https://openrouter.ai/settings/credits', 'add some credit')} (for example $20).`)}
    ${stepNo(2, `In ${ext('https://openrouter.ai/settings/privacy', 'Settings → Privacy')}, switch off anything that lets them log or train on prompts.`)}
    ${stepNo(3, `Go to ${ext('https://openrouter.ai/settings/keys', 'Keys')}, press <b>Create key</b> and paste it here:${field('aiApiKey', 'OpenRouter key (starts with sk-or-)', v.aiApiKey, { secret: true })}
      <details style="margin-top:8px"><summary class="mute">Advanced: change the AI model</summary>${field('aiModel', 'Model (the default is cheap and good)', v.aiModel, { placeholder: 'openai/gpt-4o-mini' })}</details>`)}
    ${st.aiCheck === '0' ? '<p class="pill warn">⚠️ The saved key was rejected. Paste a new one.</p>' : ''}
    <p><button class="btn" id="ssave">Save and test</button> ${st.steps.ai ? '<button class="btn ghost" id="stest">Test again</button>' : ''}</p><div id="sres"></div>${nav()}</div>`;
  if (i === 1) body = `<div class="card"><h2>💳 Step 2: Get paid by your shops</h2>
    <p>Shops pay you monthly by card through <b>Stripe</b>. Paste one key and we create the three plans (£29 / £79 / £249 a month) and the rest of the Stripe setup for you.</p>
    ${st.stripeMode ? `<p>Stripe is in <span class="pill ${st.stripeMode === 'live' ? '' : 'warn'}">${st.stripeMode === 'live' ? 'LIVE mode: real money' : 'TEST mode: no real money'}</span></p>` : ''}
    ${stepNo(1, `Open ${ext('https://dashboard.stripe.com/test/apikeys', 'Stripe → Developers → API keys')}. Start in <b>Test mode</b>, so you can try everything with the test card 4242 4242 4242 4242.`)}
    ${stepNo(2, `Copy the <b>Secret key</b> and paste it here:${field('platformStripeSecret', 'Stripe secret key (sk_test_… or sk_live_…)', v.platformStripeSecret, { secret: true })}`)}
    ${stepNo(3, `Press the button. We create the plans and the webhook in your Stripe account.<p><button class="btn" id="sstripe">Save and set up Stripe for me</button></p><div id="sres"></div>`)}
    ${stepNo(4, `In Stripe, turn on the ${ext('https://dashboard.stripe.com/test/settings/billing/portal', 'customer portal')} (allow cancel, switch plan and update card) and ${ext('https://dashboard.stripe.com/settings/emails', 'receipt emails')}.`)}
    ${stepNo(5, `<b>When you're ready for real money:</b> switch Stripe to Live mode, paste your <b>live</b> secret key above and press the button again.`)}
    <details style="margin-top:8px"><summary class="mute">Advanced: enter the Stripe IDs yourself</summary>
      <div class="row"><div>${field('stripePriceStarter', 'Starter price ID', v.stripePriceStarter, { placeholder: 'price_…' })}</div><div>${field('stripePriceGrowth', 'Growth price ID', v.stripePriceGrowth, { placeholder: 'price_…' })}</div><div>${field('stripePricePro', 'Pro price ID', v.stripePricePro, { placeholder: 'price_…' })}</div></div>
      ${field('platformStripeWebhookSecret', 'Webhook signing secret (whsec_…)', v.platformStripeWebhookSecret, { secret: true })}
      ${copyBox('Webhook address', u.stripeWebhook)}<p><button class="btn ghost" id="ssave">Save</button></p></details>${nav()}</div>`;
  if (i === 2) body = `<div class="card"><h2>📱 Step 3: Connect WhatsApp (Meta)</h2>
    <p>This lets shops connect their WhatsApp number in a few clicks. Meta has to approve you first, which takes <b>days to weeks</b>.
    <b>You can skip this for now.</b> The website chat and the Test bot work without it.</p>
    ${stepNo(1, `Go to ${ext('https://developers.facebook.com/apps', 'Meta for Developers → My Apps')} → <b>Create app</b> → type <b>Business</b> → add the <b>WhatsApp</b> product.`)}
    ${stepNo(2, `In <b>App settings → Basic</b>, paste these two links:${copyBox('Privacy policy URL', u.privacy)}${copyBox('Terms of service URL', u.terms)}
      Then copy the App ID and App secret here:<div class="row"><div>${field('metaAppId', 'App ID', v.metaAppId)}</div><div>${field('metaAppSecret', 'App secret', v.metaAppSecret, { secret: true })}</div></div>`)}
    ${stepNo(3, `In <b>WhatsApp → Configuration → Webhook</b>, press Edit and paste:${copyBox('Callback URL', u.whatsappWebhook)}${copyBox('Verify token', v.metaWebhookVerifyToken)}
      Then subscribe to these fields: <code>messages</code> <code>account_update</code> <code>history</code> <code>smb_app_state_sync</code> <code>smb_message_echoes</code> <code>message_template_status_update</code>`)}
    ${stepNo(4, `In <b>Facebook Login for Business → Configurations</b>, create a configuration with login variation <b>Embedded Signup</b>, and <b>tick the WhatsApp product</b>. Copy its ID here:
      ${field('metaConfigId', 'Configuration ID', v.metaConfigId)}Then under Facebook Login for Business → <b>Settings</b>, add this to <b>Allowed domains</b>:${copyBox('Domain', u.domain)}`)}
    ${stepNo(5, `Get your company ${ext('https://business.facebook.com/settings/security', 'Business verified')}. Then apply to be a <b>Tech Provider</b>, and in App Review request advanced access to <code>whatsapp_business_messaging</code> and <code>whatsapp_business_management</code>.`)}
    <p><button class="btn" id="ssave">Save</button></p><div id="sres"></div>${nav()}</div>`;
  if (i === 3) body = `<div class="card"><h2>🏢 Step 4: Your business details</h2>
    <p>These appear on your sales page and on the terms and privacy pages. Have a solicitor read the ${ext(u.terms, 'terms')} and ${ext(u.privacy, 'privacy')} pages before you start selling.</p>
    <div class="row"><div>${field('productName', 'Product name (shown to shops)', v.productName)}</div><div>${field('supportEmail', 'Support email', v.supportEmail, { type: 'email' })}</div>
    <div>${field('legalCompanyName', 'Company name', v.legalCompanyName, { placeholder: 'Your Company Ltd' })}</div><div>${field('legalCompanyNumber', 'Company number', v.legalCompanyNumber)}</div></div>
    ${field('legalAddress', 'Registered address', v.legalAddress)}${field('legalContactEmail', 'Privacy contact email', v.legalContactEmail, { type: 'email' })}
    <h3>Your public website</h3>
    <p class="mute">Shown on ${ext(u.publicUrl + '/', 'your website')}. Leave a box empty to hide it.</p>
    <div class="row"><div>${field('contactPhone', 'Phone number', v.contactPhone, { placeholder: '020 1234 5678' })}</div><div>${field('demoUrl', 'Demo booking link (optional, e.g. Calendly)', v.demoUrl, { placeholder: 'https://calendly.com/you/20min' })}</div></div>
    <label>Homepage chat</label><div class="mute">The chat button on your homepage is a real assistant answering questions about your product: the best proof you have before you have customers.</div>
    <p>${v.siteChatTenant ? `✅ Live, using shop <code>${esc(v.siteChatTenant)}</code>. <button class="btn ghost" id="ssite">Refresh its answers from the website copy</button>` : '<button class="btn ghost" id="ssite">Create my homepage assistant</button>'}</p>
    <details style="margin-top:8px"><summary class="mute">Optional: get an alert in Slack or Discord when something breaks</summary>${field('alertWebhookUrl', 'Slack / Discord webhook URL', v.alertWebhookUrl, { placeholder: 'https://hooks.slack.com/services/…' })}</details>
    <p><button class="btn" id="ssave">Save</button></p><div id="sres"></div>${nav()}</div>`;
  if (i === 4) body = `<div class="card"><h2>📧 Step 5: Order alert emails</h2>
    <p>Shops get an email for every new order, paid order, and when a customer asks for a person. This matters most before they connect WhatsApp, because email is the only way they hear about website-chat orders. We send it through <b>Resend</b>: free for up to 3,000 emails a month.</p>
    ${stepNo(1, `${ext('https://resend.com/signup', 'Create a Resend account')}.`)}
    ${stepNo(2, `Go to ${ext('https://resend.com/domains', 'Domains')} → <b>Add domain</b> → type <code>${esc(u.domain.split('.').slice(-2).join('.'))}</code>. Resend shows you 3 or 4 DNS records: add them where you manage that domain's DNS, the same place you added the <code>wa</code> record. Wait until it says <b>Verified</b> (usually a few minutes).`)}
    ${stepNo(3, `Go to ${ext('https://resend.com/api-keys', 'API keys')} → <b>Create API key</b> (Sending access) and paste it here:${field('resendApiKey', 'Resend API key (starts with re_)', v.resendApiKey, { secret: true })}`)}
    ${stepNo(4, `Choose the sender. It must use the domain you verified:${field('emailFrom', 'Send emails from', v.emailFrom, { placeholder: `${v.productName || 'Orders'} <orders@${u.domain.split('.').slice(-2).join('.')}>` })}`)}
    <details style="margin-top:12px"><summary><b>Optional: Google Calendar for bookings</b></summary><p class="mute">Lets shops connect their Google Calendar so busy times are kept free and bookings appear in it. In ${ext('https://console.cloud.google.com/apis/credentials', 'Google Cloud → Credentials')}: enable the Google Calendar API, create an <b>OAuth client ID</b> (Web application) and add this redirect URI: <code>${esc(u.publicUrl)}/oauth/google/callback</code>. Until Google verifies the app, up to 100 shops can connect and they see an "unverified app" warning.</p>${field('googleClientId', 'Client ID', v.googleClientId)}${field('googleClientSecret', 'Client secret', v.googleClientSecret, { secret: true })}</details>
    <p><button class="btn" id="ssave">Save and send me a test</button></p><div id="sres"></div>${nav()}</div>`;
  if (i >= SETUP_STEPS.length) body = `<div class="card"><h2>🎉 ${st.done === st.total ? "You're all set" : 'Nearly there'}</h2>
    ${SETUP_STEPS.map(([k, , label], n) => `<div style="padding:6px 0">${st.steps[k] ? '✅' : '⬜'} ${label} ${st.steps[k] ? '' : `<a href="#" data-step="${n}">finish this</a>`}</div>`).join('')}
    <h3>What to do next</h3>
    ${stepNo(1, `Make a test shop for yourself: open ${ext('/signup', 'the sign-up page')} as a customer would, or create one under <b>Clients</b>.`)}
    ${stepNo(2, 'Open the shop, go to <b>Test bot</b> and chat with it.')}
    ${stepNo(3, 'Once Meta has approved you, connect a WhatsApp number from the shop’s Overview page.')}
    <p><button class="btn" id="sclients">Go to Clients</button></p></div>`;
  $('#app').innerHTML = bar + body;
  $('#nav').querySelector('[data-t="setup"]')?.replaceChildren(`Setup ${st.done === st.total ? '✅' : `(${st.done}/${st.total})`}`);
  $('#app').querySelectorAll('[data-step]').forEach((b) => (b.onclick = (e) => { e.preventDefault(); S.setupStep = Number(b.dataset.step); setup().catch((x) => toast(x.message)); }));
  $('#app').querySelectorAll('[data-copy]').forEach((b) => (b.onclick = () => { navigator.clipboard?.writeText(b.dataset.copy).then(() => toast('Copied'), () => toast('Select the text and copy it')); }));
  const res = (html) => { if ($('#sres')) $('#sres').innerHTML = html; };
  const collect = () => { const p = {}; $('#app').querySelectorAll('[data-k]').forEach((el) => { const val = el.value.trim(); if (el.type === 'password' && !val) return; p[el.dataset.k] = val; }); return p; };
  const save = async () => (S.setup = await api('/system/setup', { method: 'PATCH', body: collect() }));
  const testAi = async () => {
    res('<p class="mute">Asking the AI to say hello…</p>');
    const t = await api('/system/setup/test-ai', { method: 'POST' });
    res(t.ok ? `<p>✅ The AI works (${esc(t.model)} replied “${esc(t.reply)}”).</p>` : `<p class="pill warn">⚠️ ${esc(t.error)}</p><p class="mute">Check you copied the whole key and that your OpenRouter account has credit.</p>`);
    return t.ok;
  };
  $('#app').querySelectorAll('#ssave').forEach((b) => (b.onclick = async () => {
    try {
      await save();
      if (i === 0) { if (await testAi()) setTimeout(() => { S.setupStep = 1; setup(); }, 1500); return; }
      if (i === 4) {
        res('<p class="mute">Sending a test email…</p>');
        const t = await api('/system/setup/test-email', { method: 'POST', body: {} });
        res(t.ok ? `<p>✅ Sent to ${esc(t.to)}. Check your inbox (and spam, the first time).</p>` : `<p class="pill warn">⚠️ ${esc(t.error)}</p><p class="mute">${t.to ? 'Check the domain shows Verified in Resend, and that the sender uses that domain.' : 'Add your support email in step 4 first, so we know where to send the test.'}</p>`);
        return;
      }
      toast('Saved'); S.setupStep = i + 1; setup();
    } catch (e) { res(`<p class="pill warn">⚠️ ${esc(e.message)}</p>`); }
  }));
  if ($('#ssite')) $('#ssite').onclick = async () => {
    try { await save(); const r = await api('/system/site-assistant', { method: 'POST' }); S.setup = r.status; toast('Homepage assistant ready'); setup(); } catch (e) { res(`<p class="pill warn">⚠️ ${esc(e.message)}</p>`); }
  };
  if ($('#stest')) $('#stest').onclick = () => testAi().catch((e) => res(esc(e.message)));
  if ($('#sstripe')) $('#sstripe').onclick = async () => {
    try {
      await save();
      res('<p class="mute">Setting up Stripe…</p>');
      const r = await api('/system/setup/stripe-auto', { method: 'POST' });
      S.setup = r.status;
      res(`${r.done.map((d) => `<div>✅ ${esc(d)}</div>`).join('')}<p>Stripe is ready. Do step 4 below, then press <b>Next ›</b>.</p>`);
    } catch (e) { res(`<p class="pill warn">⚠️ ${esc(e.message)}</p><p class="mute">Check you copied the <b>Secret</b> key, not the Publishable one.</p>`); }
  };
  if ($('#sclients')) $('#sclients').onclick = () => { S.tab = 'tenants'; store.set('wc_tab', 'tenants'); render(); };
}

// ---------- super admin ----------
async function tenants() {
  const { tenants } = await api('/tenants');
  setTimeout(() => systemHealth().catch(() => {}), 0);
  setTimeout(async () => {
    let box = document.getElementById('partnersbox'); if (!box) { box = document.createElement('div'); box.className = 'card'; box.id = 'partnersbox'; $('#app').appendChild(box); }
    const r = await api('/system/referrals').catch(() => null); if (!r) return;
    box.innerHTML = `<h2>🤝 Partners and referrals</h2><p class="mute">Agencies and businesses that send you customers earn ${r.percent}% of each referred plan while it pays (set REFERRAL_PERCENT on the server). You pay them – this keeps the numbers.</p>
      <div class="row"><div><label>Partner name</label><input id="pn" placeholder="Bright Web Design"></div><div><label>Email</label><input id="pe"></div><div><label>Code (optional)</label><input id="pc" placeholder="BRIGHTWEB"></div></div><p><button class="btn ghost" id="padd">Add partner</button></p>
      <div class="tablewrap"><table><tr><th>Who</th><th>Link</th><th>Sign-ups</th><th>Paying</th><th>Owed / month</th></tr>${[...r.partners.map((p) => ({ who: `🤝 ${p.name}`, link: p.link, ...p })), ...r.businesses.map((b) => ({ who: `🏪 ${b.referrer}`, link: '', ...b }))].map((x) => `<tr><td>${esc(x.who)}</td><td style="font-size:12px">${esc(x.link)}</td><td>${x.signups}</td><td>${x.paying}</td><td>£${x.monthlyEarnings}</td></tr>`).join('') || '<tr><td colspan="5" class="mute">None yet</td></tr>'}</table></div>`;
    box.querySelector('#padd').onclick = async () => { try { const p = await api('/system/partners', { method: 'POST', body: { name: $('#pn').value, email: $('#pe').value, code: $('#pc').value } }); toast(`Partner link: ${p.link}`); tenants(); } catch (e) { toast(e.message); } };
  }, 0);
  const { plans } = await api('/plans');
  const st = S.setup;
  $('#app').innerHTML = `${st && st.done < st.total ? `<div class="card" style="border-color:var(--warn)">⚙️ Platform setup: ${st.done} of ${st.total} steps done. <a href="#" id="gosetup">Continue setup →</a></div>` : ''}<div class="card"><h2>New client</h2><div class="row">
      <div><label>Business name</label><input id="tn"></div>
      <div><label>Plan</label><select id="tp">${Object.entries(plans).map(([k, p]) => `<option value="${k}">${p.label} — £${p.priceGbp}/mo</option>`).join('')}</select></div>
      <div style="align-self:end"><button class="btn" id="tc">Create client</button></div></div><div id="keys"></div></div>
    <div class="card" id="leads"><h2>Demo requests and leads</h2><p class="mute">Loading…</p></div>
    <div class="card"><h2>Clients (${tenants.length})</h2><div class="tablewrap"><table><tr><th>Name</th><th>ID</th><th>Plan</th><th>Store</th><th>This month</th><th></th></tr>
    ${tenants.map((t) => `<tr><td>${esc(t.name)} ${t.active ? '' : '<span class="pill warn">inactive</span>'}</td><td><code>${esc(t.id)}</code></td><td>${esc(t.plan)}</td><td>${esc(t.settings.store.type)}</td>
      <td>${t.usage.inbound} in · ${t.usage.orders} orders · ${t.usage.ai_calls} AI</td>
      <td><button class="btn ghost" data-open="${esc(t.id)}">Manage</button> <button class="btn ghost" data-toggle="${esc(t.id)}" data-active="${t.active}">${t.active ? 'Suspend' : 'Activate'}</button></td></tr>`).join('')}
    </table></div></div>`;
  api('/system/leads').then(({ leads, feeChecker = [] }) => {
    const el = $('#leads'); if (!el) return;
    const fc = feeChecker.length ? `<h2 style="margin-top:20px">WhatsApp fee checker leads (${feeChecker.length})</h2><div class="tablewrap"><table><tr><th>When</th><th>Who</th><th>Provider</th><th>Markup</th><th>Marketing emails</th><th>Result email</th></tr>${feeChecker.map((l) => `<tr><td>${esc(l.created_at)}</td><td><b>${esc(l.name)}</b><div><a href="mailto:${esc(l.email)}">${esc(l.email)}</a></div></td><td>${esc(l.provider || '–')}</td><td>£${esc(Number(l.monthly_markup).toFixed(2))}/month<div class="mute">£${esc(Math.round(l.yearly_markup))}/year · ${esc(l.markup_pct)}% markup · ${esc(l.users)} users</div></td><td>${l.marketing_opt_in ? `✅ opted in<div class="mute">${esc(l.opt_in_at || '')}</div>` : '<span class="mute">No</span>'}</td><td>${l.email_sent ? 'Sent' : `<span class="mute">Not sent${l.email_error ? `: ${esc(l.email_error)}` : ''}</span>`}</td></tr>`).join('')}</table></div>` : '';
    el.innerHTML = `<h2>Demo requests and leads (${leads.length})</h2>` + (leads.length ? `<div class="tablewrap"><table><tr><th>When</th><th>Type</th><th>Who</th><th>Contact</th><th>Details</th></tr>${leads.map((l) => `<tr><td>${esc(l.created_at)}</td><td><span class="pill">${l.kind === 'demo' ? 'Demo request' : 'Calculator'}</span></td><td><b>${esc(l.name || '')}</b><div class="mute">${esc(l.business || '')}</div></td><td><a href="mailto:${esc(l.email)}">${esc(l.email)}</a>${l.phone ? `<div>${esc(l.phone)}</div>` : ''}${l.website ? `<div class="mute">${esc(l.website)}</div>` : ''}</td><td class="mute">${l.kind === 'calculator' ? `£${esc(l.data.totalGbp)}/month · ${esc(l.data.inputs?.customers)} customers` : esc(l.message || '')}</td></tr>`).join('')}</table></div>` : '<p class="mute">None yet. They appear here when someone books a demo or emails themselves a calculator result.</p>') + fc;
  }).catch(() => {});
  if ($('#gosetup')) $('#gosetup').onclick = (e) => { e.preventDefault(); S.tab = 'setup'; S.setupStep = null; render(); };
  $('#tc').onclick = async () => {
    try {
      const r = await api('/tenants', { method: 'POST', body: { name: $('#tn').value, plan: $('#tp').value } });
      $('#keys').innerHTML = `<p>✅ Created <code>${esc(r.tenant.id)}</code>. Save these now – shown once:</p><p>Admin key (give to client): <code>${esc(r.adminKey)}</code></p><p>Dify tool key: <code>${esc(r.toolKey)}</code></p><p>${r.ai.created ? `🤖 AI chatbot created in Dify (${esc(r.ai.model.name)}) – <a href="${esc(r.ai.appUrl)}" target="_blank" rel="noopener">open in Dify</a>` : `⚠️ AI chatbot not created: ${esc(r.ai.reason)}`}</p>`;
    } catch (e) { toast(e.message); }
  };
  $('#app').querySelectorAll('[data-open]').forEach((b) => (b.onclick = async () => { S.tenantId = b.dataset.open; store.set('wc_tenant', S.tenantId); const r = await api(T('')); S.tenant = r.tenant; S.role = r.role; S.tab = 'overview'; render(); }));
  $('#app').querySelectorAll('[data-toggle]').forEach((b) => (b.onclick = async () => { await api(`/tenants/${b.dataset.toggle}/meta`, { method: 'PATCH', body: { active: b.dataset.active !== 'true' } }); tenants(); }));
}

// ---------- Automatic messages log (Automations tab) ----------
async function automationLogCard() {
  const r = await api(T('/automation-log?limit=60'));
  const box = await waitFor('#autolog'); if (!box) return;
  const when = (s) => new Date(s).toLocaleString('en-GB', { dateStyle: 'short', timeStyle: 'short' });
  const st = { sent: 'Sent', skipped: 'Not sent', failed: 'Failed' };
  box.className = 'card';

async function resultsCard() {

  const box = await waitFor('#resultsbox'); if (!box) return;
  box.className = 'card';

    ${group('✅ Verified – completed and recorded', r.verified)}${group('🤝 Assisted – the assistant helped, outcome not proven', r.assisted)}${group('🧮 Estimated', r.estimated)}${group('🎯 Potential – still open', r.potential)}`;
}
async function waitFor(sel, ms = 6000) { for (let t = 0; t < ms; t += 100) { const el = document.querySelector(sel); if (el) return el; await new Promise((r) => setTimeout(r, 100)); } return null; }

// ---------- Verified answers: what the AI said and which of your sources backed it (Knowledge tab) ----------
async function answersCard(flagged = false) {
  const r = await api(T(`/answers?limit=30${flagged ? '&flagged=1' : ''}`));
  const FLAG = { no_source: 'No source found', weak_support: 'Sources barely match', unsupported_figures: 'Figure not in your information', stale_source: 'Source not checked for 90+ days' };
  const when = (s) => new Date(s).toLocaleString('en-GB', { dateStyle: 'short', timeStyle: 'short' });
  const box = await waitFor('#answersbox'); if (!box) return;
  box.className = 'card';
  const s = r.stats;
  box.innerHTML = `<h2>🔎 Verified answers</h2><p class="mute">The assistant's recent answers, the sources from your own information it was given, and automatic checks. Last 30 days: ${s.answers} answers · ${s.unsupportedFigures} with a figure not found in your information · ${s.noSource} with no source · ${s.staleSource} using an old source.</p>
    <p><a href="#" id="ansflag">${flagged ? 'Show all answers' : 'Show only answers that need checking'}</a></p>
    ${r.answers.length ? r.answers.map((a) => `<details style="border-top:1px solid var(--line);padding:8px 0"><summary><b>${esc(a.question.slice(0, 120))}</b> <span class="mute" style="font-size:12px">${when(a.at)}</span> ${a.flags.map((f) => `<span class="pill warn">${esc(FLAG[f] || f)}</span>`).join(' ') || '<span class="pill">Backed by your information</span>'}</summary>
      <p style="white-space:pre-wrap;margin:8px 0">${esc(a.answer)}</p>
      ${a.unsupported.length ? `<p class="pill warn" style="display:inline-block">Not found in your information: ${esc(a.unsupported.join(', '))}</p>` : ''}
      ${a.sources.length ? `<div class="tablewrap"><table><tr><th>Source</th><th>Match</th><th>Last checked</th><th>Passage</th></tr>${a.sources.map((x) => `<tr><td>${x.url ? `<a href="${esc(x.url)}" target="_blank" rel="noopener">${esc(x.doc)}</a>` : esc(x.doc)}</td><td>${Math.round(x.support * 100)}%${x.figures.length ? ` · ${esc(x.figures.join(', '))}` : ''}</td><td>${x.lastChecked ? new Date(x.lastChecked).toLocaleDateString('en-GB') : '–'}${x.stale ? ' <span class="pill warn">old</span>' : ''}</td><td class="mute" style="font-size:12px">${esc(x.excerpt)}</td></tr>`).join('')}</table></div>` : '<p class="mute">No source was found for this question.</p>'}
      <div style="display:flex;gap:6px;margin-top:6px"><input placeholder="Correct answer (teaches the assistant)" data-fixq="${esc(a.question)}" style="flex:1"><button class="btn ghost" data-fixbtn style="width:auto">Save correction</button></div></details>`).join('') : '<p class="mute">No AI answers recorded yet. They appear here as customers chat.</p>'}`;
  box.querySelector('#ansflag').onclick = (e) => { e.preventDefault(); answersCard(!flagged); };
  box.querySelectorAll('[data-fixbtn]').forEach((b) => (b.onclick = async () => {
    const inp = b.previousElementSibling;
    if (!inp.value.trim()) return toast('Write the correct answer first');
    try { await api(T('/teach'), { method: 'POST', body: { question: inp.dataset.fixq, answer: inp.value.trim() } }); toast('Saved – the assistant uses this answer from now on'); inp.value = ''; } catch (e) { toast(e.message); }
  }));
}

  $('#app').innerHTML = `<div class="card"><h2>🎯 Opportunities</h2><p class="mute">Customers and jobs that need you, found in your own chats, leads, quotes, bookings and tickets. ${esc(r.note)}</p>
    <p>${r.counts.total ? `<b>${r.counts.total}</b> to look at${r.counts.high ? ` · <b>${r.counts.high}</b> urgent` : ''}` : '✅ Nothing waiting right now.'} <a href="#" id="oall" style="margin-left:8px">${showAll ? 'Hide resolved and snoozed' : 'Show resolved and snoozed'}</a></p></div>
    ${r.items.map((o) => `<div class="card" style="border-left:4px solid ${o.priority === 'high' ? 'var(--warn,#c0392b)' : 'var(--line,#dfe5e1)'}">
      <div style="display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap"><div>${pill[o.priority]} <b>${esc(o.title)}</b></div><span class="mute" style="font-size:13px">${age(o.ageMinutes)}${o.status !== 'open' ? ` · ${esc(o.status)}` : ''}</span></div>
      <p style="margin:8px 0 4px">${esc(o.reason)}</p>
      ${o.evidence ? `<p class="mute" style="margin:4px 0;font-style:italic">“${esc(o.evidence)}”</p>` : ''}
      <p class="mute" style="margin:4px 0;font-size:13px">${o.customer?.name ? `👤 ${esc(o.customer.name)} ` : ''}${o.customer?.phone ? `· ${esc(o.customer.phone)} ` : ''}${o.customer?.email ? `· ${esc(o.customer.email)} ` : ''}${o.valueText ? `· 💷 ${esc(o.valueText)} <span title="${esc(o.valueBasis)}">(${esc(o.valueBasis)})</span>` : ''}</p>

    <div class="card" id="qcard"><h2>✅ Answer check</h2><p class="mute">Loading…</p></div>
    <div class="card"><h2>Generated instructions (sent to the AI)</h2><pre style="white-space:pre-wrap" class="mute">${esc(info.prompt)}</pre></div>`;
  const qcard = async () => {
    const q = await api(T('/quality')).catch(() => null);
    if (!q || !$('#qcard')) return;
    const L = q.last;
    const tone = (v) => (v === 'good' ? '✅' : v === 'weak' ? '🟡' : '❌');
    $('#qcard').innerHTML = `<h2>✅ Answer check</h2><p class="mute">Every week we ask your assistant real questions your customers asked (nothing is sent to anyone) and a second AI marks each answer against your own information.</p>
      ${q.running ? '<p>⏳ Checking your answers now… (about a minute)</p>' : L ? `<p style="font-size:1.1em"><b>${L.score}/100</b> · ${L.good} good · ${L.weak} could be better · ${L.wrong} wrong${L.previousScore != null ? ` <span class="mute">(last time ${L.previousScore})</span>` : ''} <span class="mute">· ${esc(L.at)} UTC</span></p>
        ${L.results.filter((r) => r.verdict !== 'good').length ? `<p><b>To improve</b> – add the missing facts on the Knowledge base tab:</p>${L.results.filter((r) => r.verdict !== 'good').map((r) => `<details style="margin:6px 0"><summary>${tone(r.verdict)} ${esc(r.question)} <span class="mute">– ${esc(r.reason)}</span></summary><pre style="white-space:pre-wrap" class="mute">${esc(r.answer)}</pre></details>`).join('')}` : '<p>🎉 Every answer was good.</p>'}
        <details><summary class="mute">All questions</summary>${L.results.map((r) => `<div class="mute">${tone(r.verdict)} ${esc(r.question)}</div>`).join('')}</details>` : '<p>Not checked yet.</p>'}
      ${S.role === 'owner' ? `<p><button class="btn ghost" id="qrun" ${q.running ? 'disabled' : ''}>Check my answers now</button></p>` : ''}`;
    if ($('#qrun')) $('#qrun').onclick = async () => {
      try { await api(T('/quality/run'), { method: 'POST' }); toast('Checking your answers…'); } catch (e) { return toast(e.message); }
      qcard();
      const poll = setInterval(async () => { const s = await api(T('/quality')).catch(() => null); if (!s?.running) { clearInterval(poll); if (S.tab === 'ai') qcard(); } }, 5000);
    };
  };
  qcard();
  $('#aitest').onclick = () => { S.tab = 'simulator'; render(); };
  $('#aiprov').onchange = async () => { S.tenant = (await api(T('/settings?sync=0'), { method: 'PATCH', body: { ai: { provider: $('#aiprov').value } } })).tenant; ai(); };
  $('#aisave').onclick = async () => {

    $('#app').querySelectorAll('[data-a]').forEach((el) => (patch.ai[el.dataset.a] = el.dataset.a === 'temperature' ? Number(el.value) : el.value));
    if ($('#aiprov').value === 'direct') {
      patch.ai.provider = 'direct'; patch.ai.mode = $('#aimode').value; patch.ai.enabled = true;
      try { S.tenant = (await api(T('/settings?sync=0'), { method: 'PATCH', body: patch })).tenant; toast('Saved – try it in Test bot'); ai(); } catch (e) { $('#aires').textContent = e.message; }
      return;
    }

    try {
      S.tenant = (await api(T('/settings?sync=0'), { method: 'PATCH', body: patch })).tenant;

      if (!r.ok) { $('#aires').textContent = '⚠️ ' + r.error; return; }
      S.tenant = r.tenant;
      toast(r.created ? 'AI chatbot created in Dify' : 'AI chatbot updated');
      ai();
    } catch (e) { $('#aires').textContent = e.message; }
  };
}

// ---------- simulator ----------
const pausedNow = (c) => !!(c?.ai_paused_until && Date.parse(c.ai_paused_until) > Date.now());
function bubble(m, dir) {
  if (dir === 'in') return `<div class="b in">${esc(m)}</div>`;
  let h = '', acts = [];
  if (m.type === 'image') h = `<img src="${esc(m.url)}" alt="">${esc(m.caption)}`;
  else if (m.type === 'cta') { h = esc(m.text); acts.push(`<a class="btn" style="text-decoration:none;font-size:13px;padding:4px 8px" href="${esc(m.url)}" target="_blank" rel="noopener">${esc(m.buttonText)}</a>`); }
  else if (m.type === 'buttons') { h = (m.header ? `<b>${esc(m.header)}</b>\n` : '') + esc(m.text); acts = m.buttons.map((b) => `<button data-a="${esc(b.id)}" data-l="${esc(b.title)}">${esc(b.title)}</button>`); }
  else if (m.type === 'list') { h = esc(m.text); acts = m.sections.flatMap((s) => s.rows.map((r) => `<button data-a="${esc(r.id)}" data-l="${esc(r.title)}" title="${esc(r.description || '')}">${esc(r.title)}</button>`)); }
  else h = esc(m.text || JSON.stringify(m));
  h = h.replace(/\*([^*\n]+)\*/g, '<b>$1</b>').replace(/(^|\s)_([^_\n]+)_/g, '$1<i>$2</i>');
  const tag = m.via === 'phone_app' ? '<div class="mute" style="font-size:11px">📱 sent from your phone</div>' : m.via === 'history' ? '<div class="mute" style="font-size:11px">🕘 imported from the Business app</div>' : '';
  return `<div class="b out">${tag}${h}${acts.length ? `<div class="acts">${acts.join('')}</div>` : ''}</div>`;
}
async function simulator() {
  const waId = store.get('wc_simid') || '4470000' + Math.floor(Math.random() * 1e5);
  store.set('wc_simid', waId);
  $('#app').innerHTML = `<div class="card"><h2>Test your bot</h2><p class="mute">Chat exactly as a customer would on WhatsApp – nothing is sent to WhatsApp (except staff alerts). Test number: <code>${waId}</code> <button class="btn ghost" id="newsim">New customer</button></p>
    <div class="chat" id="chat"></div><div style="display:flex;gap:8px;margin-top:8px"><input id="msg" placeholder="Type a message… try “hi”"><button class="btn" id="send">Send</button></div></div>`;
  const chat = $('#chat');
  const push = (html) => { chat.insertAdjacentHTML('beforeend', html); chat.scrollTop = chat.scrollHeight; };
  const go = async (body, label) => {
    push(bubble(label, 'in'));
    try { const { replies } = await api(T('/simulate'), { method: 'POST', body: { waId, ...body } }); replies.forEach((m) => push(bubble(m, 'out'))); if (!replies.length) push('<div class="mute">(no reply – conversation may be with a human. Type “menu”)</div>'); } catch (e) { toast(e.message); }
  };
  chat.onclick = (e) => { const b = e.target.closest('button[data-a]'); if (b) go({ actionId: b.dataset.a }, b.dataset.l); };
  const sendText = () => { const v = $('#msg').value.trim(); if (!v) return; $('#msg').value = ''; go({ text: v }, v); };
  $('#send').onclick = sendText; $('#msg').onkeydown = (e) => e.key === 'Enter' && sendText();
  $('#newsim').onclick = () => { store.set('wc_simid', null); simulator(); };
}

  $('#ho').onclick = async () => { const r = await api(T(`/conversations/${sel}/handover`), { method: 'POST', body: { on: !c?.human_handover } }); if (r.ratingAsked) toast('Back to the bot – the customer was asked to rate the chat'); inbox(sel, filter); };

  $('#rs').onclick = async () => { const r = await api(T(`/conversations/${sel}/reply`), { method: 'POST', body: { text: $('#rep').value } }); if (!r.ok) toast(r.error + ' ' + (r.hint || '')); inbox(sel); };
}

// ---------- quotes (the AI drafts from your price list; you check and send) ----------
async function quotes(sel) {
  const d = await api(T('/quotes'));
  const sym = S.tenant.settings.business?.currencySymbol || '£';
  const M = (n) => sym + Number(n || 0).toLocaleString('en-GB', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  const pill = { draft: '📝 To check', sent: '📤 Sent', accepted: '✅ Accepted', declined: '✖ Declined', expired: '⌛ Expired' };
  $('#app').innerHTML = `<div class="card"><h2>📝 Instant quotes</h2><p class="mute">Customers say what they need in the chat; the AI drafts a quote from your price list (anything it can't price is marked "to confirm" – it never guesses). You check it here and press Send – or let fully priced quotes go out automatically. The customer gets a quote page with a PDF and an "Accept" button, and a friendly follow-up after 2 days.</p>
    ${S.role === 'owner' ? `<div class="row"><div><label>Quotes in the chat</label><select id="qon"><option value="false">Off</option><option value="true" ${d.enabled ? 'selected' : ''}>On</option></select></div><div><label>Send automatically when every line has a price</label><select id="qauto"><option value="false">No – I check every quote</option><option value="true" ${d.autoSend ? 'selected' : ''}>Yes</option></select></div></div><p><button class="btn ghost" id="qsave">Save</button></p>` : ''}</div>
    <div class="split"><div class="card" style="max-height:640px;overflow:auto"><h2>Quotes (${d.quotes.length})</h2>
      ${d.quotes.map((q) => `<div class="list-item ${String(sel) === String(q.number) ? 'on' : ''}" data-qn="${q.number}"><b>Q-${q.number}</b> ${esc((q.request || '').slice(0, 60))}<div class="mute" style="font-size:12px">${pill[q.status] || q.status} · ${M(q.total)} · ${esc(q.name || q.email || '')} · ${esc(q.created_at.slice(0, 10))}</div></div>`).join('') || '<p class="mute">No quotes yet. Add "Get a quote" to your welcome menu, or the assistant offers one when someone asks for a price.</p>'}
    </div><div class="card" id="qdetail"><p class="mute">Select a quote</p></div></div>`;
  if ($('#qsave')) $('#qsave').onclick = async () => { S.tenant = (await api(T('/settings'), { method: 'PATCH', body: { quotes: { enabled: $('#qon').value === 'true', autoSend: $('#qauto').value === 'true' } } })).tenant; toast('Saved'); quotes(sel); };
  $('#app').querySelectorAll('[data-qn]').forEach((el) => (el.onclick = () => quotes(el.dataset.qn)));
  if (!sel) return;
  const { quote: q, url } = await api(T(`/quotes/${sel}`));
  $('#qdetail').innerHTML = `<h2>Q-${q.number} <span class="mute" style="font-size:14px">${pill[q.status]}</span></h2>
    <p class="mute">${esc([q.name, q.email, q.phone].filter(Boolean).join(' · ') || 'No contact details')} · valid until ${esc(q.valid_until || '')}${q.status !== 'draft' ? ` · <a href="${esc(url)}" target="_blank" rel="noopener">Customer's page ↗</a>` : ''}</p>
    <p><b>They asked for:</b> ${esc(q.request || '')}</p>
    <label>Lines (one per line: item | quantity | price each – leave the price empty for "to confirm")</label>
    <textarea id="qlines" style="min-height:140px">${esc(q.items.map((i) => `${i.item} | ${i.qty} | ${i.price ?? ''}`).join('\n'))}</textarea>
    <label>Notes for the customer</label><input id="qnotes" value="${esc(q.notes || '')}">
    <p><button class="btn" id="qsend">${q.status === 'draft' ? 'Send to the customer' : 'Save and send again'}</button> <button class="btn ghost" id="qsv">Save</button> <select id="qst" style="width:auto">${Object.entries(pill).map(([k, l]) => `<option value="${k}" ${q.status === k ? 'selected' : ''}>${l}</option>`).join('')}</select></p>`;
  const lines = () => $('#qlines').value.split('\n').map((l) => l.split('|').map((x) => x.trim())).filter((p) => p[0]).map((p) => ({ item: p[0], qty: Number(p[1]) || 1, price: p[2] === '' || p[2] === undefined ? null : Number(String(p[2]).replace(/[^\d.]/g, '')) }));
  const save = (extra = {}) => api(T(`/quotes/${q.number}`), { method: 'PATCH', body: { items: lines(), notes: $('#qnotes').value, ...extra } });
  $('#qsv').onclick = async () => { try { await save(); toast('Saved'); quotes(q.number); } catch (e) { toast(e.message); } };
  $('#qst').onchange = async () => { await save({ status: $('#qst').value }); quotes(q.number); };
  $('#qsend').onclick = async () => { try { await save(); const r = await api(T(`/quotes/${q.number}/send`), { method: 'POST' }); toast(`Sent${r.delivered ? ` (${[r.delivered.chat && 'chat', r.delivered.email && 'email'].filter(Boolean).join(' + ') || 'saved – share the customer page link'})` : ''}`); quotes(q.number); } catch (e) { toast(e.message); } };
}

// ---------- tickets (support requests the assistant couldn't solve) ----------
async function tickets(sel, view = store.get('wc_tview') || 'active', q = '') {
  const d = await api(T(`/tickets?status=${view}&q=${encodeURIComponent(q)}`));
  const st = d.stats;
  const pill = { open: '🟠 Open', pending: '🔵 Waiting for customer', solved: '✅ Solved', closed: '⚪ Closed' };
  const pri = { urgent: '🔴 Urgent', high: '🟠 High', normal: 'Normal', low: 'Low' };
  const overdue = (t) => t.status === 'open' && !t.first_reply_at && t.due_at && Date.parse(t.due_at.replace(' ', 'T') + 'Z') < Date.now();
  $('#app').innerHTML = `${d.enabled ? '' : `<div class="card"><h2>🎫 Support tickets</h2><p>When the assistant can't fix a problem, it opens a ticket with a number (#1042), promises a reply time, and you work it here. Replies reach the customer in the chat and by email. Customers can ask "ticket 1042" for an update.</p>
      ${S.role === 'owner' ? '<p><button class="btn" id="ton">Turn on tickets</button></p>' : '<p class="mute">The owner can turn this on.</p>'}</div>`}
    <div class="split"><div class="card" style="max-height:640px;overflow:auto"><h2>Tickets</h2>
      <p class="mute" style="font-size:13px">🟠 ${st.open} open · 🔵 ${st.pending} waiting · ${st.overdue ? `<b style="color:#b42318">⏰ ${st.overdue} overdue</b> · ` : ''}✅ ${st.solved30} solved in 30 days</p>
      <div style="display:flex;gap:6px;margin-bottom:8px"><select id="tview" style="width:auto">${[['active', 'Open + waiting'], ['open', 'Open'], ['pending', 'Waiting'], ['solved', 'Solved'], ['closed', 'Closed'], ['all', 'All']].map(([k, l]) => `<option value="${k}" ${view === k ? 'selected' : ''}>${l}</option>`).join('')}</select><input id="tq" value="${esc(q)}" placeholder="Search…"></div>
      <p><button class="btn ghost" id="tnew">+ New ticket</button></p>
      ${d.tickets.map((t) => `<div class="list-item ${String(sel) === String(t.number) ? 'on' : ''}" data-tk="${t.number}"><b>#${t.number}</b> ${esc(t.subject)}<div class="mute" style="font-size:12px">${pill[t.status] || t.status} · ${pri[t.priority]}${overdue(t) ? ' · <b style="color:#b42318">⏰ overdue</b>' : ''} · ${esc(t.name || t.email || (t.channel || ''))}${t.assigned_to ? ` · 👤 ${esc(t.assigned_to)}` : ''}</div></div>`).join('') || '<p class="mute">No tickets here.</p>'}
    </div><div class="card" id="tdetail"><p class="mute">Select a ticket</p></div></div>`;
  if ($('#ton')) $('#ton').onclick = async () => { S.tenant = (await api(T('/settings'), { method: 'PATCH', body: { tickets: { enabled: true, replyHours: 8 } } })).tenant; toast('Tickets are on – the assistant will offer one when it can\'t fix a problem'); tickets(); };
  $('#tview').onchange = () => { store.set('wc_tview', $('#tview').value); tickets(null, $('#tview').value, $('#tq').value); };
  $('#tq').onchange = () => tickets(null, view, $('#tq').value);
  $('#app').querySelectorAll('[data-tk]').forEach((el) => (el.onclick = () => tickets(el.dataset.tk, view, q)));
  $('#tnew').onclick = () => {
    $('#tdetail').innerHTML = `<h2>New ticket</h2><p class="mute">For problems reported by phone or email.</p>
      <div class="row"><div><label>Name</label><input id="nn"></div><div><label>Email</label><input id="ne" type="email"></div><div><label>Phone</label><input id="np"></div></div>
      <label>Subject</label><input id="ns"><label>What's the problem?</label><textarea id="nd"></textarea>
      <label>Priority</label><select id="npr" style="width:auto">${Object.entries(pri).map(([k, l]) => `<option value="${k}" ${k === 'normal' ? 'selected' : ''}>${l}</option>`).join('')}</select>
      <p><button class="btn" id="ncreate">Create ticket</button></p>`;
    $('#ncreate').onclick = async () => { try { const r = await api(T('/tickets'), { method: 'POST', body: { name: $('#nn').value, email: $('#ne').value, phone: $('#np').value, subject: $('#ns').value, description: $('#nd').value, priority: $('#npr').value } }); toast(`Ticket #${r.ticket.number} created`); tickets(r.ticket.number, view); } catch (e) { toast(e.message); } };
  };
  if (!sel) return;
  const { ticket: t, events } = await api(T(`/tickets/${sel}`));
  const { agents = [] } = await api(T('/agents')).catch(() => ({}));
  const kindLabel = { created: '🎫 Opened', reply: '💬 Team reply', customer: '🙋 Customer', note: '🔒 Private note', status: '🔁 Status', priority: '⚑ Priority', assigned: '👤 Assigned' };
  $('#tdetail').innerHTML = `<h2>#${t.number} ${esc(t.subject)}</h2>
    <p class="mute">${esc([t.name, t.email, t.phone].filter(Boolean).join(' · ') || 'No contact details')} · via ${esc(t.channel || 'chat')} · opened ${esc(t.created_at)}${t.wa_id ? ` · <a href="#" id="tchatlink">Open the chat</a>` : ''}</p>
    ${t.summary ? `<p class="mute">🤖 ${esc(t.summary)}</p>` : ''}
    <div class="row"><div><label>Status</label><select id="tst">${Object.entries(pill).map(([k, l]) => `<option value="${k}" ${t.status === k ? 'selected' : ''}>${l}</option>`).join('')}</select></div>
      <div><label>Priority</label><select id="tpr">${Object.entries(pri).map(([k, l]) => `<option value="${k}" ${t.priority === k ? 'selected' : ''}>${l}</option>`).join('')}</select></div>
      <div><label>Owner</label><select id="tas"><option value="">Nobody</option>${agents.map((a) => `<option ${t.assigned_to === a ? 'selected' : ''}>${esc(a)}</option>`).join('')}</select></div></div>
    <div class="chat" style="max-height:340px;overflow:auto;margin-top:10px">${events.map((e) => `<div class="b ${e.kind === 'customer' || e.kind === 'created' ? 'in' : 'out'}" style="${e.public ? '' : 'background:#fff7d6'}"><div class="mute" style="font-size:12px">${kindLabel[e.kind] || e.kind} · ${esc(e.by || '')} · ${esc(e.created_at)}</div>${esc(e.text || '')}</div>`).join('')}</div>
    <label style="margin-top:10px">Reply to the customer (chat${t.email ? ' + email' : ''})</label><textarea id="trep" placeholder="Hi${t.name ? ' ' + esc(t.name.split(' ')[0]) : ''}, …"></textarea>
    <p><button class="btn" id="tsend">Send reply</button> <button class="btn ghost" id="tsolve">Send and mark solved</button> <button class="btn ghost" id="tnote">Add private note</button></p>`;
  const patch = async (body, msg) => { try { const r = await api(T(`/tickets/${t.number}`), { method: 'PATCH', body }); if (msg) toast(msg + (r.delivered ? ` (${[r.delivered.chat && 'chat', r.delivered.email && 'email'].filter(Boolean).join(' + ') || 'saved – the customer could not be reached'})` : '')); tickets(t.number, view, q); } catch (e) { toast(e.message); } };
  $('#tst').onchange = () => patch({ status: $('#tst').value }, 'Status saved');
  $('#tpr').onchange = () => patch({ priority: $('#tpr').value });
  $('#tas').onchange = () => patch({ assignedTo: $('#tas').value || null });
  $('#tsend').onclick = () => $('#trep').value.trim() && patch({ reply: $('#trep').value }, 'Reply sent');
  $('#tsolve').onclick = () => patch({ reply: $('#trep').value.trim() || undefined, status: 'solved' }, 'Marked solved');
  $('#tnote').onclick = () => $('#trep').value.trim() && patch({ note: $('#trep').value }, 'Note added');
  if ($('#tchatlink')) $('#tchatlink').onclick = (e) => { e.preventDefault(); S.tab = 'inbox'; render(); setTimeout(() => inbox(t.wa_id), 50); };
}

// ---------- help centre (public help articles; published ones also teach the assistant) ----------
async function help(editId) {

  $('#app').innerHTML = `<div class="card"><h2>📚 Help centre</h2>
    <p>Your public help site: <a href="${esc(d.url)}" target="_blank" rel="noopener">${esc(d.url)}</a> – articles, a search box and your assistant. Link it from your website footer and emails. Published articles also teach the assistant, so the chat and the help centre always agree.</p>
    ${S.role === 'owner' ? `<p><button class="btn" id="hdraft">✨ Write articles for me</button> <button class="btn ghost" id="hnew">+ New article</button> <span id="hres" class="mute"></span></p><p class="mute" style="font-size:13px">The AI writes drafts from the questions your customers ask and your own website. Nothing is public until you publish it.</p>` : ''}</div>
    <div class="split"><div class="card" style="max-height:640px;overflow:auto"><h2>Articles (${d.articles.length})</h2>
      ${cats.map((c) => `<p style="margin:10px 0 4px"><b>${esc(c)}</b></p>${d.articles.filter((a) => a.category === c).map((a) => `<div class="list-item ${String(editId) === String(a.id) ? 'on' : ''}" data-a="${a.id}">${a.status === 'published' ? '🟢' : '📝'} ${esc(a.title)}<div class="mute" style="font-size:12px">${a.status === 'published' ? `${a.views} views · 👍 ${a.helpful_yes} · 👎 ${a.helpful_no}` : 'Draft'}${a.source === 'ai' ? ' · ✨ AI draft' : a.source === 'team' ? ' · from a team answer' : ''}</div></div>`).join('')}`).join('') || '<p class="mute">No articles yet. Press "Write articles for me".</p>'}
    </div><div class="card" id="hedit"><p class="mute">Select an article to edit it.</p></div></div>`;
  $('#app').querySelectorAll('[data-a]').forEach((el) => (el.onclick = () => help(el.dataset.a)));
  if ($('#hdraft')) $('#hdraft').onclick = async () => { $('#hres').textContent = '✨ Reading your questions and website… (about 20 seconds)'; try { const r = await api(T('/help-draft'), { method: 'POST', body: { max: 6 } }); toast(r.articles.length ? `${r.articles.length} drafts written – check and publish them` : 'Nothing new to write about yet'); help(); } catch (e) { $('#hres').textContent = e.message; } };
  const editor = (a = { title: '', category: 'General', body: '', status: 'draft' }) => {
    $('#hedit').innerHTML = `<h2>${a.id ? 'Edit article' : 'New article'}</h2>
      <label>Title (the question customers ask)</label><input id="ht" value="${esc(a.title)}" placeholder="How do I book an appointment?">
      <label>Category</label><input id="hc" value="${esc(a.category)}" list="hcats"><datalist id="hcats">${cats.map((c) => `<option value="${esc(c)}">`).join('')}</datalist>
      <label>Article</label><textarea id="hb" style="min-height:260px" placeholder="Short paragraphs. Start a line with - for bullet points. **bold**">${esc(a.body)}</textarea>
      ${S.role === 'owner' ? `<p><button class="btn" id="hpub">${a.status === 'published' ? 'Save' : 'Publish'}</button> <button class="btn ghost" id="hsave">${a.status === 'published' ? 'Unpublish (back to draft)' : 'Save draft'}</button> ${a.id ? '<button class="btn ghost" id="hdel">Delete</button>' : ''} ${a.status === 'published' && a.slug ? `<a href="${esc(d.url)}/${esc(a.slug)}" target="_blank" rel="noopener">View ↗</a>` : ''}</p>` : ''}`;
    const save = async (status) => { try { const body = { title: $('#ht').value, category: $('#hc').value, body: $('#hb').value, status }; const r = a.id ? await api(T(`/help/${a.id}`), { method: 'PUT', body }) : await api(T('/help'), { method: 'POST', body }); toast(status === 'published' ? 'Published – the assistant knows this now' : 'Saved as a draft'); help(r.article.id); } catch (e) { toast(e.message); } };
    if ($('#hpub')) $('#hpub').onclick = () => save('published');
    if ($('#hsave')) $('#hsave').onclick = () => save('draft');
    if ($('#hdel')) $('#hdel').onclick = async () => { if (!confirm('Delete this article?')) return; await api(T(`/help/${a.id}`), { method: 'DELETE' }); toast('Deleted'); help(); };
  };
  if ($('#hnew')) $('#hnew').onclick = () => editor();
  if (editId) { const { article } = await api(T(`/help/${editId}`)); editor(article); }
}
