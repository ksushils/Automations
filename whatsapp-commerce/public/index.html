// ---------- orders ----------
const STATUSES = ['new', 'confirmed', 'preparing', 'ready', 'shipped', 'delivered', 'completed', 'cancelled'];
async function gcalCard() {
  const el = $('#gcalcard'); if (!el) return;
  const g = await api(T('/google')).catch(() => null); if (!g) return;
  el.innerHTML = `<div class="card" style="margin:10px 0;padding:12px"><b>🗓️ Google Calendar</b> ${g.connected ? `<span class="pill ok">connected</span> <span class="mute">Busy times are kept free in the chat; confirmed bookings are added to your calendar.</span> <button class="btn ghost" id="gdis">Disconnect</button>` : g.configured ? '<span class="mute">Stop double bookings: busy times in your calendar are kept free, and bookings appear in it.</span> <button class="btn" id="gcon">Connect Google Calendar</button>' : '<span class="mute">Not available yet – the platform owner adds Google sign-in in Setup.</span>'}${g.lastError ? `<div class="mute" style="color:#b5470b">Last problem: ${esc(g.lastError)}</div>` : ''}</div>`;
  if ($('#gcon')) $('#gcon').onclick = async () => { try { location.href = (await api(T('/google/connect'), { method: 'POST' })).url; } catch (e) { toast(e.message); } };
  if ($('#gdis')) $('#gdis').onclick = async () => { await api(T('/google/disconnect'), { method: 'POST' }); toast('Disconnected'); gcalCard(); };
}
async function bookings() {
  const past = store.get('wc_bpast') === '1';
  const { bookings: list } = await api(T(`/bookings${past ? '?past=1' : ''}`));
  const sym = S.tenant.settings.business.currencySymbol || '£';
  const on = S.tenant.settings.bookings?.enabled;
  const pill = { requested: '<span class="pill warn">to confirm</span>', awaiting_deposit: '<span class="pill">awaiting deposit</span>', confirmed: '<span class="pill ok">confirmed</span>', cancelled: '<span class="pill">cancelled</span>', completed: '<span class="pill ok">done</span>', no_show: '<span class="pill warn">no-show</span>' };
  const day = (b) => new Date(b.day + 'T12:00:00Z').toLocaleDateString('en-GB', { weekday: 'short', day: 'numeric', month: 'short', timeZone: 'UTC' });
  const actions = (b) => (b.status === 'requested' ? [['confirmed', '✅ Confirm'], ['cancelled', 'Decline']] : b.status === 'confirmed' ? [['completed', 'Done'], ['no_show', 'No-show'], ['cancelled', 'Cancel']] : b.status === 'awaiting_deposit' ? [['confirmed', 'Confirm anyway'], ['cancelled', 'Cancel']] : [])
    .map(([s, l]) => `<button class="btn ${s === 'confirmed' || s === 'completed' ? '' : 'ghost'}" data-bs="${b.id}" data-st="${s}">${l}</button>`).join(' ');
  $('#app').innerHTML = `<div class="card"><div style="display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;align-items:center"><h2 style="margin:0">📅 Bookings</h2>
      <div><button class="btn ${past ? 'ghost' : ''}" data-bp="0">Upcoming</button> <button class="btn ${past ? '' : 'ghost'}" data-bp="1">Past</button></div></div>
    <div id="gcalcard"></div>
    ${on ? '' : '<p class="mute">Bookings in the chat are off. Switch them on in Settings → Bookings in the chat: add your start times (and services), and customers can book by typing <b>book</b>.</p>'}
    <div class="tablewrap"><table><tr><th>When</th><th>Customer</th><th>Service</th><th>Status</th><th></th></tr>
    ${list.map((b) => `<tr><td><b>${esc(day(b))}</b> ${esc(b.time)}</td><td>${esc(b.name || '')}<div class="mute">${String(b.wa_id).startsWith('web:') ? 'website chat' : '+' + esc(b.wa_id)}</div></td><td>${esc(b.service || '–')}${b.deposit ? `<div class="mute">deposit ${sym}${Number(b.deposit).toFixed(2)} ${b.deposit_paid ? '✅ paid' : 'unpaid'}</div>` : ''}</td><td>${pill[b.status] || esc(b.status)}${b.reminded_at ? '<div class="mute">reminded</div>' : ''}</td><td style="white-space:nowrap">${actions(b)}</td></tr>`).join('') || `<tr><td colspan="5" class="mute">No ${past ? 'past' : 'upcoming'} bookings</td></tr>`}</table></div></div>`;
  gcalCard();
  $('#app').querySelectorAll('[data-bp]').forEach((b) => (b.onclick = () => { store.set('wc_bpast', b.dataset.bp === '1' ? '1' : null); bookings(); }));
  $('#app').querySelectorAll('[data-bs]').forEach((b) => (b.onclick = async () => {
    try { await api(T(`/bookings/${b.dataset.bs}/status`), { method: 'POST', body: { status: b.dataset.st } }); toast(b.dataset.st === 'confirmed' ? 'Confirmed – the customer has been told' : b.dataset.st === 'cancelled' ? 'Cancelled – the customer has been told' : 'Updated'); bookings(); } catch (e) { toast(e.message); }
  }));
}

async function orders() {
  const { orders } = await api(T('/orders?limit=100'));
  const sym = S.tenant.settings.business.currencySymbol || '£';
  $('#app').innerHTML = `<div class="card"><h2>Orders <button class="btn ghost" data-csv="orders">⬇ Export CSV</button> <button class="btn ghost" data-csv="customers">⬇ Customers CSV</button></h2><div class="tablewrap"><table><tr><th>Order</th><th>Customer</th><th>Items</th><th>Total</th><th>Status</th><th>Payment</th><th></th></tr>
    ${orders.map((o) => `<tr><td><b>${esc(o.store_order_name)}</b><div class="mute">${esc(o.created_at)}</div></td><td>${esc(o.customer_name || '')}<div class="mute">+${esc(o.wa_id)}</div><div class="mute">${esc(o.fulfilment)}${o.address ? ': ' + esc(o.address) : ''}</div>${o.slot ? `<div class="mute">🕒 ${esc(o.slot)}</div>` : ''}${o.notes ? `<div class="mute">📝 ${esc(o.notes)}</div>` : ''}</td>
      <td>${o.items.map((i) => `${esc(i.title)} ×${i.quantity}`).join('<br>')}</td><td>${sym}${Number(o.subtotal).toFixed(2)}${o.promo_code ? `<div class="mute">🏷️ ${esc(o.promo_code)} -${sym}${Number(o.discount).toFixed(2)}</div>` : ''}${o.receipt_token ? `<div><a href="/r/${esc(o.receipt_token)}" target="_blank" rel="noopener">receipt</a></div>` : ''}</td>
      <td><select data-s="${o.id}">${STATUSES.map((s) => `<option ${s === o.status ? 'selected' : ''}>${s}</option>`).join('')}</select></td>
      <td><select data-p="${o.id}">${['unpaid', 'paid', 'refunded'].map((s) => `<option ${s === o.payment_status ? 'selected' : ''}>${s}</option>`).join('')}</select><div class="mute">${esc(o.payment_method)}</div></td>
      <td><button class="btn ghost" data-u="${o.id}">Save & notify</button></td></tr>`).join('') || '<tr><td colspan="7" class="mute">No orders yet</td></tr>'}</table></div></div>`;
  $('#app').querySelectorAll('[data-csv]').forEach((b) => (b.onclick = () => downloadCsv(b.dataset.csv)));
  $('#app').querySelectorAll('[data-u]').forEach((b) => (b.onclick = async () => {
    const id = b.dataset.u;
    const r = await api(T('/orders/' + id), { method: 'PATCH', body: { status: $(`[data-s="${id}"]`).value, payment_status: $(`[data-p="${id}"]`).value, notify: true } });
    toast(r.notified === true ? 'Saved & customer notified' : 'Saved (notify: ' + r.notified + ')');
  }));
}

// ---------- catalogue (built-in store) ----------
async function catalogue() {
  const s = S.tenant.settings;
  if (s.store.type !== 'manual') {
    $('#app').innerHTML = `<div class="card"><h2>Catalogue</h2><p>Products come live from your <b>${esc(s.store.type)}</b> store. Manage them there. Switch store type in Settings to use the built-in catalogue.</p></div>`;
    return;
  }
  const m = s.store.manual;
  const sym = s.business.currencySymbol || '£';
  const prods = m.products || [], cats = m.categories || [];
  $('#app').innerHTML = `<div class="card"><h2>Your products (${prods.length})</h2>
    <div class="tablewrap"><table><tr><th>Product</th><th>Price</th><th>Category</th><th>Stock</th><th></th></tr>
    ${prods.map((p, i) => `<tr><td>${p.image ? `<img src="${esc(p.image)}" alt="" style="width:36px;height:36px;object-fit:cover;border-radius:6px;vertical-align:middle;margin-right:6px">` : ''}<b>${esc(p.title)}</b><div class="mute">${esc((p.description || '').slice(0, 80))}</div></td><td>${sym}${Number(p.price || 0).toFixed(2)}</td><td>${esc(cats.find((c) => c.id === p.category)?.title || '')}</td><td>${p.stock == null || p.stock === '' ? '–' : esc(p.stock)}</td><td><button class="btn ghost" data-pdel="${i}">Remove</button></td></tr>`).join('') || '<tr><td colspan="5" class="mute">No products yet. Add your first one below.</td></tr>'}</table></div></div>
    <div class="card"><h2>➕ Add a product</h2><div class="row">
      <div><label>Name</label><input id="pn" placeholder="Lavender candle"></div>
      <div><label>Price (${esc(sym)})</label><input id="pp" type="number" min="0" step="0.01" placeholder="12.50"></div>
      <div><label>Category</label><select id="pc">${cats.map((c) => `<option value="${esc(c.id)}">${esc(c.title)}</option>`).join('')}<option value="__new">+ New category…</option></select><input id="pcn" placeholder="New category name" style="margin-top:6px;display:none"></div>
      <div><label>Stock (empty = unlimited)</label><input id="pst" type="number" min="0" step="1"></div></div>
      <label>Description (optional)</label><input id="pd" placeholder="Hand-poured soy wax, burns for 40 hours">
      <label>Photo link (optional, starts with https://)</label><input id="pi" placeholder="https://…/photo.jpg">
      <p><button class="btn" id="padd">Add product</button></p></div>
    <details class="card"><summary><b>Advanced: edit everything as JSON</b></summary><p class="mute">Fields: id, title, price, description, image, category, variants [{id,title,price}].</p>
    <label>Categories (JSON)</label><textarea id="cats" style="min-height:90px">${esc(JSON.stringify(cats, null, 2))}</textarea>
    <label>Products (JSON)</label><textarea id="prods" style="min-height:320px;font-family:monospace">${esc(JSON.stringify(prods, null, 2))}</textarea>
    <p><button class="btn" id="savecat">Save catalogue</button> <button class="btn ghost" id="sample">Load sample products</button></p></details>
    <div class="card"><h2>Import products from CSV</h2><p class="mute">Columns: <code>id,title,price,compare_at_price,category,description,image,stock,options</code> — options like <code>Small:15:10|Large:16:4</code> (name:price:stock). Rows with an existing id are updated. Leave stock empty for unlimited.</p>
    <input type="file" id="csvf" accept=".csv,text/csv"> <label><input type="checkbox" id="csvreplace" style="width:auto"> Replace whole catalogue</label>
    <p><button class="btn" id="csvgo">Import CSV</button></p><pre id="csvres" class="mute" style="white-space:pre-wrap"></pre></div>`;
  const saveProducts = async (products, categories = cats) => { S.tenant = (await api(T('/settings'), { method: 'PATCH', body: { store: { manual: { categories, products } } } })).tenant; catalogue(); };
  $('#pc').onchange = () => { $('#pcn').style.display = $('#pc').value === '__new' ? '' : 'none'; };
  $('#padd').onclick = async () => {
    const title = $('#pn').value.trim(), price = Number($('#pp').value);
    if (!title) return toast('Type the product name');
    if (!(price >= 0) || $('#pp').value === '') return toast('Type the price');
    let category = $('#pc').value, categories = cats;
    if (category === '__new') {
      const name = $('#pcn').value.trim(); if (!name) return toast('Type the new category name');
      category = name.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '') || 'cat-' + Date.now();
      if (!cats.find((c) => c.id === category)) categories = [...cats, { id: category, title: name }];
    }
    const slug = title.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '').slice(0, 40) || 'item';
    const id = prods.some((p) => p.id === slug) ? `${slug}-${Date.now().toString(36)}` : slug;
    const p = { id, title, price, category, description: $('#pd').value.trim() };
    if ($('#pi').value.trim()) p.image = $('#pi').value.trim();
    if ($('#pst').value !== '') p.stock = Number($('#pst').value);
    try { await saveProducts([...prods, p], categories); toast('Added ' + title); } catch (e) { toast(e.message); }
  };
  $('#app').querySelectorAll('[data-pdel]').forEach((b) => (b.onclick = async () => { const p = prods[+b.dataset.pdel]; if (confirm(`Remove ${p.title}?`)) { try { await saveProducts(prods.filter((_, i) => i !== +b.dataset.pdel)); } catch (e) { toast(e.message); } } }));
  $('#csvgo').onclick = async () => {
    const f = $('#csvf').files[0]; if (!f) return toast('Choose a CSV file');
    try { const r = await api(T('/catalogue/import'), { method: 'POST', body: { csv: await f.text(), replace: $('#csvreplace').checked } }); S.tenant = r.tenant; toast(`Imported ${r.imported} products`); catalogue(); }
    catch (e) { $('#csvres').textContent = e.message; }
  };
  $('#sample').onclick = () => {
    $('#cats').value = JSON.stringify([{ id: 'tees', title: 'T-shirts' }, { id: 'mugs', title: 'Mugs' }], null, 2);
    $('#prods').value = JSON.stringify([
      { id: 'tee-classic', title: 'Classic Tee', price: 15, category: 'tees', description: '100% organic cotton', image: '', variants: [{ id: 'tee-s', title: 'Small', price: 15 }, { id: 'tee-m', title: 'Medium', price: 15 }, { id: 'tee-l', title: 'Large', price: 16 }] },
      { id: 'mug-white', title: 'White Mug', price: 8.5, category: 'mugs', description: '350ml ceramic, dishwasher safe' },
    ], null, 2);
  };
  $('#savecat').onclick = async () => {
    try {
      const categories = JSON.parse($('#cats').value), products = JSON.parse($('#prods').value);
      // send full arrays (deep-merge replaces arrays)
      S.tenant = (await api(T('/settings'), { method: 'PATCH', body: { store: { manual: { categories, products } } } })).tenant;
      toast('Catalogue saved');
    } catch (e) { toast(e.message); }
  };
}

const getP = (o, p) => p.split('.').reduce((a, k) => (a == null ? a : a[k]), o);
function setP(o, p, v) { const ks = p.split('.'); let c = o; ks.slice(0, -1).forEach((k) => (c = c[k] ||= {})); c[ks.at(-1)] = v; }
async function settings() {
  const s = S.tenant.settings;
  $('#app').innerHTML = '<div id="wmcard"></div>' + FIELDS.map(([title, fields]) => `<div class="card"><h2>${title}</h2><div class="row">${fields.map(([p, l, type, opts]) => {
    const v = getP(s, p);
    let input;
    if (type === 'textarea') input = `<textarea data-f="${p}">${esc(v)}</textarea>`;
    else if (type === 'json') input = `<textarea data-f="${p}" data-type="json" style="font-family:monospace;min-height:110px">${esc(JSON.stringify(v ?? [], null, 2))}</textarea>`;
    else if (type === 'select') input = `<select data-f="${p}">${opts.map((o) => `<option ${o === v ? 'selected' : ''}>${o}</option>`).join('')}</select>`;
    else if (type === 'bool') { const on = v ?? ['report.weeklyDigest', 'report.monthlyEmail', 'report.unansweredEmail'].includes(p); input = `<select data-f="${p}" data-type="bool"><option value="true" ${on ? 'selected' : ''}>Yes</option><option value="false" ${!on ? 'selected' : ''}>No</option></select>`; }
    else input = `<input data-f="${p}" data-type="${type || ''}" ${type === 'secret' ? 'type="password" placeholder="(unchanged)"' : ''} value="${esc(type === 'csv' || type === 'csvnum' ? (v || []).join(',') : type === 'secret' ? '' : v)}">`;
    return `<div><label>${l}</label>${input}</div>`;
  }).join('')}</div></div>`).join('') + '<p><button class="btn" id="saveset">Save settings</button></p>';
  welcomeMenuEditor();
  $('#saveset').onclick = async () => {
    const patch = {};
    let bad = null;
    $('#app').querySelectorAll('[data-f]').forEach((el) => {
      const t = el.dataset.type; let v = el.value;
      if (t === 'secret' && !v) return;
      if (t === 'json') { try { v = JSON.parse(v || '[]'); } catch { bad = el.dataset.f; return; } }
      if (t === 'csvnum') v = v.split(',').map((x) => x.trim()).filter((x) => x !== '').map(Number);
      if (t === 'csv') v = v.split(',').map((x) => x.trim()).filter(Boolean);
      if (t === 'number') v = Number(v) || 0;
      if (t === 'bool') v = v === 'true';
      setP(patch, el.dataset.f, v);
    });
    if (bad) return toast('Invalid JSON in ' + bad);
    try { S.tenant = (await api(T('/settings'), { method: 'PATCH', body: patch })).tenant; toast('Settings saved'); } catch (e) { toast(e.message); }
  };
}

async function downloadCsv(kind) {
  const res = await fetch('/api' + T(`/export/${kind}.csv`), { headers: { Authorization: 'Bearer ' + S.key } });
  if (!res.ok) return toast('Export failed');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(await res.blob());
  a.download = `${kind}-${S.tenantId}.csv`;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}

        <div class="row"><div><label>Tone</label><select id="g-tone">${[['friendly', 'Friendly 😊'], ['professional', 'Professional'], ['playful', 'Playful 🎉'], ['luxury', 'Luxury / premium']].map(([k, l]) => `<option value="${k}" ${s.ai?.tone === k ? 'selected' : ''}>${l}</option>`).join('')}</select></div></div>
        <p><button class="btn" id="g-aisave">Save</button> <span class="mute">${d.docs ? `${d.docs} document(s) already in your knowledge base.` : ''} You can also add PDFs and web pages in <a href="#" data-gtab="knowledge">Knowledge base</a>.</span></p>`;
      case 'test': return `<p>Chat with your assistant exactly as a customer would. Nothing is sent to anyone.</p>
        <p class="mute">Try: <code>hi</code> · <code>what's your returns policy?</code> · <code>do you deliver to Leeds?</code> · the name of one of your products.</p>
        <p><button class="btn" data-gtab="simulator">Open the test chat</button></p><p class="mute">Wrong answer? Fix it in step ${num('assistant')} and try again.</p>`;
      case 'website': {
        const code = `<script src="${location.origin}/chat-widget/${t.id}.js" async><\/script>`;
        const where = {
          shopify: '<b>Shopify:</b> Online Store → Themes → ⋯ → Edit code → open <code>theme.liquid</code> → paste just above <code>&lt;/body&gt;</code> → Save.',
          wordpress: '<b>WordPress / WooCommerce:</b> easiest: <button class="btn ghost" data-wpzip="1" style="padding:4px 10px">⬇ Download our plugin</button> then Plugins → Add New → Upload Plugin → choose the file → Activate. Done, no code. (Or paste the code with the free WPCode plugin → Header &amp; Footer → Footer.)',
          wix: '<b>Wix:</b> Settings → Custom code → Add code → paste → All pages, Body end → Apply.',
          squarespace: '<b>Squarespace:</b> Settings → Advanced → Code injection → paste in <b>Footer</b> → Save.',
          webflow: '<b>Webflow:</b> Site settings → Custom code → paste in <b>Footer code</b> → Save → Publish.',
          godaddy: '<b>GoDaddy Website Builder:</b> Edit website → Add section → HTML → paste → Done → Publish.',
          gtm: '<b>Google Tag Manager:</b> Tags → New → Custom HTML → paste → Trigger: All Pages → Save → Submit.',
          other: '<b>Any other website:</b> paste it just above <code>&lt;/body&gt;</code> on every page, or in the site footer.',
        };
        const first = /shopify/.test(d.storeType || s.store.type) ? 'shopify' : s.store.type === 'woocommerce' ? 'wordpress' : null;
        const order = [first, ...Object.keys(where).filter((k) => k !== first)].filter(Boolean);
        S.installWhere = where;
        const mail = `mailto:?subject=${encodeURIComponent('Please add our chat to the website')}&body=${encodeURIComponent(`Hi,\n\nPlease paste this code on every page of our website, just above </body> (or in the footer):\n\n${code}\n\nIt adds a small chat button in the bottom corner. Thank you!`)}`;
        if (d.seenOn) return `<p>✅ We can see your chat on <b>${esc(d.seenOn)}</b>. Customers can now ask questions and order there.</p>
          <p class="mute">Open your website and try the chat button in the corner. Change its colour and wording in <a href="#" data-gtab="grow">Grow</a>.</p>`;
        return `<p>Add a chat button to your website, so customers can ask questions and order today. WhatsApp isn't needed for this. It's one copy and paste, done once.</p>
        <div id="g-plat"></div>
        ${stepNo(1, `<b>Copy this code</b><div style="display:flex;gap:6px;margin-top:6px"><input readonly value="${esc(code)}"><button class="btn" data-gcopy="${esc(code)}">Copy</button></div>`)}
        ${stepNo(2, `<b>Paste it into your website</b><div class="mute" style="margin-top:4px">${order.map((k) => '• ' + where[k]).join('<br>')}</div>
          <p class="mute">Someone else looks after your website? <a class="btn ghost" href="${esc(mail)}">✉️ Email these steps to them</a></p>`)}
        ${stepNo(3, `<b>Check it worked:</b> open your website once, then press the button below. We can tell when the chat shows on your site.<p><button class="btn ghost" id="g-recheck">Check now</button> <span id="g-res" class="mute"></span></p>`)}
        <p style="margin-top:10px"><b>No website?</b> Use your ready-made shop page instead. Put it in your Instagram bio, Google profile or on a QR code:</p>
        <div style="display:flex;gap:6px"><input readonly value="${esc(t.urls.storefront)}"><button class="btn ghost" data-gcopy="${esc(t.urls.storefront)}">Copy</button><a class="btn ghost" href="${esc(t.urls.storefront)}?chat=1" target="_blank" rel="noopener">Open</a></div>
        <p class="mute">${skip}</p>`;
      }
      case 'orders': {
        const alertsBox = `<h3>Who hears about new orders</h3>${d.emailOn
          ? `<div class="mute">We email every new order, and every customer who asks for a person, to:</div><div style="display:flex;gap:6px;margin-top:6px"><input id="g-aemail" value="${esc((d.alertEmails || []).join(', '))}" placeholder="you@yourshop.co.uk"><button class="btn ghost" id="g-aesave">Save</button><button class="btn ghost" id="g-aetest">Send a test</button></div><div class="mute">Several people? Separate the emails with commas.</div>`
          : '<div class="mute">Email alerts aren\'t switched on by your provider yet. Until then, check the <a href="#" data-gtab="orders">Orders</a> tab for new orders. Once WhatsApp is connected, you can also get alerts on your phone.</div>'}<div id="g-aeres" class="mute"></div>`;
        if (d.ownCheckout) return `<p>✅ Payment and delivery: nothing to do. Customers pay and choose delivery on <b>your ${d.storeType === 'woocommerce' ? 'WooCommerce' : 'Shopify'} checkout</b>, as they do now. The assistant fills their basket and sends them there.</p>${alertsBox}`;
        const pm = new Set(d.paymentMethods), ff = new Set(d.fulfilment);
        const chk = (id, on, label) => `<label style="display:flex;gap:8px;align-items:center;color:var(--ink);font-size:14px;margin:10px 0 4px"><input type="checkbox" id="${id}" style="width:auto" ${on ? 'checked' : ''}> ${label}</label>`;
        return `<p>Choose how customers pay you and how they get their order. Tick everything you offer.</p>
        <h3 style="margin-top:8px">How customers pay</h3>
        ${chk('g-pcard', pm.has('payment_link') && (d.stripe || d.paymentLinkUrl), '💳 Card, online')}
        <div style="padding-left:26px"><div class="mute">Best: connect your own Stripe account. The money goes straight to you, and orders are marked paid automatically. Get your secret key from ${ext('https://dashboard.stripe.com/apikeys', 'Stripe → Developers → API keys')}.</div>
          ${d.stripe ? '<p>✅ Stripe connected.</p>' : `<div style="display:flex;gap:6px;margin-top:6px"><input id="g-sk" type="password" placeholder="sk_live_…"><button class="btn ghost" id="g-skgo">Connect Stripe</button></div>`}
          <details style="margin-top:6px"><summary class="mute">No Stripe? Use a payment link instead (PayPal.me, SumUp…)</summary><input id="g-plink" placeholder="https://paypal.me/yourshop/{total}" value="${esc(d.paymentLinkUrl)}"><div class="mute">{total} and {order} are filled in for you. You mark these orders as paid yourself.</div></details></div>
        ${chk('g-pbank', pm.has('bank_transfer'), '🏦 Bank transfer')}
        <div style="padding-left:26px"><textarea id="g-bank" placeholder="Account name, sort code, account number">${esc(d.bankDetails)}</textarea></div>
        ${chk('g-pcod', pm.has('cod'), '💷 Cash or card when they receive or collect it')}
        <h3>How they get it</h3>
        ${chk('g-fdel', ff.has('delivery'), '🚚 Delivery')}
        <div class="row" style="padding-left:26px"><div><label>Delivery fee</label><input id="g-dfee" type="number" min="0" step="0.01" value="${esc(d.deliveryFee)}"></div><div><label>Free delivery over (0 = never)</label><input id="g-dfree" type="number" min="0" step="0.01" value="${esc(d.freeDeliveryOver)}"></div></div>
        ${chk('g-fpick', ff.has('pickup'), '🏪 Collection')}
        <div style="padding-left:26px"><label>Collection address</label><input id="g-paddr" value="${esc(d.pickupAddress)}" placeholder="12 High Street, Leeds LS1 1AA"></div>
        <p class="mute">Delivery areas, time slots and promo codes are in <a href="#" data-gtab="settings">Settings</a> if you need them.</p>
        <p><button class="btn" id="g-ordsave">Save</button></p><div id="g-res"></div>${alertsBox}`;
      }
      case 'whatsapp': return `<p>Now let customers order inside WhatsApp. Before you start, have these ready:</p>
        <div class="mute">• A <b>phone number</b> that can get a text or call. You can keep using the <b>WhatsApp Business app</b> on it, or use a new number.<br>
        • Your <b>Facebook</b> login. Meta will ask you to create or choose your business.<br>
        • A <b>card</b> to add in Meta later. Meta charges small fees per message; the first 1,000 customer chats a month are free.</div>
        ${d.oneClick ? '<p id="esu" style="margin-top:12px"></p>' : '<p class="pill warn" style="margin-top:12px">One-click WhatsApp connect isn\'t switched on yet by your provider. You\'ll be able to connect here soon. Carry on with the other steps meanwhile.</p>'}
        ${d.pending ? `<p class="mute">Meta is still checking your number${d.numberStatus ? ` (${esc(d.numberStatus)})` : ''}. Press <b>Refresh number</b> once you've verified it.</p>` : ''}<p>${skip}</p>`;
      case 'golive': return `<p>Three things so WhatsApp keeps working smoothly:</p>
        ${stepNo('a', `<b>Message templates</b> ${d.templates.length === d.required.length ? '✅' : `(${d.templates.length}/${d.required.length})`}<div class="mute">WhatsApp needs pre-approved messages for order updates, payment reminders and staff alerts. Approval usually takes minutes.</div>${d.templates.length === d.required.length ? '' : '<p><button class="btn" id="g-tpl">Submit them for me</button></p>'}`)}
        ${stepNo('b', `<b>Who gets new-order alerts?</b> ${d.staff ? '✅' : ''}<div style="display:flex;gap:6px;margin-top:6px"><input id="g-staff" placeholder="Your mobile, e.g. 447700900123" value="${esc((s.notifications?.staffWaIds || []).join(', '))}"><button class="btn ghost" id="g-staffgo">Save</button></div>`)}
        ${stepNo('c', `<b>Send “hi” to your business number</b> from your own phone ${d.inbound ? '✅' : ''}<div class="mute">It should appear in the <a href="#" data-gtab="inbox">Inbox</a> within seconds. This step ticks itself.</div>`)}
        <div id="g-res" class="mute"></div><p>${skip}</p>`;
      case 'plan': return d.billing
        ? `<p>${d.status === 'trialing' && d.trialEndsAt ? `Your free trial ends on <b>${new Date(d.trialEndsAt + 'Z').toLocaleDateString('en-GB')}</b>. ` : ''}Choose a plan to keep your shop running after that. You can change or cancel any time.</p><p><button class="btn" data-gtab="billing">Choose my plan</button></p>`
        : '<p class="mute">Your provider will send you an invoice. Nothing to do here.</p>';
    }
    return '';
  };
  el.innerHTML = `<div class="card">
    <h2>${nextStep ? `👉 Next: ${esc(nextStep.title)}` : '🎉 All done'} <span class="mute" style="font-weight:400">· ${g.done} of ${g.total} steps done</span></h2>
    <div style="height:8px;background:var(--bg);border-radius:99px;overflow:hidden;margin-bottom:8px"><div style="height:100%;width:${(g.done / g.total) * 100}%;background:var(--brand)"></div></div>
    ${g.phases.map((ph) => {
      const steps = g.steps.filter((x) => x.phase === ph.key);
      return `<h3>${esc(ph.title)} <span style="text-transform:none;letter-spacing:0;font-weight:400">· ${esc(ph.time)}</span></h3>` + steps.map((st) => {
        const isOpen = st.key === open;
        const icon = st.done ? '✅' : st.key === g.next ? '👉' : st.skipped ? '⏭️' : '⬜';
        return `<div style="border:1px solid ${isOpen ? 'var(--brand)' : 'var(--line)'};border-radius:10px;margin:6px 0">
          <div data-gopen="${st.key}" style="display:flex;gap:10px;align-items:center;padding:10px;cursor:pointer"><span style="font-size:18px">${icon}</span>
            <div style="flex:1"><b>${num(st.key)}. ${esc(st.title)}</b><div class="mute">${esc(st.why)}</div></div><span class="mute">${isOpen ? '▾' : '▸'}</span></div>
          ${isOpen ? `<div style="padding:0 12px 12px 40px">${body(st)}</div>` : ''}</div>`;
      }).join('');
    }).join('')}</div>`;

  const d0 = (k) => g.steps.find((x) => x.key === k)?.data || {};
  const reload = async (keepOpen) => { S.tenant = (await api(T(''))).tenant; S.guideOpen = keepOpen ? open : null; shopGuide(S.tenant); };
  const res = (h) => { if ($('#g-res')) $('#g-res').innerHTML = h; };
  const patch = async (body) => (S.tenant = (await api(T('/settings?sync=0'), { method: 'PATCH', body })).tenant);
  el.querySelectorAll('[data-gopen]').forEach((x) => (x.onclick = () => { S.guideOpen = x.dataset.gopen === open ? '__none' : x.dataset.gopen; shopGuide(t); }));
  el.querySelectorAll('[data-gtab]').forEach((x) => (x.onclick = (e) => { e.preventDefault(); S.fromGuide = true; S.tab = x.dataset.gtab; store.set('wc_tab', S.tab); render(); }));
  el.querySelectorAll('[data-gcopy]').forEach((x) => (x.onclick = () => navigator.clipboard?.writeText(x.dataset.gcopy).then(() => toast('Copied'), () => toast('Select the text and copy it'))));
  el.querySelectorAll('[data-gskip]').forEach((x) => (x.onclick = async () => { try { await patch({ onboarding: { skipped: { [x.dataset.gskip]: true } } }); reload(false); } catch (e) { toast(e.message); } }));
  const on = (id, fn) => { const b = $('#' + id); if (b) b.onclick = async () => { b.disabled = true; try { await fn(); } catch (e) { res('⚠️ ' + esc(e.message)); } finally { b.disabled = false; } }; };
  on('g-sitego', async () => {
    res('Reading your website… this can take up to a minute.');
    const r = await api(T('/onboarding/website'), { method: 'POST', body: { url: $('#g-site').value } });
    res(`✅ Found <b>${esc(r.site.name || r.site.domain)}</b>${r.store ? ' and connected its products' : ''}. Imported ${r.imported.length} page(s): ${esc(r.imported.map((x) => x.name).join(', ') || 'none')}`);
    setTimeout(() => reload(false), 2500);
  });
  on('g-bookgo', async () => {
    let url = $('#g-book').value.trim(); if (url && !/^https?:\/\//.test(url)) url = 'https://' + url;
    await patch({ store: { type: 'none' }, business: { bookingUrl: url, welcomeMessage: `Hi{{name}}! 👋 Welcome to ${s.business.name}. Ask me anything, or tap below.` } });
    toast('Saved: enquiries and bookings'); reload(false);
  });
  on('g-okeygo', async () => {
    const key = $('#g-okey').value.trim();
    const out = (h) => { $('#g-ores').innerHTML = h; };
    if (!/^shp(at|ca|pa)_/.test(key)) return out('⚠️ That doesn\'t look like a Shopify Admin API token. It starts with shpat_.');
    out('Checking with Shopify…');
    await patch({ store: { shopify: { adminToken: key } } });
    const r = await api(T('/test/orders'), { method: 'POST', body: {} });
    if (!r.ok) return out('⚠️ Shopify said: ' + esc(r.error || 'error') + '. Check the key and that <code>read_orders</code> is ticked.');
    out(`✅ Connected${r.latest ? `: your latest order is ${esc(r.latest)}` : ''}.`); setTimeout(() => reload(true), 1500);
  });
  on('g-store', async () => { res('Checking…'); const r = await api(T('/test/store'), { method: 'POST', body: {} }); res(r.ok ? `✅ Connected${r.name ? ' to ' + esc(r.name) : ''}${r.products != null ? `, ${r.products} products` : ''}` : '⚠️ ' + esc(r.error)); });
  on('g-shopgo', async () => {
    const domain = $('#g-shop').value.trim().replace(/^https?:\/\//, '').replace(/\/.*$/, '');
    if (!domain) return res('Type your Shopify shop address first.');
    await patch({ store: { type: 'shopify_public', shopify: { domain } }, business: { website: s.business?.website || 'https://' + domain } });
    const r = await api(T('/test/store'), { method: 'POST', body: {} });
    if (!r.ok) return res('⚠️ We couldn\'t read products from that address: ' + esc(r.error));
    res(`✅ Connected${r.products != null ? `, ${r.products} products found` : ''}`); setTimeout(() => reload(false), 1500);
  });
  on('g-woogo', async () => {
    await patch({ store: { type: 'woocommerce', woocommerce: { url: $('#g-wurl').value.trim(), consumerKey: $('#g-wck').value.trim(), consumerSecret: $('#g-wcs').value.trim() } } });
    const r = await api(T('/test/store'), { method: 'POST', body: {} });
    if (!r.ok) return res('⚠️ ' + esc(r.error) + ' Check the address and both keys.');
    res('✅ Connected to WooCommerce'); setTimeout(() => reload(false), 1500);
  });
  if ($('#g-plat') && S.installWhere) api(T('/install/detect')).then((p) => {
    const W = S.installWhere; const names = { shopify: 'Shopify', wordpress: 'WordPress', wix: 'Wix', squarespace: 'Squarespace', webflow: 'Webflow', godaddy: 'GoDaddy', gtm: 'Google Tag Manager' };
    if (!p.platform || !W[p.platform] || !$('#g-plat')) return;
    $('#g-plat').innerHTML = `<div class="card" style="margin:0 0 10px;border-color:var(--brand)"><b>🔎 Your website is built with ${names[p.platform]}.</b> Here's exactly what to do:<div style="margin-top:6px">${W[p.platform]}</div></div>`;
  }).catch(() => {});
  document.querySelectorAll('[data-wpzip]').forEach((b) => (b.onclick = async (e) => {
    e.preventDefault();
    try {
      const r = await fetch('/api' + T('/install/wordpress-plugin.zip'), { headers: { Authorization: 'Bearer ' + S.key } });
      if (!r.ok) throw new Error('Download failed');
      const a = document.createElement('a'); a.href = URL.createObjectURL(await r.blob()); a.download = 'ai-chat-assistant.zip'; a.click();
      toast('Downloaded – now upload it in WordPress → Plugins → Add New → Upload Plugin');
    } catch (err) { toast(err.message); }
  }));
  on('g-recheck', async () => { res('Checking your website…'); const ck = await api(T('/install/check'), { method: 'POST' }).catch(() => null); if (ck?.ok) return reload(true); if (ck && ck.reason !== 'not_found') return res(ck.message); const g2 = await api(T('/onboarding')); const w = g2.steps.find((x) => x.key === 'website'); if (w.data.seenOn || w.done) return reload(true); res('Not yet. Open your website in a new tab after saving the change there, then press Check now again.'); });
  on('g-skgo', async () => {
    res('Connecting to Stripe…');
    const r = await api(T('/payments/stripe-connect'), { method: 'POST', body: { secretKey: $('#g-sk').value } });
    toast(r.mode === 'live' ? 'Stripe connected' : 'Stripe connected in TEST mode'); reload(true);
  });
  on('g-aesave', async () => {
    const emails = $('#g-aemail').value.split(/[,;\s]+/).map((x) => x.trim()).filter(Boolean);
    if (emails.some((e) => !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(e))) { $('#g-aeres').textContent = '⚠️ One of those emails doesn\'t look right.'; return; }
    await patch({ notifications: { alertEmails: emails } });
    $('#g-aeres').textContent = '✅ Saved';
  });
  on('g-aetest', async () => {
    $('#g-aeres').textContent = 'Sending…';
    const r = await api(T('/alert-emails/test'), { method: 'POST' });
    $('#g-aeres').textContent = r.ok ? '✅ Sent. Check your inbox (and spam, the first time).' : '⚠️ ' + (r.error || 'No email address saved yet.');
  });
  on('g-ordsave', async () => {
    const pm = [], ff = [];
    const plink = ($('#g-plink')?.value || '').trim();
    if ($('#g-pcard').checked) { if (!d0('orders').stripe && !plink) return res('⚠️ To take card payments, connect Stripe or add a payment link. Or untick Card.'); pm.push('payment_link'); }
    if ($('#g-pbank').checked) { if (!$('#g-bank').value.trim()) return res('⚠️ Add your bank details, or untick Bank transfer.'); pm.push('bank_transfer'); }
    if ($('#g-pcod').checked) pm.push('cod');
    if ($('#g-fdel').checked) ff.push('delivery');
    if ($('#g-fpick').checked) { if (!$('#g-paddr').value.trim()) return res('⚠️ Add your collection address, or untick Collection.'); ff.push('pickup'); }
    if (!pm.length) return res('⚠️ Tick at least one way to pay.');
    if (!ff.length) return res('⚠️ Tick delivery, collection or both.');
    await patch({ ordering: { paymentMethods: pm, fulfilment: ff, deliveryFee: Number($('#g-dfee').value) || 0, freeDeliveryOver: Number($('#g-dfree').value) || 0, pickupAddress: $('#g-paddr').value.trim(), bankDetails: $('#g-bank').value.trim(), paymentLinkUrl: plink }, onboarding: { ordersSet: true } });
    toast('Saved'); reload(false);
  });
  on('g-aisave', async () => { await patch({ ai: { about: $('#g-about').value, faq: $('#g-faq').value, tone: $('#g-tone').value } }); toast('Saved'); reload(false); });
  on('g-tpl', async () => {
    res('Sending to Meta…');
    const lib = (await api(T('/templates'))).library.filter((x) => g.steps.find((y) => y.key === 'golive').data.required.includes(x.name));
    const out = [];
    for (const tp of lib) out.push(await api(T('/templates'), { method: 'POST', body: tp }).then(() => `✅ ${tp.name}`, (e) => `⚠️ ${tp.name}: ${e.message}`));
    await api(T('/templates')).catch(() => {}); // refreshes the saved list
    res(out.map(esc).join('<br>')); setTimeout(() => reload(true), 2500);
  });
  on('g-staffgo', async () => {
    const ids = $('#g-staff').value.split(',').map((x) => x.replace(/\D/g, '')).filter(Boolean);
    const tp = s.notifications?.templates || {}; // also point the outside-24-hour messages at the standard templates
    await patch({ notifications: { staffWaIds: ids, templates: { orderUpdate: tp.orderUpdate || 'order_update', paymentReminder: tp.paymentReminder || 'payment_reminder', staffAlert: tp.staffAlert || 'staff_alert' } } });
    toast('Saved'); reload(true);
  });
  if ($('#esu')) embeddedSignupButton(s);
}

// ---------- knowledge base ----------
async function knowledge() {
  answersCard().catch(() => {});
  const k = await api(T('/knowledge'));
  const owner = S.role === 'owner';
  const badge = { pending: '⏳ waiting', indexing: '🔄 learning', ready: '✅ ready', error: '⚠️ error', to_delete: '🗑️ removing' };
  const kb = (n) => (n > 1048576 ? (n / 1048576).toFixed(1) + ' MB' : Math.max(1, Math.round(n / 1024)) + ' KB');
  const gaps = (await api(T('/unanswered')).catch(() => ({ items: [] }))).items;
  const rf = k.refresh || {}; const L = rf.last;
  const when = (iso) => { try { return new Date(iso).toLocaleString('en-GB', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' }); } catch { return ''; } };
  const gapsCard = gaps.length ? `<div class="card"><h2>❓ Questions your assistant couldn't answer (${gaps.length})</h2>
    <p class="mute">Real questions from customers where the assistant wasn't sure or passed the chat to your team. Type the answer once and it will use it from then on.</p>

      <label style="display:inline-flex;gap:6px;align-items:center;margin-left:10px;color:var(--ink)"><input type="checkbox" id="kauto" style="width:auto" ${rf.auto ? 'checked' : ''}> Re-read automatically every week</label></p>` : ''}</div>`;

      <p class="mute">Everything your AI chatbot should know: delivery & returns policies, FAQs, size guides, product manuals, opening hours… It is searched automatically for every customer question.</p>
      <p>${k.docs.length} / ${k.limit} documents · ${k.provider === 'direct' ? '✅ Searched in-app by your AI chatbot (direct mode)' : k.aiConnected ? (k.attached ? '✅ Connected to your AI chatbot' : '🔄 Will connect to your AI chatbot after the next sync') : '<span class="pill warn">AI not connected on the server – documents are saved and the built-in search answers simple questions</span>'}

      <div class="card"><h2>🌐 From your website</h2><label>Page addresses (one per line)</label><textarea id="kurls" placeholder="https://yourshop.co.uk/pages/faq\nhttps://yourshop.co.uk/policies/refund-policy"></textarea>
        <p><button class="btn" id="kurl">Import pages</button> <button class="btn ghost" id="kauto">Auto-import my site</button></p></div>
      <div class="card"><h2>📄 Upload files</h2><p class="mute">PDF, Word, Excel, PowerPoint, TXT, Markdown, CSV – up to 10 MB each.</p><input type="file" id="kfiles" multiple accept=".pdf,.doc,.docx,.txt,.md,.csv,.xls,.xlsx,.ppt,.pptx,.html,.htm"><p><button class="btn" id="kup">Upload</button></p></div>
      <div class="card"><h2>✍️ Write or paste</h2><label>Title</label><input id="ktitle" placeholder="Delivery & returns"><label>Text</label><textarea id="ktext" style="min-height:120px"></textarea><p><button class="btn" id="kadd">Add</button></p></div>

      <p class="mute">This shows what the built-in search finds. Your AI chatbot uses the full knowledge base – try it in <a href="#" id="ktest">Test bot</a>.</p></div>`;

  }));
  $('#app').querySelectorAll('[data-gapignore]').forEach((b) => (b.onclick = async () => { try { await api(T(`/unanswered/${b.dataset.gapignore}/ignore`), { method: 'POST' }); knowledge(); } catch (e) { toast(e.message); } }));
  if ($('#krefresh')) $('#krefresh').onclick = async () => {
    try { await api(T('/knowledge/refresh'), { method: 'POST' }); toast('Reading your website…'); } catch (e) { toast(e.message); }
    const poll = setInterval(async () => { try { const k2 = await api(T('/knowledge')); if (!k2.refresh?.running) { clearInterval(poll); if (S.tab === 'knowledge') knowledge(); } } catch { clearInterval(poll); } }, 4000);
    knowledge();

  if ($('#ksync')) $('#ksync').onclick = async () => { res('Syncing…'); const r = await api(T('/knowledge/sync'), { method: 'POST' }); res(r.ok ? `✅ Synced ${r.synced || 0}, removed ${r.deleted || 0}${r.failed ? `, ${r.failed} failed` : ''}` : '⚠️ ' + r.error); again(); };
  $('#kurl').onclick = async () => {
    const urls = $('#kurls').value.split(/\s+/).filter(Boolean); if (!urls.length) return toast('Enter at least one address');
    res('Importing…');
    try { const r = await api(T('/knowledge/url'), { method: 'POST', body: { urls } }); res(r.results.map((x) => `${x.ok ? '✅' : '⚠️'} ${x.url}${x.ok ? '' : ' – ' + x.error}`).join('\n')); again(); } catch (e) { res(e.message); }
  };
  $('#kauto').onclick = async () => {
    const url = prompt('Your website address', S.tenant.settings.business.website || ''); if (!url) return;
    res('Reading your website…');
    try { const r = await api(T('/onboarding/website'), { method: 'POST', body: { url } }); res(`✅ Imported ${r.imported.length} page(s): ${r.imported.map((x) => x.name).join(', ')}`); again(); } catch (e) { res(e.message); }
  };

    const files = [...$('#kfiles').files]; if (!files.length) return toast('Choose files');

      const b64 = await new Promise((ok, no) => { const r = new FileReader(); r.onload = () => ok(String(r.result).split(',')[1]); r.onerror = no; r.readAsDataURL(f); });
      try { await api(T('/knowledge/file'), { method: 'POST', body: { filename: f.name, mime: f.type, contentBase64: b64 } }); out.push(`✅ ${f.name}`); } catch (e) { out.push(`⚠️ ${f.name} – ${e.message}`); }
    }
    res(out.join('\n')); again();
  };
  $('#kadd').onclick = async () => { try { await api(T('/knowledge/text'), { method: 'POST', body: { name: $('#ktitle').value || 'Notes', text: $('#ktext').value } }); toast('Added'); again(); } catch (e) { res(e.message); } };
}

// ---------- Meta Embedded Signup ----------
async function embeddedSignupButton(s) {
  const el = $('#esu');
  if (!el) return;
  const cfg = await api('/meta/config').catch(() => ({}));
  if (!cfg.enabled) { el.innerHTML = s.whatsapp.phoneNumberId ? '' : '<span class="mute">Connect WhatsApp by entering your Meta details in Settings (one-click connect becomes available when the server has Meta Embedded Signup configured).</span>'; return; }
  const pending = s.whatsapp.wabaId && s.whatsapp.numberStatus && s.whatsapp.numberStatus !== 'active';
  el.innerHTML = `<button class="btn" id="esbtn">${s.whatsapp.phoneNumberId ? '🔄 Reconnect WhatsApp number' : '📱 Connect a new WhatsApp number'}</button>
    <button class="btn ghost" id="escoex" title="Keep using the WhatsApp Business app on your phone – messages sync both ways">📲 I use the WhatsApp Business app on my number</button>
    ${pending ? '<button class="btn ghost" id="esref">↻ Refresh number</button>' : ''} <span id="esmsg" class="mute">${pending ? 'Connected – waiting for a verified phone number.' : ''}</span>`;
  let session = {};
  window.addEventListener('message', (ev) => {
    if (!/facebook\.com$/.test(new URL(ev.origin).hostname)) return;
    try {
      const d = JSON.parse(ev.data);
      // v4: FINISH, FINISH_ONLY_WABA (no number yet), FINISH_WHATSAPP_BUSINESS_APP_ONBOARDING (coexistence)
      // keep any other account IDs Meta adds to the event (e.g. waac_id / cs_id during the account-model rollout)
      if (d.type === 'WA_EMBEDDED_SIGNUP' && /^FINISH/.test(d.event)) { const { phone_number_id, waba_id, business_id, ...rest } = d.data || {}; session = { phoneNumberId: phone_number_id || null, wabaId: waba_id, businessId: business_id || null, event: d.event, extraIds: Object.fromEntries(Object.entries(rest).filter(([k, v]) => /_id$/.test(k) && typeof v === 'string')) }; }
      if (d.type === 'WA_EMBEDDED_SIGNUP' && d.event === 'CANCEL') $('#esmsg').textContent = `Cancelled${d.data?.current_step ? ' at ' + d.data.current_step : ''}`;
    } catch {}
  });
  if ($('#esref')) $('#esref').onclick = async () => { const r = await api(T('/whatsapp/refresh-number'), { method: 'POST' }).catch((e) => ({ ok: false, error: e.message })); $('#esmsg').textContent = r.ok ? (r.message || `Connected ${r.displayPhoneNumber || ''} ✅`) : '⚠️ ' + r.error; if (r.numberStatus === 'active') overview(); };
  const loadSdk = () => new Promise((res) => {
    if (window.FB) return res();
    window.fbAsyncInit = () => { FB.init({ appId: cfg.appId, autoLogAppEvents: true, xfbml: false, version: cfg.graphVersion }); res(); };
    const sc = document.createElement('script'); sc.src = 'https://connect.facebook.net/en_US/sdk.js'; sc.async = true; sc.crossOrigin = 'anonymous'; document.head.appendChild(sc);
  });
  const launch = async (coexistence) => {
    await loadSdk();
    session = {};
    FB.login((resp) => {
      const code = resp.authResponse?.code;
      if (!code) return ($('#esmsg').textContent = 'Cancelled');
      $('#esmsg').textContent = 'Connecting…';
      setTimeout(async () => {
        if (!session.wabaId) return ($('#esmsg').textContent = '⚠️ Meta did not return the account details – please try again.');
        const r = await api(T('/whatsapp/embedded'), { method: 'POST', body: { code, ...session, coexistence } }).catch((e) => ({ ok: false, error: e.message }));
        if (!r.ok) return coexistence ? fallback(r.error) : ($('#esmsg').textContent = '⚠️ ' + r.error);
        if (r.numberStatus !== 'active') { $('#esmsg').textContent = r.message; return; }
        toast(`Connected ${r.displayPhoneNumber || ''} ✅`);
        overview();
      }, 1000); // the FINISH message can arrive just after the login callback
    }, { config_id: cfg.configId, response_type: 'code', override_default_response_type: true, extras: coexistence ? { setup: {}, featureType: 'whatsapp_business_app_onboarding' } : { setup: {} } });
  };
  const fallback = (why) => {
    $('#esmsg').innerHTML = `⚠️ ${esc(why)}<br>If Meta says your number can't be connected this way (new or low-quality Business app accounts often can't yet), use a new number with the full WhatsApp API instead. <button class="btn ghost" id="esnew">Use a new number with the full API</button>`;
    $('#esnew').onclick = () => launch(false);
  };
  window.addEventListener('message', (ev) => {
    try { if (!/facebook\.com$/.test(new URL(ev.origin).hostname)) return; const d = JSON.parse(ev.data); if (S.coexLaunch && d.type === 'WA_EMBEDDED_SIGNUP' && d.event === 'ERROR') fallback(d.data?.error_message || 'Meta could not connect your WhatsApp Business app number.'); } catch {}
  });
  $('#esbtn').onclick = () => { S.coexLaunch = false; launch(false); };
  $('#escoex').onclick = () => {
    const box = document.createElement('div');
    box.className = 'card'; box.id = 'coexinfo'; box.style.marginTop = '10px';
    box.innerHTML = `<h3>📲 Keep your number and your WhatsApp Business app</h3>
      <ul>
        <li>You keep your number and keep using the WhatsApp Business app on your phone. The AI replies alongside you and every chat shows in both places.</li>
        <li>When you reply from your phone, the AI goes quiet in that chat for 30 minutes (you can change this in Settings).</li>
        <li><b>Linked devices will be unlinked</b> when you connect. You can link them again afterwards.</li>
        <li><b>WhatsApp for Windows isn't supported</b> on a connected number. Use the phone app (or WhatsApp Web).</li>
        <li><b>No blue tick:</b> a number connected this way can't get Meta's verified badge, and can't be moved to another account later. Bigger brands should use a new number with the full API instead.</li>
        <li><b>Open the app at least once every 13 days</b>, or Meta disconnects it. We'll remind you on day 10.</li>
        <li>Messages you send from the app stay free. Messages the AI sends are charged by Meta at the normal rates.</li>
      </ul>
      <label style="display:flex;gap:8px;align-items:center"><input type="checkbox" id="coexok" style="width:auto"> I understand</label>
      <p><button class="btn" id="coexgo" disabled>Continue to Meta</button> <button class="btn ghost" id="coexnew">Use a new number instead</button></p>`;
    $('#coexinfo')?.remove();
    el.appendChild(box);
    $('#coexok').onchange = () => ($('#coexgo').disabled = !$('#coexok').checked);
    $('#coexgo').onclick = () => { box.remove(); S.coexLaunch = true; launch(true); };
    $('#coexnew').onclick = () => { box.remove(); S.coexLaunch = false; launch(false); };
  };
}

async function billingExtras(b, history) {
  const when = (s) => new Date(s).toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' });
  const em = await api(T('/email-log')).catch(() => null);
  const ent = await api(T('/entitlements')).catch(() => null);
  let html = '';
  if (ent) {
    const bar = (l) => { if (l.included == null) return `<b>${l.used ?? 0}</b> <span class="mute">(unlimited)</span>`; const pc = Math.min(100, Math.round(((l.used || 0) / Math.max(1, l.included)) * 100)); return `<b>${l.used ?? 0}</b> of ${l.included.toLocaleString()} <div style="height:6px;background:var(--line,#e3e8e5);border-radius:3px;margin-top:4px"><div style="height:6px;width:${pc}%;border-radius:3px;background:${pc >= 90 ? 'var(--warn,#c0392b)' : 'var(--accent,#128c4a)'}"></div></div>`; };
    html += `<div class="card"><h2>Your usage this month</h2><p class="mute">${esc(ent.label)} plan · counts reset on ${new Date(ent.resetsOn).toLocaleDateString('en-GB')}</p><div class="tablewrap"><table><tr><th>What</th><th>Used</th><th>If you go over</th></tr>${ent.limits.map((l) => `<tr><td>${esc(l.label)} <span class="mute" style="font-size:12px">${esc(l.unit)}</span></td><td style="min-width:150px">${bar(l)}</td><td class="mute" style="font-size:13px">${esc(l.overage)}</td></tr>`).join('')}</table></div>
      <p class="mute" style="margin-top:8px">Included: ${ent.features.whatsapp ? 'WhatsApp ✓' : 'WhatsApp ✗ (upgrade)'} · ${ent.features.campaigns ? 'Campaigns ✓' : 'Campaigns ✗'}${ent.features.poweredByBadge ? ' · "Powered by" link shown in your chat' : ''}</p>
      <p class="mute">${ent.external.map((x) => `<b>${esc(x.label)}:</b> ${esc(x.text)}`).join('<br>')}</p></div>`;
  }
  if (b.payment_failed_at) html += `<div class="card"><h2>⚠️ Payment problem</h2><p>Your last payment didn't go through. ${b.graceEndsAt && Date.parse(b.graceEndsAt) > Date.now() ? `Your assistant keeps working until <b>${when(b.graceEndsAt)}</b>.` : 'Your assistant is paused until the payment goes through.'} Use <b>Manage billing, invoices & card</b> to update your card.</p></div>`;
  if (history.length) html += `<div class="card"><h2>Billing history</h2><div class="tablewrap"><table><tr><th>Date</th><th>What happened</th></tr>${history.map((h) => `<tr><td>${when(h.at)}</td><td>${esc(h.note || h.type)}</td></tr>`).join('')}</table></div><p class="mute">Invoices and receipts are in "Manage billing". WhatsApp (Meta) message fees are billed to you by Meta, separately from this plan.</p></div>`;
  if (em) {
    const label = { sent: 'Sent', retrying: 'Retrying', failed: 'Not delivered', skipped: 'Not sent (email not set up)', queued: 'Sending' };
    html += `<div class="card"><h2>Emails sent for you</h2>${em.emails.length ? `<div class="tablewrap"><table><tr><th>Date</th><th>To</th><th>Subject</th><th>Status</th></tr>${em.emails.slice(0, 15).map((m) => `<tr><td>${when(m.created_at.replace(' ', 'T') + 'Z')}</td><td>${esc(m.to_addr)}</td><td>${esc(m.subject)}</td><td>${m.status === 'sent' ? 'Sent' : `<span class="pill warn">${esc(label[m.status] || m.status)}</span>`}${m.error && m.status !== 'sent' ? `<div class="mute" style="font-size:12px">${esc(m.error)}</div>` : ''}</td></tr>`).join('')}</table></div>` : '<p class="mute">No emails yet. Order, lead, quote and ticket emails will show here with their delivery status.</p>'}</div>`;
  }
  if (html) $('#app').insertAdjacentHTML('beforeend', html);
}

// ---------- super admin: system health (jobs, emails, backups, billing webhook) ----------
async function systemHealth() {
  const st = await api('/system/status');
  let box = document.getElementById('healthbox'); if (!box) { box = document.createElement('div'); box.className = 'card'; box.id = 'healthbox'; $('#app').prepend(box); }
  const bad = st.jobs.filter((j) => j.state === 'failing' || j.state === 'stale');
  const e = st.emails || {};
  const fl = (e.failed || 0) ? await api('/system/email-log?status=failed').catch(() => ({ emails: [] })) : { emails: [] };
  const when = (s) => (s ? new Date(s).toLocaleString('en-GB', { dateStyle: 'short', timeStyle: 'short' }) : '–');
  box.innerHTML = `<h2>🩺 System health</h2>
    <p>${bad.length ? `<span class="pill warn">${bad.length} background job${bad.length === 1 ? '' : 's'} need attention</span>` : '<span class="pill">Background jobs OK</span>'}
      ${st.integrity ? (st.integrity.ok ? ' <span class="pill">Database check OK</span>' : ' <span class="pill warn">Database check failed</span>') : ' <span class="pill">Database check runs daily</span>'}
      ${st.emailConfigured ? '' : ' <span class="pill warn">Email not set up</span>'}${st.alertsConfigured ? '' : ' <span class="pill warn">No alert webhook</span>'}
      ${st.offsiteBackup ? '' : ' <span class="pill warn">No off-server backup</span>'}</p>
    <p class="mute">Emails (7 days): ${e.sent || 0} sent · ${e.retrying || 0} retrying · ${e.failed || 0} failed · ${e.skipped || 0} not sent (email not set up). Last billing webhook: ${st.billingWebhook ? esc(st.billingWebhook.type) + ' at ' + when(st.billingWebhook.received_at.replace(' ', 'T') + 'Z') : 'none yet'}. Up ${Math.round(st.uptimeSec / 3600)} h · ${st.memoryMb} MB · ${st.deadLetters} stuck message(s).</p>
    ${bad.length ? `<div class="tablewrap"><table><tr><th>Job</th><th>State</th><th>Failures in a row</th><th>Last error</th><th>Last OK</th></tr>${bad.map((j) => `<tr><td>${esc(j.name)}</td><td>${esc(j.state)}</td><td>${j.failures}</td><td>${esc(j.lastError || '')}</td><td>${when(j.lastOk)}</td></tr>`).join('')}</table></div>` : ''}
    ${fl.emails.length ? `<h3>Emails not delivered</h3><div class="tablewrap"><table><tr><th>When</th><th>To</th><th>Subject</th><th>Error</th><th></th></tr>${fl.emails.slice(0, 20).map((m) => `<tr><td>${when(m.created_at.replace(' ', 'T') + 'Z')}</td><td>${esc(m.to_addr)}</td><td>${esc(m.subject)}</td><td>${esc(m.error || '')}</td><td><button class="btn ghost" data-eretry="${m.id}" style="width:auto">Retry</button></td></tr>`).join('')}</table></div>` : ''}`;
  box.querySelectorAll('[data-eretry]').forEach((b) => (b.onclick = async () => { try { const r = await api(`/system/email-log/${b.dataset.eretry}/retry`, { method: 'POST' }); toast(r.ok ? 'Sent' : r.retrying ? 'Still failing – will retry automatically' : r.error || 'Not sent'); systemHealth(); } catch (x) { toast(x.message); } }));
}

        ${opts.map((o, i) => { const a = WM_ACTIONS.find((x) => x[0] === o.action) || WM_ACTIONS[0]; return `<div class="card" style="margin:8px 0;padding:10px">
          <div style="display:flex;gap:6px;flex-wrap:wrap;align-items:center"><b>${i + 1}.</b>
            <input data-wl="${i}" value="${esc(o.label || '')}" placeholder="Option text (max 24)" maxlength="24" style="flex:1;min-width:150px">
            <select data-wa="${i}" style="width:auto">${WM_ACTIONS.map(([k, l]) => `<option value="${k}" ${k === (o.action || 'answer') ? 'selected' : ''}>${l}</option>`).join('')}</select>
            <button class="btn ghost" data-wu="${i}" title="Move up" ${i ? '' : 'disabled'}>↑</button><button class="btn ghost" data-wx="${i}" title="Remove">✕</button></div>
          ${a[2] ? (o.action === 'answer' ? `<textarea data-wv="${i}" placeholder="${esc(a[2])}" style="margin-top:6px">${esc(o.value || '')}</textarea>` : `<input data-wv="${i}" value="${esc(o.value || '')}" placeholder="${esc(a[2])}" style="margin-top:6px">`) : ''}
          ${(o.label || '').length > 20 && opts.length <= 3 ? '<div class="mute" style="font-size:12px">With 3 or fewer options WhatsApp shows only the first 20 characters.</div>' : ''}</div>`; }).join('')}
        <p>${opts.length < 10 ? '<button class="btn ghost" id="wmadd">+ Add option</button>' : '<span class="mute">10 options is the most WhatsApp allows.</span>'}
          ${opts.length ? '' : ' <button class="btn ghost" id="wmsug">Start from suggestions</button>'}</p>
        <p><button class="btn" id="wmsave">Save menu</button> <button class="btn ghost" id="wmai" title="The AI writes the menu, the pop-up greeting and the lead question from your website">✨ Write it for me with AI</button> <span id="wmres" class="mute"></span></p>${s.autoSetup?.at ? `<p class="mute" style="font-size:13px">Set up by AI on ${esc(new Date(s.autoSetup.at).toLocaleDateString('en-GB'))}${s.autoSetup.applied?.length ? ': ' + esc(s.autoSetup.applied.join(', ')) : ''}. Change anything – the AI won't overwrite your edits unless you press the button again.</p>` : ''}</div>
      <div style="flex:1;min-width:240px"><label>Preview</label><div style="background:#efeae2;border-radius:12px;padding:12px;max-width:300px">
        <div style="background:#fff;border-radius:8px;padding:8px 10px;color:#111;white-space:pre-wrap">${esc(W.intro || 'How can we help?')}</div>
        ${preview.map((o) => `<div style="background:#fff;border-radius:8px;padding:8px;margin-top:4px;text-align:center;color:#0b6b38">${esc(String(o.label).slice(0, preview.length <= 3 ? 20 : 24))}</div>`).join('') || '<div class="mute" style="margin-top:6px">Add options to see them here.</div>'}</div></div></div></div>`;
    const sync = () => {
      W.enabled = $('#wmon').checked; W.intro = $('#wmintro').value;
      box.querySelectorAll('[data-wl]').forEach((el) => (W.options[el.dataset.wl].label = el.value));
      box.querySelectorAll('[data-wv]').forEach((el) => (W.options[el.dataset.wv].value = el.value));
    };
    box.querySelectorAll('[data-wa]').forEach((el) => (el.onchange = () => { sync(); W.options[el.dataset.wa].action = el.value; draw(); }));
    box.querySelectorAll('[data-wx]').forEach((el) => (el.onclick = () => { sync(); W.options.splice(Number(el.dataset.wx), 1); draw(); }));
    box.querySelectorAll('[data-wu]').forEach((el) => (el.onclick = () => { sync(); const i = Number(el.dataset.wu); [W.options[i - 1], W.options[i]] = [W.options[i], W.options[i - 1]]; draw(); }));
    box.querySelectorAll('[data-wl],#wmintro').forEach((el) => (el.onchange = () => { sync(); draw(); }));
    if ($('#wmadd')) $('#wmadd').onclick = () => { sync(); W.options.push({ label: '', action: 'answer', value: '' }); draw(); };
    const qparse = (t) => t.split('\n').map((l) => l.split('=')).filter((p) => p.length >= 2 && p[0].trim()).map((p) => ({ q: p[0].trim(), options: p.slice(1).join('=').split('|').map((o) => o.trim()).filter(Boolean) }));
    $('#qzsave').onclick = async () => { try { S.tenant = (await api(T('/settings'), { method: 'PATCH', body: { quiz: { enabled: $('#qzon').checked, questions: qparse($('#qztxt').value) } } })).tenant; toast('Quiz saved'); } catch (e) { toast(e.message); } };
    $('#qzai').onclick = async () => { $('#qzres').textContent = '✨ Writing…'; try { const r = await api(T('/quiz/draft'), { method: 'POST' }); $('#qztxt').value = r.questions.map((x) => `${x.q} = ${x.options.join(' | ')}`).join('\n'); $('#qzon').checked = true; $('#qzres').textContent = 'Check it, then press Save quiz'; } catch (e) { $('#qzres').textContent = e.message; } };
    $('#qzmenu').onclick = () => { if (W.options.some((o) => o.action === 'quiz')) return toast('Already on the menu'); W.enabled = true; W.options.splice(0, 0, { label: '🧭 Help me choose', action: 'quiz' }); draw(); toast('Added – press Save menu'); };
    api(T('/menu-suggestions')).then(({ suggestions }) => {
      const b = $('#wmsug2'); if (!b || !suggestions.length) return;
      b.innerHTML = `<div style="background:#fff7d6;color:#3b3216;border-radius:10px;padding:10px 12px;margin:8px 0"><b>💡 Your customers often ask:</b>${suggestions.map((x, i) => `<div style="display:flex;gap:8px;align-items:center;margin-top:6px"><span style="flex:1">“${esc(x.question)}” <span class="mute">(${x.asked}×)</span></span><button class="btn ghost" data-sadd="${i}" style="padding:3px 8px">+ Add “${esc(x.label)}”</button><button class="btn ghost" data-sx="${esc(x.key)}" style="padding:3px 8px" title="Not useful">✕</button></div>`).join('')}</div>`;
      b.querySelectorAll('[data-sadd]').forEach((el) => (el.onclick = () => { const x = suggestions[el.dataset.sadd]; W.enabled = true; W.options.splice(Math.max(0, W.options.length - (W.options.at(-1)?.action === 'human' ? 1 : 0)), 0, { label: x.label, action: 'ask', value: x.question }); draw(); toast('Added – press Save menu'); }));
      b.querySelectorAll('[data-sx]').forEach((el) => (el.onclick = async () => { await api(T('/menu-suggestions/dismiss'), { method: 'POST', body: { key: el.dataset.sx } }); el.parentElement.remove(); }));
    }).catch(() => {});
    api('/trades').then(({ trades }) => {
      const g = $('#trgrid'); if (!g) return;
      g.innerHTML = trades.map((t) => `<button class="btn ${s.trade === t.key ? '' : 'ghost'}" data-trade="${t.key}" style="text-align:left;white-space:normal;height:auto;padding:10px"><b>${t.emoji} ${esc(t.label)}</b>${s.trade === t.key ? ' ✓' : ''}<div style="font-size:12px;opacity:.8;font-weight:400">${esc(t.blurb)}</div></button>`).join('');
      g.querySelectorAll('[data-trade]').forEach((b) => (b.onclick = async () => {
        const force = (W.options || []).length ? confirm('Also replace your welcome menu, pop-up greeting and lead question with this template? (Cancel keeps them and only adds the AI rules and questions.)') : false;
        try { const r = await api(T('/trade'), { method: 'POST', body: { trade: b.dataset.trade, force } }); S.tenant = r.tenant; toast(`${r.label}: ${r.applied.join(', ')}`); settings(); } catch (e) { $('#trres').textContent = e.message; }
      }));
    }).catch(() => {});
    if ($('#wmsug')) $('#wmsug').onclick = () => { sync(); W.options = wmSuggestions(s); if (!W.intro) W.intro = 'Hi! What can we help you with today?'; draw(); };
    $('#wmai').onclick = async () => {
      if ((W.options || []).length && !confirm('Replace your welcome menu, pop-up greeting and lead question with new AI suggestions from your website?')) return;
      $('#wmres').textContent = '✨ Reading your website and writing it… (about 10 seconds)';
      try {
        const r = await api(T('/auto-setup'), { method: 'POST', body: { force: true } });
        if (!r.applied?.length) { $('#wmres').textContent = `Couldn't do it: ${r.reason || 'no answer from the AI'}. Add your website on the Knowledge tab first.`; return; }
        S.tenant = r.tenant; toast(`Done: ${r.applied.join(', ')}`); settings();
      } catch (e) { $('#wmres').textContent = e.message; }
    };
    $('#wmsave').onclick = async () => {
      sync();
      const bad = W.options.find((o) => !o.label.trim() || (o.action === 'answer' && !String(o.value || '').trim()) || (o.action === 'link' && !/^https?:\/\/\S+$/.test(String(o.value || '').trim())));
      if (bad) { $('#wmres').textContent = `⚠️ Option "${bad.label || 'without text'}" needs ${!bad.label.trim() ? 'its text' : bad.action === 'link' ? 'a web address starting https://' : 'an answer'}.`; return; }
      try {
        S.tenant = (await api(T('/settings?sync=0'), { method: 'PATCH', body: { welcomeMenu: { enabled: W.enabled, intro: W.intro, options: W.options.map((o) => ({ label: o.label.trim(), action: o.action, value: String(o.value || '').trim() })) } } })).tenant;
        toast(W.enabled ? 'Menu saved – say "hi" in Test bot to see it' : 'Saved (your menu is switched off)');
        $('#wmres').textContent = '';
      } catch (e) { $('#wmres').textContent = e.message; }
    };
  };
  draw();
}

// ---------- analytics ----------
async function analytics(days = Number(store.get('wc_days')) || 30) {
  const a = await api(T(`/analytics?days=${days}`));
  setTimeout(() => resultsCard().catch(() => {}), 0);
  const sym = S.tenant.settings.business.currencySymbol || '£';
  const m = (n) => sym + Number(n || 0).toFixed(2);
  // fill every day so gaps show as zero
  const series = [];
  const byDay = Object.fromEntries(a.byDay.map((d) => [d.day, d]));
  for (let i = days - 1; i >= 0; i--) { const d = new Date(Date.now() - i * 864e5).toISOString().slice(0, 10); series.push(byDay[d] || { day: d, orders: 0, revenue: 0 }); }
  const max = Math.max(1, ...series.map((d) => d.revenue));
  const fmtDay = (d) => new Date(d + 'T12:00:00Z').toLocaleDateString('en-GB', { day: 'numeric', month: 'short' });
  const vm = store.get('wc_vmonth') || 'this';
  const now = new Date(); const ym = (d) => d.toISOString().slice(0, 7);
  const month = vm === 'week' ? 'week' : vm === 'last' ? ym(new Date(Date.UTC(now.getUTCFullYear(), now.getUTCMonth() - 1, 1))) : ym(now);
  const v = (await api(T(`/value-report?month=${month}`)).catch(() => ({}))).report;
  const M0 = (n) => sym + Number(n || 0).toLocaleString('en-GB', { maximumFractionDigits: 0 });
  const valueCard = v ? `<div class="card"><div style="display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;align-items:center"><h2 style="margin:0">💷 What your assistant did for you</h2>
      <div>${[['week', 'Last 7 days'], ['this', 'This month'], ['last', 'Last month']].map(([k, l]) => `<button class="btn ${k === vm ? '' : 'ghost'}" data-vm="${k}">${l}</button>`).join(' ')}</div></div>
    ${v.roi ? `<p style="font-size:1.15em;margin:12px 0">About <b>${v.roi}×</b> what your ${esc(v.plan.label)} plan costs (£${v.plan.priceGbp}/month)${v.partial ? ' so far this month' : ''}.</p>` : ''}
    <div class="row">
      <div><div class="mute">Conversations</div><div class="stat">${v.chats}</div><div class="mute">${v.whatsappChats} WhatsApp · ${v.webChats} website</div></div>
      <div><div class="mute">Handled without your team</div><div class="stat">${v.handledByBot}</div><div class="mute">${v.botReplies} replies written for you</div></div>
      <div><div class="mute">Helped out of hours</div><div class="stat">${v.afterHoursChats}</div><div class="mute">${esc(v.assumptions.hours)}</div></div>
      <div><div class="mute">Staff time saved</div><div class="stat">${v.hoursSaved} h</div><div class="mute">≈ ${M0(v.staffValue)}</div></div>
      <div><div class="mute">Leads</div><div class="stat">${v.leads?.count || 0}</div><div class="mute">${v.leads?.callbacks || 0} call-back requests</div></div>
      <div><div class="mute">Bookings</div><div class="stat">${v.bookings || 0}</div><div class="mute">made in the chat</div></div>
      <div><div class="mute">Orders in chat</div><div class="stat">${v.orders.count}</div><div class="mute">${M0(v.orders.value)}</div></div>
      ${v.ticketsSolved ? `<div><div class="mute">Tickets solved</div><div class="stat">${v.ticketsSolved}</div></div>` : ''}
      ${v.ratings && v.ratings.great + v.ratings.ok + v.ratings.bad ? `<div><div class="mute">Chat ratings</div><div class="stat">😀 ${v.ratings.great}</div><div class="mute">😐 ${v.ratings.ok} · 😞 ${v.ratings.bad}</div></div>` : ''}
      ${v.websiteSales ? `<div><div class="mute">Website sales from the chat</div><div class="stat">${M0(v.websiteSales.value)}</div><div class="mute">${v.websiteSales.orders} orders (Shopify)</div></div>` : ''}
      ${v.links?.linksSent ? `<div><div class="mute">Shop links opened</div><div class="stat">${v.links.linksClicked}</div><div class="mute">${v.links.checkoutsStarted} checkouts started</div></div>` : ''}
      <div><div class="mute">Recovered sales</div><div class="stat">${M0(v.recovered)}</div><div class="mute">${v.recoveredCarts.count + v.recoveredCheckouts.count} carts · ${v.paidAfterReminder.count} chased payments</div></div></div>
    ${v.unanswered ? `<p class="mute">❓ ${v.unanswered} question${v.unanswered > 1 ? 's' : ''} it couldn't answer – add the answers on the <a href="#" data-goto="knowledge">Knowledge base</a> tab.</p>` : ''}
    <p class="mute" style="font-size:12px">Staff time counts ${v.assumptions.minutesPerReply} min per reply at ${sym}${v.assumptions.hourlyRate}/hour (change in Settings → Monthly report). This report is emailed to you on the 1st of each month.</p></div>` : '';
  const ads = (await api(T(`/ad-report?days=${days}`)).catch(() => ({ sources: [] }))).sources;
  const adCard = ads.length ? `<div class="card"><h2>📣 Where your chats came from (last ${days} days)</h2><p class="mute">Click-to-WhatsApp ads, Google and Facebook ad clicks and campaign links (utm tags), and what each turned into.</p>
    <div class="tablewrap"><table><tr><th>Source</th><th>Chats</th><th>Leads</th><th>Bookings</th><th>Orders</th><th>Revenue</th></tr>${ads.map((g) => `<tr><td>${g.kind === 'ad' ? '📣 ' : g.kind === 'campaign' ? '🔗 ' : ''}${esc(g.label)}</td><td>${g.chats}</td><td>${g.leads}</td><td>${g.bookings}</td><td>${g.orders}</td><td>${M0(g.revenue)}</td></tr>`).join('')}</table></div>
    <p class="mute" style="font-size:12px">Tip: add <code>?utm_source=facebook&amp;utm_campaign=spring-offer</code> to the links in your ads and posts to see each campaign here.</p></div>` : '';
  $('#app').innerHTML = '<div id="resultsbox"></div>' + valueCard + adCard + `<div class="card" style="display:flex;gap:8px;align-items:center;flex-wrap:wrap"><b>Period</b>${[7, 30, 90].map((d) => `<button class="btn ${d === days ? '' : 'ghost'}" data-days="${d}">Last ${d} days</button>`).join('')}</div>
    <div class="row">
      <div class="card"><div class="mute">Revenue (after discounts)</div><div class="stat">${m(a.revenue)}</div><div class="mute">${m(a.paid_revenue)} paid</div></div>
      <div class="card"><div class="mute">Orders</div><div class="stat">${a.orders}</div><div class="mute">avg ${m(a.aov)}</div></div>
      <div class="card"><div class="mute">Chats → buyers</div><div class="stat">${a.conversion}%</div><div class="mute">${a.buyers} of ${a.chats} chatting customers</div></div>
      <div class="card"><div class="mute">Customers</div><div class="stat">${a.newCustomers}</div><div class="mute">new · ${a.repeatCustomers} repeat buyers</div></div></div>
    <div class="card"><h2>Revenue per day</h2>
      <div class="bars" role="img" aria-label="Revenue per day bar chart">${series.map((d) => `<div class="bw"><div class="bar" style="height:${(d.revenue / max) * 100}%"></div><div class="tip">${fmtDay(d.day)} · ${m(d.revenue)} · ${d.orders} order${d.orders === 1 ? '' : 's'}</div></div>`).join('')}</div>
      <div class="axis"><span>${fmtDay(series[0].day)}</span><span>max ${m(max)}</span><span>${fmtDay(series.at(-1).day)}</span></div>
      <details style="margin-top:8px"><summary class="mute">Show as table</summary><div class="tablewrap"><table><tr><th>Day</th><th>Orders</th><th>Revenue</th></tr>${series.filter((d) => d.orders).map((d) => `<tr><td>${fmtDay(d.day)}</td><td>${d.orders}</td><td>${m(d.revenue)}</td></tr>`).join('') || '<tr><td colspan="3" class="mute">No orders</td></tr>'}</table></div></details></div>
    <div class="row"><div class="card"><h2>Top products</h2><table><tr><th>Product</th><th>Qty</th><th>Sales (before discounts)</th></tr>${a.topProducts.map((p) => `<tr><td>${esc(p.title)}</td><td>${p.quantity}</td><td>${m(p.revenue)}</td></tr>`).join('') || '<tr><td colspan="3" class="mute">No sales yet</td></tr>'}</table></div>
      <div class="card"><h2>Promo codes</h2><table><tr><th>Code</th><th>Orders</th><th>Discount given</th></tr>${a.promos.map((p) => `<tr><td>${esc(p.code)}</td><td>${p.orders}</td><td>${m(p.discount)}</td></tr>`).join('') || '<tr><td colspan="3" class="mute">No promo orders</td></tr>'}</table></div></div>`;
  $('#app').querySelectorAll('[data-days]').forEach((b) => (b.onclick = () => { store.set('wc_days', b.dataset.days); analytics(Number(b.dataset.days)); }));
  $('#app').querySelectorAll('[data-vm]').forEach((b) => (b.onclick = () => { store.set('wc_vmonth', b.dataset.vm); analytics(days); }));
  $('#app').querySelectorAll('[data-goto]').forEach((a) => (a.onclick = (e) => { e.preventDefault(); S.tab = a.dataset.goto; store.set('wc_tab', S.tab); render(); }));
}

// ---------- team ----------
async function team() {
  const { staff } = await api(T('/staff'));
  $('#app').innerHTML = `<div class="card"><h2>Team logins</h2><p class="mute"><b>Staff</b> can see orders, inbox, analytics and the test bot. <b>Owner</b> can also change settings, AI, broadcasts and the team. Each person signs in with the tenant ID <code>${esc(S.tenantId)}</code> and their own key.</p>
    <div class="row"><div><label>Name</label><input id="sn"></div><div><label>Role</label><select id="sr"><option value="staff">Staff</option><option value="owner">Owner</option></select></div><div style="align-self:end"><button class="btn" id="sa">Add team member</button></div></div><div id="skey"></div></div>
    <div class="card"><h2>Activity log</h2><div class="tablewrap" style="max-height:320px;overflow:auto"><table id="audit"><tr><td class="mute">Loading…</td></tr></table></div></div>
    <div class="card"><table><tr><th>Name</th><th>Role</th><th>Added</th><th></th></tr>${staff.map((m) => `<tr><td>${esc(m.name)}</td><td>${esc(m.role)}</td><td>${esc(m.created_at)}</td><td><button class="btn ghost" data-del="${m.id}">Remove</button></td></tr>`).join('') || '<tr><td colspan="4" class="mute">No team members yet</td></tr>'}</table></div>`;
  api(T('/audit')).then((r) => { $('#audit').innerHTML = '<tr><th>When (UTC)</th><th>Who</th><th>Action</th><th>Result</th></tr>' + r.audit.map((x) => `<tr><td class="mute">${esc(x.created_at)}</td><td>${esc(x.actor)}</td><td><code>${esc(x.action)}</code></td><td>${esc(x.status)}</td></tr>`).join(''); }).catch(() => {});
  $('#sa').onclick = async () => {
    try { const r = await api(T('/staff'), { method: 'POST', body: { name: $('#sn').value, role: $('#sr').value } }); await team(); $('#skey').innerHTML = `<p>✅ Key for ${esc($('#sn').value || 'member')} (shown once): <code>${esc(r.key)}</code></p>`; } catch (e) { toast(e.message); }
  };
  $('#app').querySelectorAll('[data-del]').forEach((b) => (b.onclick = async () => { if (confirm('Remove this team member?')) { await api(T('/staff/' + b.dataset.del), { method: 'DELETE' }); team(); } }));
}

// ---------- broadcast ----------
async function broadcast() {
  const { customers } = await api(T('/customers'));
  const opted = customers.filter((c) => c.opted_in_marketing).length;
  $('#app').innerHTML = `<div class="card"><h2>Broadcast offer</h2><p class="mute">WhatsApp only allows marketing via <b>approved templates</b> (create them in Meta Business Manager → WhatsApp Manager → Message templates). Sends to the ${opted} customers who opted in.</p>
    <div class="row"><div><label>Template name</label><input id="bt" placeholder="weekend_offer"></div><div><label>Language code</label><input id="bl" value="en_GB"></div></div>
    <label>Body variables (comma separated, optional)</label><input id="bv" placeholder="20%, SALE20">
    <p><button class="btn" id="bs">Send broadcast</button></p><pre id="br" class="mute"></pre></div>
    <div class="card"><h2>Customers (${customers.length})</h2><div class="tablewrap"><table><tr><th>Name</th><th>WhatsApp</th><th>Offers</th><th>Last seen</th></tr>${customers.slice(0, 200).map((c) => `<tr><td>${esc(c.name || '')}</td><td>+${esc(c.wa_id)}</td><td>${c.opted_in_marketing ? '✅' : '—'}</td><td>${esc(c.last_seen_at || '')}</td></tr>`).join('')}</table></div></div>`;
  $('#bs').onclick = async () => {
    const vars = $('#bv').value.split(',').map((x) => x.trim()).filter(Boolean);
    const components = vars.length ? [{ type: 'body', parameters: vars.map((text) => ({ type: 'text', text })) }] : undefined;
    if (!confirm(`Send template "${$('#bt').value}" to ${opted} customers?`)) return;
    try { $('#br').textContent = JSON.stringify(await api(T('/broadcasts'), { method: 'POST', body: { template: $('#bt').value, language: $('#bl').value, components } }), null, 2); } catch (e) { $('#br').textContent = e.message; }
  };
}

S.key ? boot().catch(loginView) : loginView();
</script>
</body>
</html>
