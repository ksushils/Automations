<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WhatsApp Commerce</title>
<style>
:root{--bg:#f5f7f6;--card:#fff;--ink:#17201b;--mute:#5d6b63;--line:#dfe5e1;--brand:#128c4a;--bar:#128c4a;--brand2:#0b6b38;--warn:#b5470b;--bubble-in:#fff;--bubble-out:#d9fdd3;--chat:#efeae2}
@media (prefers-color-scheme:dark){:root{--bg:#0f1512;--card:#17201b;--ink:#e7efe9;--mute:#9aaba1;--line:#2a362f;--brand:#25d366;--bar:#17a050;--brand2:#1fb457;--bubble-in:#202c33;--bubble-out:#005c4b;--chat:#0b141a}}
*{box-sizing:border-box}body{margin:0;font:14px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--ink)}
header{display:flex;align-items:center;gap:12px;padding:12px 16px;background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:2;flex-wrap:wrap}
header h1{font-size:16px;margin:0;flex:1}nav{display:flex;gap:2px;flex-wrap:nowrap;overflow-x:auto;order:3;flex-basis:100%;scrollbar-width:thin;padding-bottom:2px}nav button{white-space:nowrap}
nav button{background:none;border:0;padding:6px 10px;border-radius:8px;color:var(--mute);cursor:pointer;font:inherit}nav button.on{background:var(--brand);color:#fff}
main{max-width:1100px;margin:0 auto;padding:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:16px}
h2{font-size:15px;margin:0 0 12px}h3{font-size:13px;margin:16px 0 8px;color:var(--mute);text-transform:uppercase;letter-spacing:.04em}
label{display:block;font-size:12px;color:var(--mute);margin:8px 0 2px}
input,select,textarea{width:100%;padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit}
textarea{min-height:70px}
.btn{background:var(--brand);color:#fff;border:0;border-radius:8px;padding:8px 14px;cursor:pointer;font:inherit}.btn:hover{background:var(--brand2)}
.btn.ghost{background:none;color:var(--brand);border:1px solid var(--line)}
.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:8px;border-bottom:1px solid var(--line);vertical-align:top}th{font-size:12px;color:var(--mute)}
.tablewrap{overflow-x:auto}
.pill{display:inline-block;padding:2px 8px;border-radius:99px;font-size:12px;background:var(--bg);border:1px solid var(--line)}
.pill.warn{color:var(--warn);border-color:var(--warn)}
.stat{font-size:22px;font-weight:600}.mute{color:var(--mute)}
code{background:var(--bg);padding:2px 6px;border-radius:6px;word-break:break-all}
.chat{background:var(--chat);border-radius:12px;padding:12px;height:440px;overflow-y:auto;display:flex;flex-direction:column;gap:6px}
.b{max-width:80%;padding:8px 10px;border-radius:10px;white-space:pre-wrap;word-wrap:break-word}.b.in{background:var(--bubble-out);align-self:flex-end}.b.out{background:var(--bubble-in);align-self:flex-start}
.b img{max-width:100%;border-radius:8px;display:block;margin-bottom:6px}
.acts{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}.acts button{background:var(--card);color:var(--brand);border:1px solid var(--line);border-radius:8px;padding:4px 8px;cursor:pointer;font:inherit;font-size:13px}
.split{display:grid;grid-template-columns:280px 1fr;gap:12px}@media (max-width:760px){.split{grid-template-columns:1fr}}
.list-item{padding:8px;border-radius:8px;cursor:pointer;border:1px solid transparent}.list-item:hover,.list-item.on{border-color:var(--line);background:var(--bg)}
#toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:8px;display:none;z-index:9}
.hidden{display:none}
.bars{display:flex;align-items:flex-end;gap:2px;height:180px;border-bottom:1px solid var(--line);position:relative}
.bars .bw{flex:1;height:100%;display:flex;align-items:flex-end;position:relative;cursor:default}
.bars .bar{width:100%;background:var(--bar);border-radius:4px 4px 0 0;min-height:2px}
.bars .bw:hover .bar{filter:brightness(1.15)}
.bars .tip{display:none;position:absolute;bottom:calc(100% + 4px);left:50%;transform:translateX(-50%);background:var(--card);border:1px solid var(--line);color:var(--ink);padding:4px 8px;border-radius:6px;font-size:12px;white-space:nowrap;z-index:3;box-shadow:0 2px 8px rgba(0,0,0,.12)}
.bars .bw:hover .tip{display:block}
/* flow builder */
.fb{display:flex;flex-direction:column;height:calc(100vh - 110px);min-height:520px;background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.fb-top{display:flex;gap:8px;align-items:center;padding:8px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.fb-name{flex:1;min-width:160px;font-weight:600}.fb-active{display:flex;gap:4px;align-items:center;margin:0;color:var(--ink);font-size:13px}.fb-active input{width:auto}
.fb-body{flex:1;display:grid;grid-template-columns:170px 1fr 300px;min-height:0}
.fb-palette{border-right:1px solid var(--line);padding:8px;overflow:auto;display:flex;flex-direction:column;gap:6px}
.fb-h{font-size:11px;letter-spacing:.08em;color:var(--mute);margin:4px}
.fb-tool{display:flex;gap:8px;align-items:center;text-align:left;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px;cursor:grab;color:var(--ink);font:inherit;font-size:13px}.fb-tool:hover{border-color:var(--brand)}
.fb-canvas-wrap{overflow:auto;position:relative;background-color:var(--bg);background-image:radial-gradient(var(--line) 1px,transparent 1px);background-size:18px 18px}
.fb-canvas{position:relative;min-width:100%;min-height:100%}
.fb-edges{position:absolute;inset:0;pointer-events:none;overflow:visible}
.fb-edge{fill:none;stroke:var(--brand);stroke-width:2;stroke-dasharray:6 5}.fb-edge.temp{stroke:var(--mute)}.fb-edge-dot{fill:var(--brand)}
.fb-node{position:absolute;width:240px;background:var(--card);border:1px solid var(--line);border-radius:10px;box-shadow:0 2px 6px rgba(0,0,0,.06);font-size:13px;user-select:none}
.fb-node.sel{border-color:var(--brand);box-shadow:0 0 0 2px color-mix(in srgb,var(--brand) 35%,transparent)}
.fb-node-h{display:flex;justify-content:space-between;align-items:center;padding:8px 10px;border-left:4px solid;border-radius:10px 10px 0 0;font-weight:600;cursor:move;background:var(--bg)}
.fb-x{background:none;border:0;color:var(--mute);cursor:pointer;font:inherit}
.fb-node-b{padding:8px 10px;max-height:96px;overflow:hidden;color:var(--ink)}
.fb-out{display:flex;justify-content:space-between;align-items:center;padding:5px 10px;border-top:1px solid var(--line);font-size:12px;color:var(--mute);position:relative}
.fb-port{width:14px;height:14px;border-radius:50%;background:var(--card);border:2px solid var(--brand);cursor:crosshair;margin-right:-17px;touch-action:none}
.fb-port:hover{background:var(--brand)}
.fb-in{position:absolute;left:-7px;top:16px;width:12px;height:12px;border-radius:50%;background:var(--brand)}
.fb-start .fb-in{display:none}
.fb-chip{display:inline-block;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:1px 6px;margin:2px}
.fb-inspector{border-left:1px solid var(--line);padding:10px;overflow:auto}.fb-inspector h3{margin:0 0 8px;text-transform:none;letter-spacing:0;color:var(--ink);font-size:14px}
.fb-rowedit{display:flex;gap:4px;margin-bottom:4px}
@media (max-width:900px){.fb-body{grid-template-columns:1fr}.fb-palette{flex-direction:row;flex-wrap:wrap;border-right:0;border-bottom:1px solid var(--line)}.fb-canvas-wrap{min-height:420px}.fb-inspector{border-left:0;border-top:1px solid var(--line)}}
.axis{display:flex;justify-content:space-between;font-size:12px;color:var(--mute);margin-top:4px}
</style>
<script src="flow-builder.js"></script>
</head>
<body>
<header>
  <h1>💬 WhatsApp Commerce <span class="mute" id="who"></span></h1>
  <nav id="nav"></nav>
  <button class="btn ghost" id="logout" style="display:none">Sign out</button>
</header>
<div id="banner"></div>
<main id="app"></main>
<div id="toast"></div>
<script>
const $ = (s, el = document) => el.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const store = { get: (k) => { try { return localStorage.getItem(k); } catch { return null; } }, set: (k, v) => { try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch {} } };
let S = { key: store.get('wc_key'), tenantId: store.get('wc_tenant'), super: false, tenant: null, tab: store.get('wc_tab') || 'overview' };
const toast = (m) => { const t = $('#toast'); t.textContent = m; t.style.display = 'block'; clearTimeout(t._h); t._h = setTimeout(() => (t.style.display = 'none'), 3000); };

async function api(path, opts = {}) {
  const res = await fetch('/api' + path, { ...opts, headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + S.key }, body: opts.body ? JSON.stringify(opts.body) : undefined });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || res.statusText);
  return data;
}
const T = (p) => `/tenants/${encodeURIComponent(S.tenantId)}${p}`;

// ---------- login ----------
function loginView() {
  $('#nav').innerHTML = ''; $('#logout').style.display = 'none'; $('#who').textContent = '';
  $('#app').innerHTML = `<div class="card" style="max-width:420px;margin:40px auto"><h2>Sign in</h2>
    <p class="mute">Paste your key. That's all you need: the admin key you were given, your shop key (starts with <code>adm_</code>) or a team key (<code>stf_</code>).</p>
    <label>Your key</label><input id="lk" type="password" autocomplete="current-password" autofocus>
    <p><button class="btn" id="lb">Sign in</button></p><p class="mute" id="lerr"></p>
    <p class="mute">No shop yet? <a href="/signup">Start a free trial</a></p></div>`;
  const go = async () => {
    S.key = $('#lk').value.trim(); S.tenantId = null; S.tenant = null; S.tab = null; S.setupStep = null;
    if (!S.key) return;
    try { await boot(); store.set('wc_key', S.key); store.set('wc_tenant', S.tenantId); } catch (e) { $('#lerr').textContent = '⚠️ ' + e.message; }
  };
  $('#lb').onclick = go; $('#lk').onkeydown = (e) => e.key === 'Enter' && go();
}

async function boot() {
  const who = await api('/whoami');
  S.super = who.super;
  if (!S.super) S.tenantId = who.tenantId || null;
  if (!S.tenantId && !S.super) throw new Error("That key wasn't recognised. Check you copied all of it.");
  if (S.super) { try { S.setup = await api('/system/setup'); } catch { S.setup = null; } }
  if (S.tenantId) { const r = await api(T('')); S.tenant = r.tenant; S.role = r.role; S.banner = r.banner; }
  $('#logout').style.display = '';
  render();
}
$('#logout').onclick = () => { store.set('wc_key', null); store.set('wc_tenant', null); store.set('wc_tab', null); S.key = null; S.tenant = null; S.tenantId = null; S.setup = null; loginView(); };

const TABS = [['overview', 'Overview'], ['analytics', 'Analytics'], ['inbox', 'Inbox'], ['orders', 'Orders'], ['contacts', 'Contacts'], ['automations', 'Automations'], ['campaigns', 'Campaigns'], ['templates', 'Templates'], ['grow', 'Grow'], ['knowledge', 'Knowledge base'], ['ai', 'AI assistant'], ['simulator', 'Test bot'], ['catalogue', 'Catalogue'], ['settings', 'Settings'], ['team', 'Team'], ['billing', 'Billing']];
const STAFF_TABS = new Set(['overview', 'analytics', 'simulator', 'inbox', 'orders', 'contacts']);
const MAIN_TABS = new Set(['overview', 'inbox', 'orders', 'simulator', 'ai', 'settings']);
function render() {
  const shopTabs = S.tenant ? TABS.filter(([k]) => S.role === 'owner' || STAFF_TABS.has(k)) : [];
  const showAll = store.get('wc_alltabs') === '1' || !MAIN_TABS.has(S.tab) && shopTabs.some(([k]) => k === S.tab);
  const setupLabel = S.setup ? `Setup ${S.setup.done === S.setup.total ? '✅' : `(${S.setup.done}/${S.setup.total})`}` : 'Setup';
  const superTabs = S.setup && S.setup.done === S.setup.total ? [['tenants', 'Clients'], ['setup', setupLabel]] : [['setup', setupLabel], ['tenants', 'Clients']];
  const tabs = [...(S.super ? superTabs : []), ...shopTabs.filter(([k]) => showAll || MAIN_TABS.has(k))];
  const hasMore = shopTabs.some(([k]) => !MAIN_TABS.has(k));
  if (!tabs.find((t) => t[0] === S.tab)) S.tab = tabs[0][0];
  document.querySelector('main').style.maxWidth = '';
  $('#banner').innerHTML = S.banner ? `<div style="max-width:1100px;margin:12px auto 0;padding:0 16px"><div class="card" style="margin:0;border-color:${S.banner.level === 'warn' ? 'var(--warn)' : 'var(--line)'}">${S.banner.level === 'warn' ? '⚠️' : '⏳'} ${esc(S.banner.text)} ${S.role === 'owner' ? '<a href="#" id="bgo">Choose a plan →</a>' : ''}</div></div>` : '';
  if (S.fromGuide && S.tab !== 'overview') $('#banner').insertAdjacentHTML('beforeend', `<div style="max-width:1100px;margin:12px auto 0;padding:0 16px"><a href="#" id="backguide">← Back to your steps</a></div>`);
  else S.fromGuide = false;
  if ($('#backguide')) $('#backguide').onclick = (e) => { e.preventDefault(); S.fromGuide = false; S.tab = 'overview'; store.set('wc_tab', 'overview'); render(); };
  if ($('#bgo')) $('#bgo').onclick = (e) => { e.preventDefault(); S.tab = 'billing'; render(); };
  $('#who').textContent = S.tenant ? '· ' + S.tenant.name : S.super ? '· super admin' : '';
  $('#nav').innerHTML = tabs.map(([k, l]) => `<button data-t="${k}" class="${S.tab === k ? 'on' : ''}">${l}</button>`).join('') + (hasMore ? `<button id="moretabs">${showAll ? '‹ Fewer' : 'More ›'}</button>` : '');
  $('#nav').querySelectorAll('button[data-t]').forEach((b) => (b.onclick = () => { S.fromGuide = false; S.tab = b.dataset.t; store.set('wc_tab', S.tab); render(); }));
  if ($('#moretabs')) $('#moretabs').onclick = () => { store.set('wc_alltabs', showAll ? null : '1'); if (showAll && !MAIN_TABS.has(S.tab)) S.tab = 'overview'; render(); };
  ({ setup, tenants, overview, analytics, team, billing, knowledge, ai, automations, contacts, campaigns, templates, grow, simulator, inbox, orders, catalogue, settings, broadcast })[S.tab]().catch((e) => toast(e.message));
}

// ---------- super admin: guided platform setup ----------
const SETUP_STEPS = [
  ['ai', '🤖', 'AI'],
  ['payments', '💳', 'Payments'],
  ['whatsapp', '📱', 'WhatsApp'],
  ['business', '🏢', 'Your business'],
];
const copyBox = (label, value) => `<label>${label}</label><div style="display:flex;gap:6px"><input readonly value="${esc(value)}"><button class="btn ghost" data-copy="${esc(value)}">Copy</button></div>`;
const ext = (href, text) => `<a href="${esc(href)}" target="_blank" rel="noopener">${text} ↗</a>`;
const field = (k, label, v, { secret, placeholder = '', type = 'text' } = {}) => `<label>${label}</label><input data-k="${k}" type="${secret ? 'password' : type}" autocomplete="off" placeholder="${esc(secret && v ? 'Saved: ' + v + ' (leave empty to keep it)' : placeholder)}" value="${secret ? '' : esc(v || '')}">`;
const stepNo = (n, html) => `<div style="display:flex;gap:10px;padding:10px 0;border-top:1px solid var(--line)"><span class="pill" style="height:fit-content">${n}</span><div style="flex:1;min-width:0">${html}</div></div>`;

async function setup() {
  const st = (S.setup = await api('/system/setup'));
  const v = st.values, u = st.urls;
  const firstTodo = SETUP_STEPS.findIndex(([k]) => !st.steps[k]);
  if (S.setupStep == null) S.setupStep = firstTodo === -1 ? SETUP_STEPS.length : firstTodo;
  const i = S.setupStep;
  const bar = `<div class="card"><h2>Set up your platform <span class="mute" style="font-weight:400">${st.done} of ${st.total} done</span></h2>
    <div style="height:8px;background:var(--bg);border-radius:99px;overflow:hidden;margin-bottom:12px"><div style="height:100%;width:${(st.done / st.total) * 100}%;background:var(--brand)"></div></div>
    <div style="display:flex;gap:6px;flex-wrap:wrap">${SETUP_STEPS.map(([k, icon, label], n) => `<button class="btn ${n === i ? '' : 'ghost'}" data-step="${n}">${st.steps[k] ? '✅' : icon} ${n + 1}. ${label}</button>`).join('')}
    <button class="btn ${i === SETUP_STEPS.length ? '' : 'ghost'}" data-step="${SETUP_STEPS.length}">🎉 Finish</button></div></div>`;
  const nav = () => `<p style="display:flex;gap:8px;flex-wrap:wrap;margin-top:16px">${i > 0 ? `<button class="btn ghost" data-step="${i - 1}">‹ Back</button>` : ''}<span style="flex:1"></span><button class="btn ghost" data-step="${i + 1}">${st.steps[SETUP_STEPS[i][0]] ? 'Next ›' : 'Skip for now ›'}</button></p>`;
  let body = '';
  if (i === 0) body = `<div class="card"><h2>🤖 Step 1: Turn on the AI</h2>
    <p>The AI answers your shops' customers. It runs on <b>OpenRouter</b>, which you pay as you go (a few pounds a month for a small shop).</p>
    ${stepNo(1, `${ext('https://openrouter.ai/sign-up', 'Create an OpenRouter account')} and ${ext('https://openrouter.ai/settings/credits', 'add some credit')} (for example $20).`)}
    ${stepNo(2, `In ${ext('https://openrouter.ai/settings/privacy', 'Settings → Privacy')}, switch off anything that lets them log or train on prompts.`)}
    ${stepNo(3, `Go to ${ext('https://openrouter.ai/settings/keys', 'Keys')}, press <b>Create key</b> and paste it here:${field('aiApiKey', 'OpenRouter key (starts with sk-or-)', v.aiApiKey, { secret: true })}
      <details style="margin-top:8px"><summary class="mute">Advanced: change the AI model</summary>${field('aiModel', 'Model (the default is cheap and good)', v.aiModel, { placeholder: 'openai/gpt-4o-mini' })}</details>`)}
    ${st.aiCheck === '0' ? '<p class="pill warn">⚠️ The saved key was rejected. Paste a new one.</p>' : ''}
    <p><button class="btn" id="ssave">Save and test</button> ${st.steps.ai ? '<button class="btn ghost" id="stest">Test again</button>' : ''}</p><div id="sres"></div>${nav()}</div>`;
  if (i === 1) body = `<div class="card"><h2>💳 Step 2: Get paid by your shops</h2>
    <p>Shops pay you monthly by card through <b>Stripe</b>. Paste one key and we create the three plans (£29 / £79 / £199 a month) and the rest of the Stripe setup for you.</p>
    ${st.stripeMode ? `<p>Stripe is in <span class="pill ${st.stripeMode === 'live' ? '' : 'warn'}">${st.stripeMode === 'live' ? 'LIVE mode: real money' : 'TEST mode: no real money'}</span></p>` : ''}
    ${stepNo(1, `Open ${ext('https://dashboard.stripe.com/test/apikeys', 'Stripe → Developers → API keys')}. Start in <b>Test mode</b>, so you can try everything with the test card 4242 4242 4242 4242.`)}
    ${stepNo(2, `Copy the <b>Secret key</b> and paste it here:${field('platformStripeSecret', 'Stripe secret key (sk_test_… or sk_live_…)', v.platformStripeSecret, { secret: true })}`)}
    ${stepNo(3, `Press the button. We create the plans and the webhook in your Stripe account.<p><button class="btn" id="sstripe">Save and set up Stripe for me</button></p><div id="sres"></div>`)}
    ${stepNo(4, `In Stripe, turn on the ${ext('https://dashboard.stripe.com/test/settings/billing/portal', 'customer portal')} (allow cancel, switch plan and update card) and ${ext('https://dashboard.stripe.com/settings/emails', 'receipt emails')}.`)}
    ${stepNo(5, `<b>When you're ready for real money:</b> switch Stripe to Live mode, paste your <b>live</b> secret key above and press the button again.`)}
    <details style="margin-top:8px"><summary class="mute">Advanced: enter the Stripe IDs yourself</summary>
      <div class="row"><div>${field('stripePriceStarter', 'Starter price ID', v.stripePriceStarter, { placeholder: 'price_…' })}</div><div>${field('stripePriceGrowth', 'Growth price ID', v.stripePriceGrowth, { placeholder: 'price_…' })}</div><div>${field('stripePricePro', 'Pro price ID', v.stripePricePro, { placeholder: 'price_…' })}</div></div>
      ${field('platformStripeWebhookSecret', 'Webhook signing secret (whsec_…)', v.platformStripeWebhookSecret, { secret: true })}
      ${copyBox('Webhook address', u.stripeWebhook)}<p><button class="btn ghost" id="ssave">Save</button></p></details>${nav()}</div>`;
  if (i === 2) body = `<div class="card"><h2>📱 Step 3: Connect WhatsApp (Meta)</h2>
    <p>This lets shops connect their WhatsApp number in a few clicks. Meta has to approve you first, which takes <b>days to weeks</b>.
    <b>You can skip this for now.</b> The website chat and the Test bot work without it.</p>
    ${stepNo(1, `Go to ${ext('https://developers.facebook.com/apps', 'Meta for Developers → My Apps')} → <b>Create app</b> → type <b>Business</b> → add the <b>WhatsApp</b> product.`)}
    ${stepNo(2, `In <b>App settings → Basic</b>, paste these two links:${copyBox('Privacy policy URL', u.privacy)}${copyBox('Terms of service URL', u.terms)}
      Then copy the App ID and App secret here:<div class="row"><div>${field('metaAppId', 'App ID', v.metaAppId)}</div><div>${field('metaAppSecret', 'App secret', v.metaAppSecret, { secret: true })}</div></div>`)}
    ${stepNo(3, `In <b>WhatsApp → Configuration → Webhook</b>, press Edit and paste:${copyBox('Callback URL', u.whatsappWebhook)}${copyBox('Verify token', v.metaWebhookVerifyToken)}
      Then subscribe to these fields: <code>messages</code> <code>account_update</code> <code>history</code> <code>smb_app_state_sync</code> <code>smb_message_echoes</code> <code>message_template_status_update</code>`)}
    ${stepNo(4, `In <b>Facebook Login for Business → Configurations</b>, create a configuration with login variation <b>Embedded Signup</b>, and <b>tick the WhatsApp product</b>. Copy its ID here:
      ${field('metaConfigId', 'Configuration ID', v.metaConfigId)}Then under Facebook Login for Business → <b>Settings</b>, add this to <b>Allowed domains</b>:${copyBox('Domain', u.domain)}`)}

// ---------- simulator ----------
function bubble(m, dir) {
  if (dir === 'in') return `<div class="b in">${esc(m)}</div>`;
  let h = '', acts = [];
  if (m.type === 'image') h = `<img src="${esc(m.url)}" alt="">${esc(m.caption)}`;
  else if (m.type === 'cta') { h = esc(m.text); acts.push(`<a class="btn" style="text-decoration:none;font-size:13px;padding:4px 8px" href="${esc(m.url)}" target="_blank" rel="noopener">${esc(m.buttonText)}</a>`); }
  else if (m.type === 'buttons') { h = (m.header ? `<b>${esc(m.header)}</b>\n` : '') + esc(m.text); acts = m.buttons.map((b) => `<button data-a="${esc(b.id)}" data-l="${esc(b.title)}">${esc(b.title)}</button>`); }
  else if (m.type === 'list') { h = esc(m.text); acts = m.sections.flatMap((s) => s.rows.map((r) => `<button data-a="${esc(r.id)}" data-l="${esc(r.title)}" title="${esc(r.description || '')}">${esc(r.title)}</button>`)); }
  else h = esc(m.text || JSON.stringify(m));
  h = h.replace(/\*([^*\n]+)\*/g, '<b>$1</b>').replace(/(^|\s)_([^_\n]+)_/g, '$1<i>$2</i>');
  return `<div class="b out">${h}${acts.length ? `<div class="acts">${acts.join('')}</div>` : ''}</div>`;
}

  store.set('wc_simid', waId);
  $('#app').innerHTML = `<div class="card"><h2>Test your bot</h2><p class="mute">Chat exactly as a customer would on WhatsApp – nothing is sent to WhatsApp (except staff alerts). Test number: <code>${waId}</code> <button class="btn ghost" id="newsim">New customer</button></p>
    <div class="chat" id="chat"></div><div style="display:flex;gap:8px;margin-top:8px"><input id="msg" placeholder="Type a message… try “hi”"><button class="btn" id="send">Send</button></div></div>`;
  const chat = $('#chat');
  const push = (html) => { chat.insertAdjacentHTML('beforeend', html); chat.scrollTop = chat.scrollHeight; };
  const go = async (body, label) => {
    push(bubble(label, 'in'));
    try { const { replies } = await api(T('/simulate'), { method: 'POST', body: { waId, ...body } }); replies.forEach((m) => push(bubble(m, 'out'))); if (!replies.length) push('<div class="mute">(no reply – conversation may be with a human. Type “menu”)</div>'); } catch (e) { toast(e.message); }
  };
  chat.onclick = (e) => { const b = e.target.closest('button[data-a]'); if (b) go({ actionId: b.dataset.a }, b.dataset.l); };
  const sendText = () => { const v = $('#msg').value.trim(); if (!v) return; $('#msg').value = ''; go({ text: v }, v); };
  $('#send').onclick = sendText; $('#msg').onkeydown = (e) => e.key === 'Enter' && sendText();
  $('#newsim').onclick = () => { store.set('wc_simid', null); simulator(); };
}

// ---------- inbox ----------
async function inbox(sel, filter = store.get('wc_inbox') || 'all') {
  const [{ conversations: all }, { agents, me }] = await Promise.all([api(T('/conversations')), api(T('/agents')).catch(() => ({ agents: [], me: '' }))]);
  const conversations = all.filter((c) => filter === 'all' || (filter === 'mine' && c.assigned_to === me) || (filter === 'human' && c.human_handover) || (filter === 'unassigned' && !c.assigned_to));
  const preview = (c) => { const b = c.last || {}; return esc((b.text || b.caption || b.type || '').slice(0, 60)); };
  $('#app').innerHTML = `<div class="split"><div class="card" style="max-height:600px;overflow:auto"><h2>Chats</h2>
    <select id="ifil" style="margin-bottom:8px">${[['all', 'All chats'], ['human', 'Needs a human'], ['mine', 'Assigned to me'], ['unassigned', 'Unassigned']].map(([k, l]) => `<option value="${k}" ${filter === k ? 'selected' : ''}>${l}</option>`).join('')}</select>
    ${conversations.map((c) => `<div class="list-item ${sel === c.wa_id ? 'on' : ''}" data-w="${esc(c.wa_id)}"><b>${esc(c.name || '+' + c.wa_id)}</b> ${c.human_handover ? '<span class="pill warn">needs human</span>' : ''}${c.assigned_to ? ` <span class="pill">👤 ${esc(c.assigned_to)}</span>` : ''}<div class="mute">${preview(c)}</div></div>`).join('') || '<p class="mute">No conversations yet.</p>'}
    </div><div class="card" id="thread"><p class="mute">Select a chat</p></div></div>`;
  $('#app').querySelectorAll('[data-w]').forEach((el) => (el.onclick = () => inbox(el.dataset.w, filter)));
  $('#ifil').onchange = () => { store.set('wc_inbox', $('#ifil').value); inbox(sel, $('#ifil').value); };
  if (!sel) return;
  const c = conversations.find((x) => x.wa_id === sel);
  const { messages } = await api(T(`/conversations/${sel}/messages`));
  $('#thread').innerHTML = `<h2>${esc(c?.name || '')} +${esc(sel)} <button class="btn ghost" id="ho">${c?.human_handover ? '🤖 Give back to bot' : '🙋 Take over'}</button>
    <select id="asg" style="width:auto"><option value="">Unassigned</option>${agents.map((a) => `<option ${c?.assigned_to === a ? 'selected' : ''}>${esc(a)}</option>`).join('')}</select></h2>
    ${c?.cart?.length ? `<p class="mute">Cart: ${c.cart.map((i) => esc(i.title) + ' ×' + i.quantity).join(', ')}</p>` : ''}
    <div class="chat" id="tchat">${messages.map((m) => (m.direction === 'in' ? (m.body.mediaId ? `<div class="b in">${/^image\//.test(m.body.mime || '') ? `<img data-media="${esc(m.body.mediaId)}" alt="image">` : `<a href="#" data-mediadl="${esc(m.body.mediaId)}">📎 ${esc(m.body.raw || 'file')} – open</a>`}${m.body.text && !/^\[/.test(m.body.text) ? '<br>' + esc(m.body.text) : ''}</div>` : bubble(m.body.text || `[${m.body.raw || m.type}]`, 'in')) : bubble(m.body, 'out'))).join('')}</div>
    <div style="display:flex;gap:8px;margin-top:8px"><input id="rep" placeholder="Reply as staff (takes over from bot)"><button class="btn" id="rs">Send</button></div>`;
  $('#tchat').scrollTop = 1e9;
  const blobUrl = async (id) => { const r = await fetch('/api' + T('/media/' + id), { headers: { Authorization: 'Bearer ' + S.key } }); if (!r.ok) throw new Error('media unavailable'); return URL.createObjectURL(await r.blob()); };
  $('#tchat').querySelectorAll('img[data-media]').forEach(async (img) => { try { img.src = await blobUrl(img.dataset.media); } catch { img.replaceWith(document.createTextNode('[image expired]')); } });
  $('#tchat').querySelectorAll('[data-mediadl]').forEach((a) => (a.onclick = async (e) => { e.preventDefault(); try { window.open(await blobUrl(a.dataset.mediadl)); } catch (err) { toast(err.message); } }));
  $('#asg').onchange = async () => { await api(T(`/conversations/${sel}/assign`), { method: 'POST', body: { to: $('#asg').value || null } }); inbox(sel, filter); };
  $('#ho').onclick = async () => { await api(T(`/conversations/${sel}/handover`), { method: 'POST', body: { on: !c?.human_handover } }); inbox(sel, filter); };
  $('#rs').onclick = async () => { const r = await api(T(`/conversations/${sel}/reply`), { method: 'POST', body: { text: $('#rep').value } }); if (!r.ok) toast(r.error + ' ' + (r.hint || '')); inbox(sel); };
}

    ], null, 2);
  };
  $('#savecat').onclick = async () => {
    try {
      const categories = JSON.parse($('#cats').value), products = JSON.parse($('#prods').value);
      // send full arrays (deep-merge replaces arrays)
      S.tenant = (await api(T('/settings'), { method: 'PATCH', body: { store: { manual: { categories, products } } } })).tenant;
      toast('Catalogue saved');
    } catch (e) { toast(e.message); }
  };
}

const getP = (o, p) => p.split('.').reduce((a, k) => (a == null ? a : a[k]), o);
function setP(o, p, v) { const ks = p.split('.'); let c = o; ks.slice(0, -1).forEach((k) => (c = c[k] ||= {})); c[ks.at(-1)] = v; }
async function settings() {
  const s = S.tenant.settings;
  $('#app').innerHTML = FIELDS.map(([title, fields]) => `<div class="card"><h2>${title}</h2><div class="row">${fields.map(([p, l, type, opts]) => {
    const v = getP(s, p);
    let input;
    if (type === 'textarea') input = `<textarea data-f="${p}">${esc(v)}</textarea>`;
    else if (type === 'json') input = `<textarea data-f="${p}" data-type="json" style="font-family:monospace;min-height:110px">${esc(JSON.stringify(v ?? [], null, 2))}</textarea>`;
    else if (type === 'select') input = `<select data-f="${p}">${opts.map((o) => `<option ${o === v ? 'selected' : ''}>${o}</option>`).join('')}</select>`;
    else if (type === 'bool') input = `<select data-f="${p}" data-type="bool"><option value="true" ${v ? 'selected' : ''}>Yes</option><option value="false" ${!v ? 'selected' : ''}>No</option></select>`;
    else input = `<input data-f="${p}" data-type="${type || ''}" ${type === 'secret' ? 'type="password" placeholder="(unchanged)"' : ''} value="${esc(type === 'csv' || type === 'csvnum' ? (v || []).join(',') : type === 'secret' ? '' : v)}">`;
    return `<div><label>${l}</label>${input}</div>`;
  }).join('')}</div></div>`).join('') + '<p><button class="btn" id="saveset">Save settings</button></p>';
  $('#saveset').onclick = async () => {
    const patch = {};
    let bad = null;
    $('#app').querySelectorAll('[data-f]').forEach((el) => {
      const t = el.dataset.type; let v = el.value;
      if (t === 'secret' && !v) return;
      if (t === 'json') { try { v = JSON.parse(v || '[]'); } catch { bad = el.dataset.f; return; } }
      if (t === 'csvnum') v = v.split(',').map((x) => x.trim()).filter((x) => x !== '').map(Number);
      if (t === 'csv') v = v.split(',').map((x) => x.trim()).filter(Boolean);
      if (t === 'number') v = Number(v) || 0;
      if (t === 'bool') v = v === 'true';
      setP(patch, el.dataset.f, v);
    });
    if (bad) return toast('Invalid JSON in ' + bad);
    try { S.tenant = (await api(T('/settings'), { method: 'PATCH', body: patch })).tenant; toast('Settings saved'); } catch (e) { toast(e.message); }
  };
}

async function downloadCsv(kind) {
  const res = await fetch('/api' + T(`/export/${kind}.csv`), { headers: { Authorization: 'Bearer ' + S.key } });
  if (!res.ok) return toast('Export failed');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(await res.blob());
  a.download = `${kind}-${S.tenantId}.csv`;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}

async function automations() {
  const { flows } = await api(T('/flows'));
  $('#app').innerHTML = `<div class="card"><h2>Automations <span class="mute" style="font-weight:400">– keyword auto-replies & chatbot flows</span></h2>
    <p class="mute">Flows start when a customer sends a keyword (e.g. “hi”, “price list”), on their very first message, or when they arrive from a Click-to-WhatsApp ad. Anything not matched goes to the shop bot / AI.</p>
    <p><button class="btn" id="newflow">+ New flow</button> ${FLOW_PRESETS.map((p, i) => `<button class="btn ghost" data-preset="${i}">Use template: ${esc(p.name)}</button>`).join(' ')}</p></div>
    <div class="card"><div class="tablewrap"><table><tr><th>Name</th><th>Triggers</th><th>Blocks</th><th>Runs</th><th>Status</th><th></th></tr>
    ${flows.map((f) => `<tr><td><b>${esc(f.name)}</b></td><td>${(f.triggers.keywords || []).map((k) => `<span class="pill">${esc(k)}</span>`).join(' ')}${f.triggers.welcome ? ' <span class="pill">first message</span>' : ''}${(f.triggers.adIds || []).length ? ' <span class="pill">ads</span>' : ''}</td><td>${f.steps.length}</td><td>${f.runs}</td><td>${f.active ? '✅ Active' : '⏸ Paused'}</td>
      <td><button class="btn ghost" data-edit="${f.id}">Edit</button> <button class="btn ghost" data-delflow="${f.id}">Delete</button></td></tr>`).join('') || '<tr><td colspan="6" class="mute">No flows yet – start from a template above.</td></tr>'}</table></div></div>`;
  const open = async (flow) => {
    let products = [], templates = [];
    try { const s = S.tenant.settings; if (s.store.type === 'manual') products = (s.store.manual.products || []).map((p) => ({ id: p.id, title: p.title })); } catch {}
    try { templates = (await api(T('/templates'))).templates || []; } catch {}
    document.querySelector('main').style.maxWidth = 'none';
    openFlowBuilder({ root: $('#app'), flow, products, templates, onClose: automations, api: (method, path, body) => api(T(path), { method, body }) });
  };
  $('#newflow').onclick = () => open(null);
  $('#app').querySelectorAll('[data-preset]').forEach((b) => (b.onclick = () => open(structuredClone(FLOW_PRESETS[+b.dataset.preset]))));
  $('#app').querySelectorAll('[data-edit]').forEach((b) => (b.onclick = async () => open((await api(T('/flows/' + b.dataset.edit))).flow)));
  $('#app').querySelectorAll('[data-delflow]').forEach((b) => (b.onclick = async () => { if (confirm('Delete this flow?')) { await api(T('/flows/' + b.dataset.delflow), { method: 'DELETE' }); automations(); } }));
}

// ---------- contacts ----------
async function contacts(q = '', tag = '') {
  const { contacts, tags } = await api(T(`/contacts?q=${encodeURIComponent(q)}&tag=${encodeURIComponent(tag)}`));
  const owner = S.role === 'owner';
  $('#app').innerHTML = `<div class="card"><h2>Contacts (${contacts.length})</h2>
    <div class="row"><div><label>Search name / number</label><input id="cq" value="${esc(q)}"></div><div><label>Tag</label><select id="ct"><option value="">All</option>${tags.map((t) => `<option ${t === tag ? 'selected' : ''}>${esc(t)}</option>`).join('')}</select></div>
    ${owner ? `<div><label>Import CSV (phone,name,email,tags,opt_in + any extra columns)</label><input type="file" id="cf" accept=".csv"></div>` : ''}</div>
    <p>${owner ? '<button class="btn ghost" id="cimp">Import contacts</button> ' : ''}<button class="btn ghost" data-csv="customers">⬇ Export CSV</button></p><pre id="cres" class="mute" style="white-space:pre-wrap"></pre></div>
    <div class="card"><div class="tablewrap"><table><tr><th>Name</th><th>WhatsApp</th><th>Tags</th><th>Details</th><th>Source</th><th>Offers</th><th></th></tr>
    ${contacts.slice(0, 500).map((c) => `<tr><td>${esc(c.name || '')}</td><td>+${esc(c.wa_id)}</td><td>${c.tags.map((t) => `<span class="pill">${esc(t)}</span>`).join(' ')}</td>
      <td class="mute">${[c.email, ...Object.entries(c.attributes).map(([k, v]) => `${k}: ${v}`)].filter(Boolean).map(esc).join('<br>')}</td>
      <td class="mute">${c.source ? esc(c.source.source_type === 'ad' ? '📣 Ad ' + (c.source.headline || c.source.source_id || '') : c.source.source_type || 'link') : ''}</td>
      <td>${c.opted_in_marketing ? '✅' : '—'}</td><td><button class="btn ghost" data-tag="${esc(c.wa_id)}">+ Tag</button>${owner ? ` <button class="btn ghost" data-dsar="${esc(c.wa_id)}" title="Download everything held about this person">Export</button> <button class="btn ghost" data-erase="${esc(c.wa_id)}">Erase</button>` : ''}</td></tr>`).join('')}</table></div></div>`;
  $('#app').querySelectorAll('[data-dsar]').forEach((b) => (b.onclick = async () => {
    const r = await fetch('/api' + T(`/contacts/${b.dataset.dsar}/export`), { headers: { Authorization: 'Bearer ' + S.key } });
    const a = document.createElement('a'); a.href = URL.createObjectURL(await r.blob()); a.download = `data-export-${b.dataset.dsar}.json`; a.click();
  }));
  $('#app').querySelectorAll('[data-erase]').forEach((b) => (b.onclick = async () => {
    if (prompt(`Type ERASE to permanently delete all data for +${b.dataset.erase} (orders are anonymised, opt-out kept)`) !== 'ERASE') return;
    try { await api(T(`/contacts/${b.dataset.erase}/erase`), { method: 'POST', body: { confirm: true } }); toast('Erased'); contacts(q, tag); } catch (e) { toast(e.message); }
  }));
  $('#cq').onchange = () => contacts($('#cq').value, $('#ct').value);
  $('#ct').onchange = () => contacts($('#cq').value, $('#ct').value);
  $('#app').querySelector('[data-csv]').onclick = () => downloadCsv('customers');
  if ($('#cimp')) $('#cimp').onclick = async () => {
    const f = $('#cf').files[0]; if (!f) return toast('Choose a CSV file');
    try { const r = await api(T('/contacts/import'), { method: 'POST', body: { csv: await f.text() } }); toast(`Imported ${r.imported}`); await contacts(q, tag); $('#cres').textContent = [r.note, ...r.errors].join('\n'); } catch (e) { $('#cres').textContent = e.message; }
  };
  $('#app').querySelectorAll('[data-tag]').forEach((b) => (b.onclick = async () => {
    const t = prompt('Tag to add (prefix with - to remove):'); if (!t) return;
    const body = t.startsWith('-') ? { removeTags: [t.slice(1)] } : { addTags: [t] };
    await api(T('/contacts/' + b.dataset.tag), { method: 'PATCH', body }); contacts(q, tag);
  }));
}

// ---------- campaigns ----------
async function campaigns() {
  const [{ campaigns }, tpl, ct] = await Promise.all([api(T('/campaigns')), api(T('/templates')).catch(() => ({ templates: [] })), api(T('/contacts')).catch(() => ({ tags: [] }))]);
  const approved = (tpl.templates || []).filter((t) => t.status === 'APPROVED');
  const pct = (a, b) => (b ? Math.round((a / b) * 100) + '%' : '–');
  $('#app').innerHTML = `<div class="card"><h2>New campaign</h2>
    <p class="mute">Campaigns use approved WhatsApp templates and go to opted-in contacts. Schedule up to 2 months ahead; retarget people who didn't read or reply.</p>
    <div class="row">
      <div><label>Name</label><input id="cn" placeholder="Black Friday"></div>
      <div><label>Template</label>${approved.length ? `<select id="ctpl">${approved.map((t) => `<option value="${esc(t.name)}|${esc(t.language)}">${esc(t.name)} (${esc(t.language)}) · ${esc(t.category)}</option>`).join('')}</select>` : '<input id="ctpl" placeholder="template_name|en_GB">'}</div>
      <div><label>Body variables (comma; use {{name}} for first name)</label><input id="cv" placeholder="{{name}}, 20% off"></div>
      <div><label>Send at (empty = now)</label><input id="cwhen" type="datetime-local"></div></div>
    <h3>Audience</h3><div class="row">
      <div><label>Tags (any of, comma)</label><input id="atags" list="taglist"><datalist id="taglist">${(ct.tags || []).map((t) => `<option>${esc(t)}</option>`).join('')}</datalist></div>
      <div><label>Exclude tags</label><input id="aex"></div>
      <div><label>Customers</label><select id="aord"><option value="">Everyone</option><option value="true">Have ordered</option><option value="false">Never ordered</option></select></div>
      <div><label>No order in last N days</label><input id="alast" type="number" min="0"></div>
      <div><label>Retarget campaign</label><select id="art"><option value="">—</option>${campaigns.filter((c) => c.status === 'sent').map((c) => `<option value="${c.id}">${esc(c.name)}</option>`).join('')}</select></div>
      <div><label>…who</label><select id="arts"><option value="not_read">didn't read</option><option value="not_replied">didn't reply</option><option value="read">read</option><option value="replied">replied</option><option value="failed">failed</option></select></div></div>
    <p><button class="btn ghost" id="cprev">Count recipients</button> <button class="btn" id="cgo">Schedule campaign</button> <span id="cinfo" class="mute"></span></p></div>
    <div class="card"><h2>Campaigns</h2><div class="tablewrap"><table><tr><th>Name</th><th>Template</th><th>When (UTC)</th><th>Status</th><th>Sent</th><th>Delivered</th><th>Read</th><th>Replied</th><th>Failed</th><th></th></tr>
    ${campaigns.map((c) => `<tr><td>${esc(c.name)}</td><td>${esc(c.template)}</td><td>${esc(c.scheduled_at)}</td><td>${esc(c.status)}</td><td>${c.stats.sent}</td><td>${c.stats.delivered} <span class="mute">${pct(c.stats.delivered, c.stats.sent)}</span></td><td>${c.stats.read} <span class="mute">${pct(c.stats.read, c.stats.sent)}</span></td><td>${c.stats.replied} <span class="mute">${pct(c.stats.replied, c.stats.sent)}</span></td><td>${c.stats.failed}</td>
      <td>${c.status === 'scheduled' ? `<button class="btn ghost" data-cancel="${c.id}">Cancel</button>` : ''}</td></tr>`).join('') || '<tr><td colspan="10" class="mute">No campaigns yet</td></tr>'}</table></div></div>`;
  const audience = () => ({
    tags: $('#atags').value.split(',').map((x) => x.trim()).filter(Boolean), excludeTags: $('#aex').value.split(',').map((x) => x.trim()).filter(Boolean),
    hasOrdered: $('#aord').value === '' ? null : $('#aord').value === 'true', lastOrderOlderThanDays: Number($('#alast').value) || 0,
    retarget: $('#art').value ? { campaignId: Number($('#art').value), status: $('#arts').value } : undefined,
  });
  $('#cprev').onclick = async () => { const r = await api(T('/campaigns/preview'), { method: 'POST', body: { audience: audience(), template: $('#ctpl').value.split('|')[0] } }); $('#cinfo').textContent = `${r.recipients} recipients · estimated Meta cost ≈ £${r.cost.estimatedGbp.toFixed(2)} (billed by Meta)`; };
  $('#cgo').onclick = async () => {
    const pv = await api(T('/campaigns/preview'), { method: 'POST', body: { audience: audience(), template: $('#ctpl').value.split('|')[0] } });
    if (!confirm(`Send to ${pv.recipients} opted-in contacts?\nEstimated Meta cost ≈ £${pv.cost.estimatedGbp.toFixed(2)} (billed to your Meta account).`)) return;
    const [template, language = 'en_GB'] = $('#ctpl').value.split('|');
    const vars = $('#cv').value.split(',').map((x) => x.trim()).filter(Boolean);
    const components = vars.length ? [{ type: 'body', parameters: vars.map((text) => ({ type: 'text', text })) }] : undefined;
    const when = $('#cwhen').value ? new Date($('#cwhen').value).toISOString() : undefined;
    try { await api(T('/campaigns'), { method: 'POST', body: { name: $('#cn').value || template, template, language, components, audience: audience(), scheduledAt: when } }); toast('Campaign scheduled'); campaigns(); } catch (e) { toast(e.message); }
  };
  $('#app').querySelectorAll('[data-cancel]').forEach((b) => (b.onclick = async () => { await api(T(`/campaigns/${b.dataset.cancel}/cancel`), { method: 'POST' }); campaigns(); }));
}

      <p><button class="btn" id="tgo">Submit for approval</button></p></div>
    <div class="card"><h2>Your templates</h2><div class="tablewrap"><table><tr><th>Name</th><th>Language</th><th>Category</th><th>Status</th><th></th></tr>
    ${(r.templates || []).map((t) => `<tr><td><code>${esc(t.name)}</code></td><td>${esc(t.language)}</td><td>${esc(t.category)}</td><td>${t.status === 'APPROVED' ? '✅ ' : t.status === 'REJECTED' ? '❌ ' : '⏳ '}${esc(t.status)}${t.rejected_reason && t.rejected_reason !== 'NONE' ? ` <span class="mute">${esc(t.rejected_reason)}</span>` : ''}${t.previous_category ? ` <span class="pill warn">Meta changed category ${esc(t.previous_category)} → ${esc(t.category)}</span>` : ''}</td><td><button class="btn ghost" data-deltpl="${esc(t.name)}">Delete</button></td></tr>`).join('') || '<tr><td colspan="5" class="mute">None yet</td></tr>'}</table></div></div>`;
  const submit = async (t) => { try { const r = await api(T('/templates'), { method: 'POST', body: t }); toast((r.warnings || []).length ? '⚠️ ' + r.warnings.join(' ') : 'Submitted to Meta – approval usually takes minutes'); templates(); } catch (e) { toast(e.message); } };
  $('#app').querySelectorAll('[data-lib]').forEach((b) => (b.onclick = () => submit(r.library[+b.dataset.lib])));
  $('#tgo').onclick = () => submit({ name: $('#tn').value.trim(), category: $('#tc').value, language: $('#tl').value, header: $('#th').value, body: $('#tb').value, footer: $('#tf').value, examples: $('#tx').value.split(',').map((x) => x.trim()), buttons: $('#tq').value.split(',').map((x) => x.trim()).filter(Boolean).map((text) => ({ text })) });
  $('#app').querySelectorAll('[data-deltpl]').forEach((b) => (b.onclick = async () => { if (confirm('Delete template ' + b.dataset.deltpl + '?')) { await api(T('/templates/' + b.dataset.deltpl), { method: 'DELETE' }).catch((e) => toast(e.message)); templates(); } }));
}

// ---------- shop owner: step-by-step guide (top of Overview) ----------
const STORE_NAMES = { manual: 'your own product list', shopify_public: 'your Shopify shop', shopify: 'your Shopify shop', woocommerce: 'your WooCommerce shop', custom: 'your shop system' };
async function shopGuide(t) {
  const el = $('#guide');
  if (!el) return;
  const g = await api(T('/onboarding'));
  const s = t.settings;
  const open = S.guideOpen || g.next;
  const allDone = g.done === g.total;
  if (allDone && !S.guideShowAll) {
    el.innerHTML = `<div class="card"><h2>🎉 Your shop is live</h2><p class="mute">Every step is done. <a href="#" id="gshow">Show the steps</a></p></div>`;
    $('#gshow').onclick = (e) => { e.preventDefault(); S.guideShowAll = true; shopGuide(t); };
    return;
  }
  const nextStep = g.steps.find((x) => x.key === g.next);
  const num = (k) => g.steps.findIndex((x) => x.key === k) + 1;
  const body = (st) => {
    const d = st.data || {};
    const skip = st.done ? '' : `<button class="btn ghost" data-gskip="${st.key}">${st.key === 'whatsapp' || st.key === 'golive' ? 'Do this later' : 'Skip this step'}</button>`;
    switch (st.key) {
      case 'shop': return `<p>Type your website address. We read it and fill in your shop name, currency, products (Shopify) and your policy and FAQ pages, so you don't have to type them.</p>
        <div style="display:flex;gap:8px;flex-wrap:wrap"><input id="g-site" style="flex:1;min-width:200px" placeholder="yourshop.co.uk" value="${esc(d.website)}"><button class="btn" id="g-sitego">Set up from my website</button></div>
        <div id="g-res" class="mute" style="margin-top:8px"></div><p class="mute">No website? That's fine. ${skip}</p>`;
      case 'products': return st.done
        ? `<p>✅ Products come from <b>${esc(STORE_NAMES[d.storeType] || d.storeType)}</b>${d.products != null ? ` (${d.products} products)` : ''}.</p><p><button class="btn ghost" id="g-store">Check my products</button> <span id="g-res" class="mute"></span></p>`

          <div class="row">
            <div class="card" style="margin:0"><b>🟢 I use Shopify</b><p class="mute">Just type your shop address. Nothing to install.</p><input id="g-shop" placeholder="yourshop.co.uk or yourshop.myshopify.com"><p><button class="btn" id="g-shopgo">Connect Shopify</button></p></div>
            <div class="card" style="margin:0"><b>🟣 I use WooCommerce</b><p class="mute">In WordPress go to WooCommerce → Settings → Advanced → REST API → Add key (Read). Paste the two keys.</p><input id="g-wurl" placeholder="https://yourshop.co.uk"><input id="g-wck" placeholder="Consumer key ck_…" style="margin-top:6px"><input id="g-wcs" type="password" placeholder="Consumer secret cs_…" style="margin-top:6px"><p><button class="btn" id="g-woogo">Connect WooCommerce</button></p></div>

          </div><div id="g-res" class="mute" style="margin-top:8px"></div>`;

        <div class="row"><div><label>Tone</label><select id="g-tone">${[['friendly', 'Friendly 😊'], ['professional', 'Professional'], ['playful', 'Playful 🎉'], ['luxury', 'Luxury / premium']].map(([k, l]) => `<option value="${k}" ${s.ai?.tone === k ? 'selected' : ''}>${l}</option>`).join('')}</select></div></div>

        <div id="g-res" class="mute"></div><p>${skip}</p>`;

        ? `<p>${d.status === 'trialing' && d.trialEndsAt ? `Your free trial ends on <b>${new Date(d.trialEndsAt + 'Z').toLocaleDateString('en-GB')}</b>. ` : ''}Choose a plan to keep your shop running after that. You can change or cancel any time.</p><p><button class="btn" data-gtab="billing">Choose my plan</button></p>`
        : '<p class="mute">Your provider will send you an invoice. Nothing to do here.</p>';
    }
    return '';
  };
  el.innerHTML = `<div class="card">
    <h2>${nextStep ? `👉 Next: ${esc(nextStep.title)}` : '🎉 All done'} <span class="mute" style="font-weight:400">· ${g.done} of ${g.total} steps done</span></h2>
    <div style="height:8px;background:var(--bg);border-radius:99px;overflow:hidden;margin-bottom:8px"><div style="height:100%;width:${(g.done / g.total) * 100}%;background:var(--brand)"></div></div>

  el.querySelectorAll('[data-gopen]').forEach((x) => (x.onclick = () => { S.guideOpen = x.dataset.gopen === open ? '__none' : x.dataset.gopen; shopGuide(t); }));
  el.querySelectorAll('[data-gtab]').forEach((x) => (x.onclick = (e) => { e.preventDefault(); S.fromGuide = true; S.tab = x.dataset.gtab; store.set('wc_tab', S.tab); render(); }));

  el.querySelectorAll('[data-gskip]').forEach((x) => (x.onclick = async () => { try { await patch({ onboarding: { skipped: { [x.dataset.gskip]: true } } }); reload(false); } catch (e) { toast(e.message); } }));
  const on = (id, fn) => { const b = $('#' + id); if (b) b.onclick = async () => { b.disabled = true; try { await fn(); } catch (e) { res('⚠️ ' + esc(e.message)); } finally { b.disabled = false; } }; };
  on('g-sitego', async () => {
    res('Reading your website… this can take up to a minute.');
    const r = await api(T('/onboarding/website'), { method: 'POST', body: { url: $('#g-site').value } });
    res(`✅ Found <b>${esc(r.site.name || r.site.domain)}</b>${r.store ? ' and connected its products' : ''}. Imported ${r.imported.length} page(s): ${esc(r.imported.map((x) => x.name).join(', ') || 'none')}`);
    setTimeout(() => reload(false), 2500);
  });
  on('g-store', async () => { res('Checking…'); const r = await api(T('/test/store'), { method: 'POST', body: {} }); res(r.ok ? `✅ Connected${r.name ? ' to ' + esc(r.name) : ''}${r.products != null ? `, ${r.products} products` : ''}` : '⚠️ ' + esc(r.error)); });
  on('g-shopgo', async () => {
    const domain = $('#g-shop').value.trim().replace(/^https?:\/\//, '').replace(/\/.*$/, '');
    if (!domain) return res('Type your Shopify shop address first.');
    await patch({ store: { type: 'shopify_public', shopify: { domain } }, business: { website: s.business?.website || 'https://' + domain } });
    const r = await api(T('/test/store'), { method: 'POST', body: {} });
    if (!r.ok) return res('⚠️ We couldn\'t read products from that address: ' + esc(r.error));
    res(`✅ Connected${r.products != null ? `, ${r.products} products found` : ''}`); setTimeout(() => reload(false), 1500);
  });
  on('g-woogo', async () => {
    await patch({ store: { type: 'woocommerce', woocommerce: { url: $('#g-wurl').value.trim(), consumerKey: $('#g-wck').value.trim(), consumerSecret: $('#g-wcs').value.trim() } } });
    const r = await api(T('/test/store'), { method: 'POST', body: {} });
    if (!r.ok) return res('⚠️ ' + esc(r.error) + ' Check the address and both keys.');
    res('✅ Connected to WooCommerce'); setTimeout(() => reload(false), 1500);
  });
  on('g-aisave', async () => { await patch({ ai: { about: $('#g-about').value, faq: $('#g-faq').value, tone: $('#g-tone').value } }); toast('Saved'); reload(false); });
  on('g-tpl', async () => {
    res('Sending to Meta…');
    const lib = (await api(T('/templates'))).library.filter((x) => g.steps.find((y) => y.key === 'golive').data.required.includes(x.name));
    const out = [];
    for (const tp of lib) out.push(await api(T('/templates'), { method: 'POST', body: tp }).then(() => `✅ ${tp.name}`, (e) => `⚠️ ${tp.name}: ${e.message}`));

    res(out.map(esc).join('<br>')); setTimeout(() => reload(true), 2500);
  });
  on('g-staffgo', async () => {
    const ids = $('#g-staff').value.split(',').map((x) => x.replace(/\D/g, '')).filter(Boolean);
    const tp = s.notifications?.templates || {}; // also point the outside-24-hour messages at the standard templates

  });
  if ($('#esu')) embeddedSignupButton(s);
}

    </div><pre id="kres" class="mute" style="white-space:pre-wrap"></pre>` : ''}

    </table></div></div>
    <div class="card"><h2>🔎 Try a question</h2><div style="display:flex;gap:8px"><input id="kq" placeholder="Do you ship to Ireland?"><button class="btn ghost" id="kqgo">Search</button></div><div id="kqres" class="mute" style="margin-top:8px"></div>

  const again = () => setTimeout(knowledge, 600);
  $('#ktest').onclick = (e) => { e.preventDefault(); S.tab = 'simulator'; render(); };
  $('#kqgo').onclick = async () => { const r = await api(T('/knowledge/search?q=' + encodeURIComponent($('#kq').value))); $('#kqres').innerHTML = r.hits.map((h) => `<div class="card" style="margin:6px 0"><b>${esc(h.doc)}</b><div style="white-space:pre-wrap">${esc(h.text)}</div></div>`).join('') || 'Nothing found – add a document that answers this.'; };
  $('#app').querySelectorAll('[data-kdel]').forEach((b) => (b.onclick = async () => { if (confirm('Remove this document?')) { await api(T('/knowledge/' + b.dataset.kdel), { method: 'DELETE' }); again(); } }));
  if (!owner) return;
  if ($('#ksync')) $('#ksync').onclick = async () => { res('Syncing…'); const r = await api(T('/knowledge/sync'), { method: 'POST' }); res(r.ok ? `✅ Synced ${r.synced || 0}, removed ${r.deleted || 0}${r.failed ? `, ${r.failed} failed` : ''}` : '⚠️ ' + r.error); again(); };
  $('#kurl').onclick = async () => {
    const urls = $('#kurls').value.split(/\s+/).filter(Boolean); if (!urls.length) return toast('Enter at least one address');
    res('Importing…');
    try { const r = await api(T('/knowledge/url'), { method: 'POST', body: { urls } }); res(r.results.map((x) => `${x.ok ? '✅' : '⚠️'} ${x.url}${x.ok ? '' : ' – ' + x.error}`).join('\n')); again(); } catch (e) { res(e.message); }
  };

      const b64 = await new Promise((ok, no) => { const r = new FileReader(); r.onload = () => ok(String(r.result).split(',')[1]); r.onerror = no; r.readAsDataURL(f); });
      try { await api(T('/knowledge/file'), { method: 'POST', body: { filename: f.name, mime: f.type, contentBase64: b64 } }); out.push(`✅ ${f.name}`); } catch (e) { out.push(`⚠️ ${f.name} – ${e.message}`); }
    }
    res(out.join('\n')); again();
  };
  $('#kadd').onclick = async () => { try { await api(T('/knowledge/text'), { method: 'POST', body: { name: $('#ktitle').value || 'Notes', text: $('#ktext').value } }); toast('Added'); again(); } catch (e) { res(e.message); } };
}

// ---------- Meta Embedded Signup ----------
async function embeddedSignupButton(s) {
  const el = $('#esu');
  if (!el) return;
  const cfg = await api('/meta/config').catch(() => ({}));
  if (!cfg.enabled) { el.innerHTML = s.whatsapp.phoneNumberId ? '' : '<span class="mute">Connect WhatsApp by entering your Meta details in Settings (one-click connect becomes available when the server has Meta Embedded Signup configured).</span>'; return; }
  const pending = s.whatsapp.wabaId && s.whatsapp.numberStatus && s.whatsapp.numberStatus !== 'active';
  el.innerHTML = `<button class="btn" id="esbtn">${s.whatsapp.phoneNumberId ? '🔄 Reconnect WhatsApp number' : '📱 Connect a new WhatsApp number'}</button>
    <button class="btn ghost" id="escoex" title="Keep using the WhatsApp Business app on your phone – messages sync both ways">📲 I use the WhatsApp Business app on my number</button>
    ${pending ? '<button class="btn ghost" id="esref">↻ Refresh number</button>' : ''} <span id="esmsg" class="mute">${pending ? 'Connected – waiting for a verified phone number.' : ''}</span>`;
  let session = {};
  window.addEventListener('message', (ev) => {
    if (!/facebook\.com$/.test(new URL(ev.origin).hostname)) return;
    try {
      const d = JSON.parse(ev.data);
      // v4: FINISH, FINISH_ONLY_WABA (no number yet), FINISH_WHATSAPP_BUSINESS_APP_ONBOARDING (coexistence)
      // keep any other account IDs Meta adds to the event (e.g. waac_id / cs_id during the account-model rollout)
      if (d.type === 'WA_EMBEDDED_SIGNUP' && /^FINISH/.test(d.event)) { const { phone_number_id, waba_id, business_id, ...rest } = d.data || {}; session = { phoneNumberId: phone_number_id || null, wabaId: waba_id, businessId: business_id || null, event: d.event, extraIds: Object.fromEntries(Object.entries(rest).filter(([k, v]) => /_id$/.test(k) && typeof v === 'string')) }; }
      if (d.type === 'WA_EMBEDDED_SIGNUP' && d.event === 'CANCEL') $('#esmsg').textContent = `Cancelled${d.data?.current_step ? ' at ' + d.data.current_step : ''}`;
    } catch {}
  });
  if ($('#esref')) $('#esref').onclick = async () => { const r = await api(T('/whatsapp/refresh-number'), { method: 'POST' }).catch((e) => ({ ok: false, error: e.message })); $('#esmsg').textContent = r.ok ? (r.message || `Connected ${r.displayPhoneNumber || ''} ✅`) : '⚠️ ' + r.error; if (r.numberStatus === 'active') overview(); };
  const loadSdk = () => new Promise((res) => {
    if (window.FB) return res();
    window.fbAsyncInit = () => { FB.init({ appId: cfg.appId, autoLogAppEvents: true, xfbml: false, version: cfg.graphVersion }); res(); };
    const sc = document.createElement('script'); sc.src = 'https://connect.facebook.net/en_US/sdk.js'; sc.async = true; sc.crossOrigin = 'anonymous'; document.head.appendChild(sc);
  });
  const launch = async (coexistence) => {
    await loadSdk();
    session = {};
    FB.login((resp) => {
      const code = resp.authResponse?.code;
      if (!code) return ($('#esmsg').textContent = 'Cancelled');
      $('#esmsg').textContent = 'Connecting…';
      setTimeout(async () => {
        if (!session.wabaId) return ($('#esmsg').textContent = '⚠️ Meta did not return the account details – please try again.');
        const r = await api(T('/whatsapp/embedded'), { method: 'POST', body: { code, ...session, coexistence } }).catch((e) => ({ ok: false, error: e.message }));
        if (!r.ok) return ($('#esmsg').textContent = '⚠️ ' + r.error);
        if (r.numberStatus !== 'active') { $('#esmsg').textContent = r.message; return; }
        toast(`Connected ${r.displayPhoneNumber || ''} ✅`);
        overview();
      }, 1000); // the FINISH message can arrive just after the login callback
    }, { config_id: cfg.configId, response_type: 'code', override_default_response_type: true, extras: coexistence ? { setup: {}, featureType: 'whatsapp_business_app_onboarding' } : { setup: {} } });
  };
  $('#esbtn').onclick = () => launch(false);
  $('#escoex').onclick = () => launch(true);
}

  if ($('#portal')) $('#portal').onclick = async () => { try { location.href = (await api(T('/billing/portal'), { method: 'POST' })).url; } catch (e) { toast(e.message); } };

      <code style="display:block;padding:10px">${esc(snippet)}</code>
      <div class="row"><div><label>Button colour</label><input id="wcolor" type="color" value="${esc(s.widget?.color || '#25d366')}"></div><div><label>Position</label><select id="wpos"><option value="right">Bottom right</option><option value="left" ${s.widget?.position === 'left' ? 'selected' : ''}>Bottom left</option></select></div>
      <div><label>Greeting</label><input id="wgreet" value="${esc(s.widget?.greeting || '')}" placeholder="Hi 👋 Need help or want to order?"></div><div><label>Pre-filled message</label><input id="wpre" value="${esc(s.widget?.prefill || 'Hi!')}"></div></div>
      <p><button class="btn" id="gsave">Save</button></p></div>`;
  const update = async () => {
    const link = `https://wa.me/${num}?text=${encodeURIComponent($('#gmsg').value)}`;
    $('#glink').value = link;
    try { await loadQr(); $('#gqr').innerHTML = ''; new QRCode($('#gqr'), { text: link, width: 180, height: 180, correctLevel: QRCode.CorrectLevel.M }); } catch { $('#gqr').textContent = 'QR library could not load'; }
  };
  $('#gmsg').oninput = update; update();
  $('#gcopy').onclick = () => { navigator.clipboard?.writeText($('#glink').value); toast('Link copied'); };
  $('#gdl').onclick = () => { const c = $('#gqr canvas'); if (!c) return; const a = document.createElement('a'); a.href = c.toDataURL('image/png'); a.download = 'whatsapp-qr.png'; a.click(); };
  $('#gsave').onclick = async () => {
    try {
      S.tenant = (await api(T('/settings'), { method: 'PATCH', body: { webchat: { enabled: $('#wcen').value === 'true', title: $('#wct').value, subtitle: $('#wcs').value, color: $('#wcc').value }, storefront: { mode: $('#smode').value, brandColor: $('#scolor').value }, widget: { color: $('#wcolor').value, position: $('#wpos').value, greeting: $('#wgreet').value, prefill: $('#wpre').value } } })).tenant;
      toast('Saved');
    } catch (e) { toast(e.message); }
  };
}

// ---------- analytics ----------
async function analytics(days = Number(store.get('wc_days')) || 30) {
  const a = await api(T(`/analytics?days=${days}`));
  const sym = S.tenant.settings.business.currencySymbol || '£';
  const m = (n) => sym + Number(n || 0).toFixed(2);
  // fill every day so gaps show as zero
  const series = [];
  const byDay = Object.fromEntries(a.byDay.map((d) => [d.day, d]));
  for (let i = days - 1; i >= 0; i--) { const d = new Date(Date.now() - i * 864e5).toISOString().slice(0, 10); series.push(byDay[d] || { day: d, orders: 0, revenue: 0 }); }
  const max = Math.max(1, ...series.map((d) => d.revenue));
  const fmtDay = (d) => new Date(d + 'T12:00:00Z').toLocaleDateString('en-GB', { day: 'numeric', month: 'short' });
  $('#app').innerHTML = `<div class="card" style="display:flex;gap:8px;align-items:center;flex-wrap:wrap"><b>Period</b>${[7, 30, 90].map((d) => `<button class="btn ${d === days ? '' : 'ghost'}" data-days="${d}">Last ${d} days</button>`).join('')}</div>
    <div class="row">
      <div class="card"><div class="mute">Revenue (after discounts)</div><div class="stat">${m(a.revenue)}</div><div class="mute">${m(a.paid_revenue)} paid</div></div>
      <div class="card"><div class="mute">Orders</div><div class="stat">${a.orders}</div><div class="mute">avg ${m(a.aov)}</div></div>
      <div class="card"><div class="mute">Chats → buyers</div><div class="stat">${a.conversion}%</div><div class="mute">${a.buyers} of ${a.chats} chatting customers</div></div>
      <div class="card"><div class="mute">Customers</div><div class="stat">${a.newCustomers}</div><div class="mute">new · ${a.repeatCustomers} repeat buyers</div></div></div>
    <div class="card"><h2>Revenue per day</h2>
      <div class="bars" role="img" aria-label="Revenue per day bar chart">${series.map((d) => `<div class="bw"><div class="bar" style="height:${(d.revenue / max) * 100}%"></div><div class="tip">${fmtDay(d.day)} · ${m(d.revenue)} · ${d.orders} order${d.orders === 1 ? '' : 's'}</div></div>`).join('')}</div>
      <div class="axis"><span>${fmtDay(series[0].day)}</span><span>max ${m(max)}</span><span>${fmtDay(series.at(-1).day)}</span></div>
      <details style="margin-top:8px"><summary class="mute">Show as table</summary><div class="tablewrap"><table><tr><th>Day</th><th>Orders</th><th>Revenue</th></tr>${series.filter((d) => d.orders).map((d) => `<tr><td>${fmtDay(d.day)}</td><td>${d.orders}</td><td>${m(d.revenue)}</td></tr>`).join('') || '<tr><td colspan="3" class="mute">No orders</td></tr>'}</table></div></details></div>
    <div class="row"><div class="card"><h2>Top products</h2><table><tr><th>Product</th><th>Qty</th><th>Sales (before discounts)</th></tr>${a.topProducts.map((p) => `<tr><td>${esc(p.title)}</td><td>${p.quantity}</td><td>${m(p.revenue)}</td></tr>`).join('') || '<tr><td colspan="3" class="mute">No sales yet</td></tr>'}</table></div>
      <div class="card"><h2>Promo codes</h2><table><tr><th>Code</th><th>Orders</th><th>Discount given</th></tr>${a.promos.map((p) => `<tr><td>${esc(p.code)}</td><td>${p.orders}</td><td>${m(p.discount)}</td></tr>`).join('') || '<tr><td colspan="3" class="mute">No promo orders</td></tr>'}</table></div></div>`;
  $('#app').querySelectorAll('[data-days]').forEach((b) => (b.onclick = () => { store.set('wc_days', b.dataset.days); analytics(Number(b.dataset.days)); }));
}

// ---------- team ----------
async function team() {
  const { staff } = await api(T('/staff'));
  $('#app').innerHTML = `<div class="card"><h2>Team logins</h2><p class="mute"><b>Staff</b> can see orders, inbox, analytics and the test bot. <b>Owner</b> can also change settings, AI, broadcasts and the team. Each person signs in with the tenant ID <code>${esc(S.tenantId)}</code> and their own key.</p>
    <div class="row"><div><label>Name</label><input id="sn"></div><div><label>Role</label><select id="sr"><option value="staff">Staff</option><option value="owner">Owner</option></select></div><div style="align-self:end"><button class="btn" id="sa">Add team member</button></div></div><div id="skey"></div></div>
    <div class="card"><h2>Activity log</h2><div class="tablewrap" style="max-height:320px;overflow:auto"><table id="audit"><tr><td class="mute">Loading…</td></tr></table></div></div>
    <div class="card"><table><tr><th>Name</th><th>Role</th><th>Added</th><th></th></tr>${staff.map((m) => `<tr><td>${esc(m.name)}</td><td>${esc(m.role)}</td><td>${esc(m.created_at)}</td><td><button class="btn ghost" data-del="${m.id}">Remove</button></td></tr>`).join('') || '<tr><td colspan="4" class="mute">No team members yet</td></tr>'}</table></div>`;
  api(T('/audit')).then((r) => { $('#audit').innerHTML = '<tr><th>When (UTC)</th><th>Who</th><th>Action</th><th>Result</th></tr>' + r.audit.map((x) => `<tr><td class="mute">${esc(x.created_at)}</td><td>${esc(x.actor)}</td><td><code>${esc(x.action)}</code></td><td>${esc(x.status)}</td></tr>`).join(''); }).catch(() => {});
  $('#sa').onclick = async () => {
    try { const r = await api(T('/staff'), { method: 'POST', body: { name: $('#sn').value, role: $('#sr').value } }); await team(); $('#skey').innerHTML = `<p>✅ Key for ${esc($('#sn').value || 'member')} (shown once): <code>${esc(r.key)}</code></p>`; } catch (e) { toast(e.message); }
  };
  $('#app').querySelectorAll('[data-del]').forEach((b) => (b.onclick = async () => { if (confirm('Remove this team member?')) { await api(T('/staff/' + b.dataset.del), { method: 'DELETE' }); team(); } }));
}

// ---------- broadcast ----------
async function broadcast() {
  const { customers } = await api(T('/customers'));
  const opted = customers.filter((c) => c.opted_in_marketing).length;
  $('#app').innerHTML = `<div class="card"><h2>Broadcast offer</h2><p class="mute">WhatsApp only allows marketing via <b>approved templates</b> (create them in Meta Business Manager → WhatsApp Manager → Message templates). Sends to the ${opted} customers who opted in.</p>
    <div class="row"><div><label>Template name</label><input id="bt" placeholder="weekend_offer"></div><div><label>Language code</label><input id="bl" value="en_GB"></div></div>
    <label>Body variables (comma separated, optional)</label><input id="bv" placeholder="20%, SALE20">
    <p><button class="btn" id="bs">Send broadcast</button></p><pre id="br" class="mute"></pre></div>
    <div class="card"><h2>Customers (${customers.length})</h2><div class="tablewrap"><table><tr><th>Name</th><th>WhatsApp</th><th>Offers</th><th>Last seen</th></tr>${customers.slice(0, 200).map((c) => `<tr><td>${esc(c.name || '')}</td><td>+${esc(c.wa_id)}</td><td>${c.opted_in_marketing ? '✅' : '—'}</td><td>${esc(c.last_seen_at || '')}</td></tr>`).join('')}</table></div></div>`;
  $('#bs').onclick = async () => {
    const vars = $('#bv').value.split(',').map((x) => x.trim()).filter(Boolean);
    const components = vars.length ? [{ type: 'body', parameters: vars.map((text) => ({ type: 'text', text })) }] : undefined;
    if (!confirm(`Send template "${$('#bt').value}" to ${opted} customers?`)) return;
    try { $('#br').textContent = JSON.stringify(await api(T('/broadcasts'), { method: 'POST', body: { template: $('#bt').value, language: $('#bl').value, components } }), null, 2); } catch (e) { $('#br').textContent = e.message; }
  };
}

S.key ? boot().catch(loginView) : loginView();
</script>
